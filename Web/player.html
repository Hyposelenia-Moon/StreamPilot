            logToHost(core.LOG_LEVELS.WARN, '重建后恢复播放位置失败：' + (error && error.message ? error.message : error));
          }
        }

        if (state.pausedByUser) {
          logToHost(core.LOG_LEVELS.INFO, '重建播放器时保持用户暂停状态');
          return;
        }

        elements.video.play().catch(function onRebuildPlayFailed(error) {
          logToHost(core.LOG_LEVELS.WARN, '重建后继续播放失败：' + (error && error.message ? error.message : error));
        });
      }

      /**
       * 生成一个按指定配置就绪的引擎实例（重建路径的"创建"一半）。
       *
       * 刻意**不**复用 `startCandidate`：那条路径会重置暂停态、重发 `candidate-active`、
       * 重新走首帧判定，于是"换档位"会变成"重新开一次会话"（重复上报、状态行闪回）。
       * 这里只做"销毁旧的 → 按新配置建新的 → 重新挂载并回到同一位置"。
       * @param {object} snapshot 必须保留的状态快照。
       * @param {object} config 目标配置。
       * @returns {object|null} 新引擎实例；环境不支持或创建失败时返回 null。
       */
      function createEngineForRebuild(snapshot, config) {
        const candidate = snapshot.currentCandidate;
        const isHls = core.engineKindForCandidate(candidate) === core.ENGINE_KINDS.HLS;
        if (isHls ? !canPlayHls() : !canPlayFlv()) {
          logToHost(core.LOG_LEVELS.WARN, '当前环境不支持该线路的播放引擎，无法按新配置重建');
          return null;
        }

        const run = state.run;
        let created;
        try {
          if (isHls) {
            created = new window.Hls(config);
            attachPlayerEvents(run, candidate, created, false);
            created.loadSource(candidate.url);
            created.attachMedia(elements.video);
          } else {
            created = window.mpegts.createPlayer(
              { type: 'flv', isLive: true, url: candidate.url, hasAudio: true, hasVideo: true },
              config);
            attachPlayerEvents(run, candidate, created, true);
            created.attachMediaElement(elements.video);
            created.load();
          }
        } catch (error) {
          logToHost(core.LOG_LEVELS.ERROR, '按新配置重建播放器失败：' + (error && error.message ? error.message : error));
          return null;
        }

        return created;
      }

      /**
       * 销毁旧实例并按新配置重建，随后把快照里的状态原样恢复。
       * @param {object} snapshot 状态快照。
       * @param {object} config 目标配置。
       * @returns {object|null} 新引擎实例；失败返回 null。
       */
      function recreatePlayerWithConfig(snapshot, config) {
        destroyPlayer();
        const created = createEngineForRebuild(snapshot, config);
        if (!created) {
          return null;
        }

        state.ownedPlayer = created;
        // 重建不是新会话：位置回到重建前的值，且不清 `playbackStarted`（否则会重复触发首帧逻辑并重复上报）。
        if (state.run) {
          state.run.lastPlaybackPosition = snapshot.positionSeconds;
          state.run.lastPlaybackProgressAt = Date.now();
        }

        restoreMediaAfterRebuild(snapshot);
        return created;
      }

      /**
       * 把当前档位与追帧开关应用到正在播放的播放器，并**确认是否真的生效**。
       *
       * SP-01：过去这里直接调用引擎实例上的 `configure`（两家引擎都没有这个方法）就返回，于是
       * "停止追帧 / 换档位"只改了页面字段与 UI 文案，引擎配置一个字没变。
       * 现在一切交给 `core.applyEngineConfigWithBackoff`（内部仍是 `core.applyEngineConfig` 的判定）：
       *  - hls.js 走热改（改 `hls.config.*` 并读回校验）；
       *  - mpegts.js 走受控重建（保留候选 / 队列 / 会话号 / 暂停态 / 阶段 / 音量 / 档位）。
       * 只有 `{ok:true}` 才允许调用方 `setStatus` 与上报成功；失败一律上报失败并保持原状态。
       *
       * 受控重建（mpegts.js）会在**断开旧连接之后**做一次有界退避再建新连接
       * （见 `core.applyEngineConfigWithBackoff`）：上游对同一条签名地址的并发连接有限流，
       * 立刻重连会撞上还没回收的旧连接，表现为首帧偶发变慢。退避窗口内不改状态行阶段、
       * 不产生任何上报，因此状态行不会闪回「播放中」，也不会重复上报。
       * @param {object} run 运行对象。
       * @param {string} message 成功时的描述（如"停止自动追帧"）。
       * @param {object} [extras] 上报附加字段。
       * @returns {Promise<boolean>} 生效返回 true；失败时已上报失败并保持原状态，返回 false。
       */
      async function applyPlayerTargetConfig(run, message, extras) {
        const snapshot = core.snapshotRuntimeState(run, state, {
          volumePercent: elements.volume.value,
          positionSeconds: elements.video.currentTime,
        });
        const config = core.buildEngineConfig(run, run.currentCandidate);
        const outcome = await core.applyEngineConfigWithBackoff({
          engineKind: core.engineKindForCandidate(run.currentCandidate),
          player: state.ownedPlayer,
          config: config,
          snapshot: snapshot,
          // 重建前置动作：先断开旧连接（退避因此发生在"旧连接已断、新连接未建"之间）。
          prepareRebuild: function disconnectBeforeRebuild() {
            if (isActive(run)) {
              destroyPlayer();
            }
          },
          rebuild: function rebuildWithConfig() {
            return isActive(run) ? recreatePlayerWithConfig(snapshot, config) : null;
          },
        });

        if (!isActive(run)) {
          // 退避窗口里会话已经结束或被替换：旧会话的结论不得再改 UI 或上报。
          return false;
        }

        if (!outcome.ok) {
          const detail = '（原因：' + outcome.reason + '）';
          logToHost(core.LOG_LEVELS.WARN, '应用追帧配置未生效：' + message + detail);
          report(outbound.WARNING, '追帧配置未生效：' + message + detail, run, run.currentCandidate, {
            reason: outcome.reason,
            path: outcome.action,
          });
          // 保持原状态：状态行按当前会话阶段重画，档位与开关的文案由调用方回滚。
          setStatus(core.resolvePlaybackStatusText(run, state));
          return false;
        }

        logToHost(core.LOG_LEVELS.INFO, message
          + (outcome.action === core.ENGINE_APPLY_ACTIONS.REBUILD ? '（已按新配置重建播放器）' : '（已热改播放器配置）'));
        report(outbound.STATUS, message, run, run.currentCandidate, Object.assign({
          autoChaseEnabled: core.shouldAutoChase(run),
          extremeTargetMs: run.extremeTargetMs,
          applyPath: outcome.action,
        }, extras || {}));
        return true;
      }

      /** 把「缓冲」下拉同步到当前会话的模式（未播放时用 state.mode）。 */
      function syncModeSelect() {
        const mode = state.run ? state.run.mode : state.mode;
        const value = mode === 'extreme' ? 'extreme' : 'stable';
        if (elements.modeSelect.value !== value) {
          elements.modeSelect.value = value;
        }
      }

      /**
       * 切换播放模式（稳定缓冲 / 极限追帧）。
       *
       * 模式与"追帧开关"是两回事：稳定缓冲允许较大缓冲、抗抖动；极限追帧把延迟压到
       * 目标档位、缓冲超过阈值就硬跳。切换走与换档位同一套引擎配置应用（受控重建前有一次有界退避），
       * await 结论后再决定是否回滚，避免"界面显示新模式、引擎仍跑旧模式"。
       * @param {string} mode 目标模式（stable / extreme）。
       */
      async function applyPlaybackMode(mode) {
        const run = state.run;
        const previousMode = run ? run.mode : state.mode;
        state.mode = mode;
        if (!run) {
          // 空闲：只记住模式并上报，下次播放由宿主按已持久化的模式开播。
          reportPlaybackMode(mode);
          syncModeSelect();
          return;
        }

        run.mode = mode;
        run.extreme = mode === 'extreme';
        const message = mode === 'extreme'
          ? '已切换到极限追帧（目标 ' + run.extremeTargetMs + ' ms）'
          : '已切换到稳定缓冲（允许较大缓冲）';
        if (!(await applyPlayerTargetConfig(run, message, { mode: mode }))) {
          // 配置没生效：回滚模式与下拉，UI 与上报都不得声称成功。
          run.mode = previousMode;
          run.extreme = previousMode === 'extreme';
          syncModeSelect();
          return;
        }

        if (mode === 'extreme') {
          // 切到极限追帧后立刻追一次，让画面贴近直播边缘。
          chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        }

        reportPlaybackMode(mode);
        syncModeSelect();
        setStatus(core.resolvePlaybackStatusText(run, state));
      }

      /** 刷新"暂停播放 / 继续播放"按钮文案与画面状态提示。 */
      function updatePauseButton() {
        const paused = state.pausedByUser;
        elements.pauseBtn.textContent = paused ? '继续' : '暂停';
        elements.pauseBtn.title = paused ? '从当前位置继续播放' : '暂停但不结束会话（地址与缓冲保留）';
      }

      /**
       * 暂停 / 继续播放：暂停不销毁播放器，保留会话与当前地址。
       * @param {boolean} [paused] 目标状态；缺省时在两种状态之间切换。
       */
      function togglePausePlayback(paused) {
        const run = state.run;
        if (!state.pausedByUser && !isActive(run)) {
          logToHost(core.LOG_LEVELS.WARN, '当前没有正在播放的会话');
          return;
        }

        const wantPause = typeof paused === 'boolean' ? paused : !state.pausedByUser;
        if (wantPause) {
          state.pausedByUser = true;
          state.pausedAtSeconds = elements.video.currentTime;
          try {
            elements.video.pause();
          } catch (error) {
            logToHost(core.LOG_LEVELS.WARN, '暂停失败：' + (error && error.message ? error.message : error));
          }

          updatePauseButton();
          // 用户暂停是操作态：状态行固定显示暂停文案，遥测只更新数值、不再改它。
          applyPlaybackPhase(core.PLAYBACK_PHASES.PAUSED, run);
          logToHost(core.LOG_LEVELS.INFO, '已暂停播放，会话与地址保留');
          report(outbound.STATUS, '已暂停播放', run, run ? run.currentCandidate : null);
          return;
        }

        resumePlayback(run);
      }

      /** 继续播放：离直播边缘太远时先跳到缓冲末端，避免落后越来越多。 */
      function resumePlayback(run) {
        state.pausedByUser = false;
        state.resumedAt = Date.now();
        if (run) {
          run.lastPlaybackProgressAt = state.resumedAt;
          run.lastPlaybackPosition = elements.video.currentTime;
          run.runawayChaseAttempts = 0;
          run.runawayHandledAt = 0;
        }

        const buffered = core.getLocalBufferSeconds(elements.video.buffered, elements.video.currentTime);
        if (buffered !== null && buffered > core.PLAY_RESTORE_TOLERANCE_SECONDS) {
          chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        }

        updatePauseButton();
        // 回到播放中：状态行立刻回到「播放中 · N ms（…）」，延迟数值等下一轮遥测刷新。
        applyPlaybackPhase(core.PLAYBACK_PHASES.PLAYING, run);
        elements.video.play().then(function onResumed() {
          logToHost(core.LOG_LEVELS.INFO, '已从当前位置继续播放');
          report(outbound.STATUS, '已继续播放', run, run ? run.currentCandidate : null);
        }).catch(function onFailed(error) {
          logToHost(core.LOG_LEVELS.ERROR, '继续播放失败：' + (error && error.message ? error.message : error));
          setHintLocked('继续播放失败，请重新点「播放」。', 'warn', 8000);
        });
      }

      /**
       * 请求宿主开始播放当前已解析的直播间。
       * @param {boolean} silent 为 true 时不改状态行（页面初始化阶段的静默同步）。
       */
      function requestPlayFromHost(silent) {
        report(outbound.REQUEST_PLAY, '页面请求开始播放');
        if (!silent) {
          setStatus('正在请求主程序开始播放…');
          logToHost(core.LOG_LEVELS.INFO, '已请求主程序开始播放当前已解析的房间');
        }
      }

      /**
       * 用户点了「停止播放」：结束会话、销毁播放器、把画面关掉，并请宿主回收中继。
       *
       * 与「暂停播放」的区别：暂停只 `video.pause()`（保留播放器、地址与缓冲，可原地继续），
       * 停止则释放整套会话——画面回到空态，宿主释放中继，下次观看要点「开始播放」重新解析下发。
       * 必须上报宿主：中继地址由宿主注册，不通知它就会一直挂着没人回收。
       */
      function requestStopFromHost() {
        const run = state.run;
        if (!run && !state.pausedByUser) {
          logToHost(core.LOG_LEVELS.WARN, '当前没有正在播放的会话，停止请求已忽略');
          return;
        }

        report(outbound.REQUEST_STOP, '用户点了「停止播放」', run, run ? run.currentCandidate : null);
        handleStop();
        logToHost(core.LOG_LEVELS.INFO, '已停止播放并销毁播放器，画面已关闭');
      }

      /** 处理宿主下发的 chase 消息。 */
      function handleChase(payload) {
        const keep = payload && payload.keepSeconds;
        if (chaseToLiveEdge(keep)) {
          logToHost(core.LOG_LEVELS.INFO, '已追帧到直播最新位置');
        } else {
          logToHost(core.LOG_LEVELS.WARN, '追帧失败：缓冲区为空');
        }
      }

      /** 处理宿主下发的 stop 消息（兼容旧宿主：结束会话并回到空态）。 */
      function handleStop() {
        if (state.run) {
          emitSessionSummary(state.run, '用户停止播放');
          report(outbound.STATUS, '播放已停止', state.run, state.run.currentCandidate);
          stopRun(state.run);
          state.run = null;
        }

        destroyPlayer();
        state.currentStreamUrl = '';
        state.autoplayBlocked = false;
        state.autoplayStartedAt = 0;
        state.pausedByUser = false;
        state.resumedAt = 0;
        updatePauseButton();
        // 会话已结束：下拉回到上次记住的模式，避免停播后仍显示会话里的旧选择。
        syncModeSelect();
        showEmptyState();
        // 停止同样是操作态：文案固定为「已停止播放（画面已关闭）」，不会再被遥测或初始化文案覆盖。
        state.reconnectAttempt = 0;
        applyPlaybackPhase(core.PLAYBACK_PHASES.STOPPED, null);
      }

      /** 更新音量：界面与视频元素用同一份夹取后的百分比；有声音时同时记住它供"点画面切换静音"使用。 */
      function applyVolume(value) {
        const percent = core.clampVolumePercent(value);
        elements.video.volume = core.volumePercentToGain(percent);
        elements.video.muted = core.shouldMuteAtVolume(percent);
        elements.volume.value = String(percent);
        elements.volumeLabel.textContent = percent + '%';
        elements.volDisplay.textContent = '音量：' + percent + '%';
        elements.volDisplay.classList.remove('hidden');
        window.setTimeout(function hideVolume() {
          elements.volDisplay.classList.add('hidden');
        }, 1500);
        /*
          只要确实有声音就记下这个音量：video 元素默认带 muted 属性（与参考播放页一致，
          避免首帧前的试音），起播兜底路径会立刻用本函数恢复音量。
          若只在 remember=true 时记录，兜底恢复后"点画面切换静音"会退回到 0%。
        */
        if (percent > 0) {
          state.lastVolume = percent;
          state.muteToggleVolume = percent;
        }
      }

      /** 绑定控件事件。 */
      /**
       * 参数层的「统计」开关：打开后在画面右上角显示分辨率、帧率、码率与编码。
       *
       * 帧率与码率都靠两次采样差分算出来（presentedFrames / decodedByteCount），
       * 不解析容器、也不把播放速率当帧率；首次采样只建基线，所以刚打开时显示「—」是正常的。
       */
      const statsState = {
        enabled: false,
        timer: null,
        lastAt: 0,
        lastFrames: 0,
        lastVideoBytes: null,
        lastAudioBytes: null,
        fps: null,
        videoKbps: null,
        audioKbps: null,
      };

      /** 切换统计浮层；重新打开时清空采样基线，避免拿上一次会话的差值算码率。 */
      function setStatsVisible(visible) {
        statsState.enabled = Boolean(visible);
        if (elements.statsPanel) {
          elements.statsPanel.classList.toggle('hidden', !statsState.enabled);
          elements.statsPanel.setAttribute('aria-hidden', String(!statsState.enabled));
        }

        if (elements.statsBtn) {
          elements.statsBtn.classList.toggle('active', statsState.enabled);
        }

        if (statsState.enabled) {
          statsState.lastAt = 0;
          statsState.lastFrames = 0;
          statsState.lastVideoBytes = null;
          statsState.lastAudioBytes = null;
          renderStats();
          statsState.timer = window.setInterval(renderStats, 1000);
          return;
        }

        if (statsState.timer !== null) {
          window.clearInterval(statsState.timer);
          statsState.timer = null;
        }
      }

      /** 采样一次，更新帧率与码率（第一次调用只记基线）。 */
      function collectStats() {
        const video = elements.video;
        const now = performance.now();
        const quality = typeof video.getVideoPlaybackQuality === 'function' ? video.getVideoPlaybackQuality() : null;
        const frames = quality ? Number(quality.totalVideoFrames) || 0 : 0;
        const videoBytes = typeof video.webkitVideoDecodedByteCount === 'number' ? video.webkitVideoDecodedByteCount : null;
        const audioBytes = typeof video.webkitAudioDecodedByteCount === 'number' ? video.webkitAudioDecodedByteCount : null;

        const elapsed = (now - statsState.lastAt) / 1000;
        if (statsState.lastAt > 0 && elapsed >= 0.4) {
          if (frames >= statsState.lastFrames) {
            statsState.fps = (frames - statsState.lastFrames) / elapsed;
          }

          if (videoBytes !== null && statsState.lastVideoBytes !== null && videoBytes >= statsState.lastVideoBytes) {
            statsState.videoKbps = ((videoBytes - statsState.lastVideoBytes) * 8) / elapsed / 1000;
          }

          if (audioBytes !== null && statsState.lastAudioBytes !== null && audioBytes >= statsState.lastAudioBytes) {
            statsState.audioKbps = ((audioBytes - statsState.lastAudioBytes) * 8) / elapsed / 1000;
          }
        }

        statsState.lastAt = now;
        statsState.lastFrames = frames;
        statsState.lastVideoBytes = videoBytes;
        statsState.lastAudioBytes = audioBytes;
      }

      /** 把「标签 / 值」写进浮层；顺序与主流网页播放器的统计面板一致。 */
      function renderStats() {
        if (!statsState.enabled || !elements.statsList) {
          return;
        }

        collectStats();

        const video = elements.video;
        const candidate = state.run ? state.run.currentCandidate : null;
        const quality = typeof video.getVideoPlaybackQuality === 'function' ? video.getVideoPlaybackQuality() : null;
        const dropped = quality ? Number(quality.droppedVideoFrames) || 0 : 0;
        const total = quality ? Number(quality.totalVideoFrames) || 0 : 0;
        const bufferSeconds = core.getLocalBufferSeconds(video.buffered, video.currentTime);

        const rows = [
          ['分辨率', video.videoWidth > 0 && video.videoHeight > 0 ? video.videoWidth + ' × ' + video.videoHeight : '—'],
          ['帧率', statsState.fps !== null ? Math.round(statsState.fps) + ' fps' : '—'],
          ['视频编码', describeCodec(candidate)],
          ['视频码率', statsState.videoKbps !== null ? Math.round(statsState.videoKbps) + ' kbps' : '—'],
          ['音频编码', candidate ? 'AAC' : '—'],
          ['音频码率', statsState.audioKbps !== null ? Math.round(statsState.audioKbps) + ' kbps' : '—'],
          ['缓冲', bufferSeconds.toFixed(1) + ' 秒'],
          ['已播', formatStatDuration(video.currentTime)],
          ['丢帧', total > 0 ? dropped + ' / ' + total : '—'],
          ['线路', candidate && candidate.cdnHost ? candidate.cdnHost : '—'],
        ];

        const fragment = document.createDocumentFragment();
        for (const [label, value] of rows) {
          const term = document.createElement('dt');
          term.textContent = label;
          const detail = document.createElement('dd');
          detail.textContent = value;
          fragment.append(term, detail);
        }

        elements.statsList.replaceChildren(fragment);
      }

      /** 编码展示名：页面只拿得到 hevc / avc 两个值。 */
      function describeCodec(candidate) {
        if (!candidate || !candidate.codec) {
          return '—';
        }

        return candidate.codec === 'hevc' ? 'H.265 (HEVC)' : candidate.codec === 'avc' ? 'H.264 (AVC)' : String(candidate.codec);
      }

      /** 秒数转 分:秒 / 时:分:秒（统计面板的「已播」）。 */
      function formatStatDuration(seconds) {
        const total = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const rest = total % 60;
        const pad = function pad(value) {
          return String(value).padStart(2, '0');
        };

        return hours > 0 ? hours + ':' + pad(minutes) + ':' + pad(rest) : pad(minutes) + ':' + pad(rest);
      }

      function bindControls() {
        elements.volume.addEventListener('input', function onVolumeInput() {
          applyVolume(elements.volume.value);
        });

        elements.video.addEventListener('click', function onVideoClick() {
          // 被自动播放策略拦住时，点画面是"开始播放"；否则沿用点画面切换静音。
          if (state.autoplayBlocked) {
            resumeBlockedPlayback();
            return;
          }

          const next = elements.video.muted ? state.lastVolume : 0;
          applyVolume(next);
        });

        /*
          全屏：只用 #stage 作为全屏元素（video 填满 stage），并显式处理 Promise 失败，
          避免"点了没反应"却没有任何反馈。
        */
        function requestStageFullscreen() {
          const target = elements.stage;
          if (!target || typeof target.requestFullscreen !== 'function') {
            setHintLocked('当前内核不支持全屏 API，可用主界面的窗口最大化代替。', 'warn', 6000);
            return;
          }

          const request = target.requestFullscreen();
          if (request && typeof request.then === 'function') {
            request.then(function onEntered() {
              logToHost(core.LOG_LEVELS.INFO, '已进入全屏');
            }).catch(function onFailed(error) {
              logToHost(core.LOG_LEVELS.ERROR, '进入全屏失败：' + (error && error.message ? error.message : error));
              setHintLocked('进入全屏失败，可尝试双击画面或按 F11。', 'warn', 6000);
            });
          }
        }

        function exitStageFullscreen() {
          const request = document.exitFullscreen();
          if (request && typeof request.then === 'function') {
            request.catch(function onFailed(error) {
              logToHost(core.LOG_LEVELS.ERROR, '退出全屏失败：' + (error && error.message ? error.message : error));
            });
          }
        }

        function toggleFullscreen() {
          if (document.fullscreenElement) {
            exitStageFullscreen();
          } else {
            requestStageFullscreen();
          }
        }

        elements.fsBtn.addEventListener('click', toggleFullscreen);
        elements.video.addEventListener('dblclick', toggleFullscreen);

        document.addEventListener('fullscreenchange', function onFullscreenChange() {
          const fullscreen = Boolean(document.fullscreenElement);
          /*
            提示的可见性只由"是否已经在播"决定：过去这里在退出全屏时无条件取消隐藏，
            于是被藏起来的空态文案（等待直播源）又盖回画面，看起来像直播源丢了。
          */
          elements.hint.classList.toggle('hidden', core.shouldHideHint(state.run));
          elements.volDisplay.classList.add('hidden');
          document.body.style.cursor = fullscreen ? 'none' : 'default';
          elements.fsBtn.textContent = fullscreen ? '退出全屏' : '全屏';
          // 进 / 出全屏都把控制条亮出来：刚切过去就淡出会让人以为控件没了。
          showControls();
          // 全屏下宿主不允许展开面板，恢复入口随之隐藏。
          syncPanelButton();

          /*
            关键：把全屏状态告诉宿主。WebView2 只有在宿主把对应元素标记为全屏元素
            （CoreWebView2.ContainsFullScreenElement）后才会真正铺满窗口，
            否则"点了全屏但画面尺寸不变"，看起来就是全屏失败。
          */
          report(fullscreen ? outbound.FULLSCREEN_ENTER : outbound.FULLSCREEN_EXIT, fullscreen ? '进入全屏' : '退出全屏');
        });

        document.addEventListener('keydown', function onKeyDown(event) {
          if (event.key === 'F11' || (event.key === 'Enter' && event.altKey)) {
            event.preventDefault();
            toggleFullscreen();
            return;
          }

          /*
            焦点在播放页里时，WPF 的快捷键收不到（WebView2 是原生窗口，键盘事件到不了宿主），
            所以 Ctrl+B 在这里也处理一次；宿主侧另有同名兜底，两边都只在折叠态才真的做事。
          */
          if (event.ctrlKey && (event.key === 'b' || event.key === 'B') && uiState.panelCollapsed) {
            event.preventDefault();
            if (hostChannel) {
              hostChannel.post({ type: 'panel-expand' });
            }
          }
        });

        elements.lineSelect.addEventListener('change', function onLineChange() {
          const run = state.run;
          if (!run) {
            return;
          }

          void applyManualLine(run, elements.lineSelect.value);
        });

        elements.qualitySelect.addEventListener('change', function onQualityChange() {
          const key = elements.qualitySelect.value;
          if (!key || key === state.qualityKey) {
            return;
          }

          state.qualityKey = key;
          report(outbound.QUALITY, '切换画质：' + (elements.qualitySelect.selectedOptions[0]?.textContent || key), state.run, state.run?.currentCandidate, { key: key });
        });

        elements.modeSelect.addEventListener('change', function onModeChange() {
          const mode = elements.modeSelect.value === 'extreme' ? 'extreme' : 'stable';
          void applyPlaybackMode(mode);
        });

        elements.pauseBtn.addEventListener('click', function onPauseClick() {
          togglePausePlayback();
        });

        elements.playBtn.addEventListener('click', function onPlayClick() {
          requestPlayFromHost(false);
        });

        elements.stopBtn.addEventListener('click', function onStopClick() {
          requestStopFromHost();
        });
      }

      /**
       * 渲染线路下拉：候选按宿主顺序排列，第一条是主线路，其余是备用线路。
       * @param {object} plan 播放计划。
       * @remarks
       * 与「画质」不同，线路切换是**同一画质下换 CDN**：不重新解析、不改码率，
       * 等价官方播放器的「主线路 / 备用线路」。下拉里只显示主/备线名称，不暴露地址。
       */
      function renderLines(plan) {
        const candidates = plan && Array.isArray(plan.candidates) ? plan.candidates : [];
        elements.lineSelect.replaceChildren();

        candidates.forEach(function addLine(item, index) {
          const option = document.createElement('option');
          option.value = String(item.sourceIndex);
          option.textContent = index === 0 ? '主线路' : '备用线路 ' + index;
          elements.lineSelect.appendChild(option);
        });

        elements.lineSelect.disabled = candidates.length <= 1;
        elements.lineSelect.title = candidates.length <= 1
          ? '当前房间只有一条线路'
          : '手动选择 CDN 线路（不影响画质）';
        elements.lineSelect.value = candidates.length > 0 ? String(candidates[0].sourceIndex) : '';
      }

      /**
       * 手动切换线路：选中线路排到队首，其余候选保留为后备。
       * @param {object} run 运行对象。
       * @param {string} value 下拉值（'auto' 或候选的 sourceIndex）。
       * @returns {Promise<void>} 切换完成的 Promise。
       */
      async function applyManualLine(run, value) {
        if (!isActive(run)) {
          return;
        }

        const chosen = run.candidates.find(function match(item) {
          return String(item.sourceIndex) === String(value);
        });
        if (!chosen) {
          return;
        }

        // 选中线路优先，其余保持原顺序兜底：主线路失败仍会自动落到备用线路。
        run.queue = [chosen, ...run.candidates.filter(function other(item) {
          return item !== chosen;
        })];
        run.switching = false;
        report(outbound.WARNING, '手动切换线路：' + chosen.host, run, chosen);
        await startCandidate(run, chosen);
      }

      /**
       * 渲染画质下拉：始终显示，只有一档时显示当前档位并禁用切换。
       * @param {object} payload 宿主下发的 play 消息。
       */
      function renderQualities(payload) {
        const normalized = core.normalizeQualities(payload?.qualities, payload?.selectedQualityKey);
        state.qualityKey = normalized.selectedKey;
        elements.qualitySelect.replaceChildren();
        for (const item of normalized.items) {
          const option = document.createElement('option');
          option.value = item.key;
          option.textContent = item.label;
          option.selected = item.selected;
          elements.qualitySelect.appendChild(option);
        }

        // 只有一档也显示：用户需要看到"当前就是最高档"，而不是控件凭空消失。
        const canSwitch = normalized.items.length > 1;
        elements.qualitySelect.disabled = !canSwitch;
        elements.qualitySelect.title = canSwitch ? '切换画质档位' : '当前房间只有这一个档位';
      }

      /** 弹幕渲染器（脚本缺失或容器不存在时为 null，弹幕功能自动禁用）。 */
      let danmakuRenderer = null;

      /** 弹幕开关与连接状态（由宿主 danmaku-config 下发，页面不自己猜）。 */
      const danmakuState = { enabled: false, visible: false, state: 'disconnected' };

      /** 初始化弹幕渲染器。 */
      function initDanmaku() {
        const layer = document.getElementById('danmakuLayer');
        if (!layer || typeof window.DanmakuRenderer !== 'function') {
          return;
        }

        danmakuRenderer = new window.DanmakuRenderer(layer);

        const button = document.getElementById('danmakuBtn');
        if (button) {
          button.addEventListener('click', function onDanmakuToggle() {
            const next = !danmakuState.visible;
            danmakuState.visible = next;
            if (danmakuRenderer) {
              danmakuRenderer.setVisible(next);
            }

            syncDanmakuButton();
            report('danmaku-toggle', next ? '显示弹幕' : '隐藏弹幕', state.run, state.run ? state.run.currentCandidate : null, {
              visible: next,
            });

            // 上次连接失败时，重新打开等于"再试一次"：避免用户还要去设置里折腾。
            if (next && danmakuState.state === 'failed') {
              report('danmaku-retry', '重试弹幕连接', state.run, state.run ? state.run.currentCandidate : null);
            }
          });
        }
      }

      /** 同步弹幕按钮的视觉状态与提示文案。 */
      function syncDanmakuButton() {
        const button = elements.danmakuBtn;
        if (!button) {
          return;
        }

        button.classList.toggle('active', danmakuState.visible);
        if (danmakuState.state === 'failed') {
          button.title = '弹幕连接失败（不影响视频播放）；点此重试';
          return;
        }

        button.title = danmakuState.visible
          ? '隐藏弹幕'
          : '显示弹幕（首次开启会连接弹幕服务器，可在设置里调整屏蔽词与样式）';
      }

      /** 处理宿主下发的弹幕配置：更新渲染参数与按钮状态。 */
      function handleDanmakuConfig(payload) {
        if (!payload || typeof payload !== 'object') {
          return;
        }

        danmakuState.enabled = payload.enabled === true;
        danmakuState.visible = payload.visible === true;
        danmakuState.state = typeof payload.state === 'string' ? payload.state : 'disconnected';

        if (danmakuRenderer) {
          danmakuRenderer.updateOptions(payload);
          danmakuRenderer.setVisible(danmakuState.visible);
        }

        syncDanmakuButton();
      }

      /** 处理批量弹幕消息（宿主已按类型过滤，页面负责屏蔽词/合并/精简）。 */
      function handleDanmakuBatch(payload) {
        if (!danmakuRenderer || !payload || !Array.isArray(payload.items)) {
          return;
        }

        danmakuRenderer.updateOptions(payload);
        danmakuRenderer.push(payload.items);
      }

      /** 处理弹幕连接状态（失败只记日志，不影响播放）。 */
      function handleDanmakuState(payload) {
        if (!payload || typeof payload.state !== 'string') {
          return;
        }

        danmakuState.state = payload.state;
        syncDanmakuButton();
        if (payload.state !== 'failed') {
          return;
        }

        logToHost(core.LOG_LEVELS.WARN, '弹幕连接失败（不影响视频播放）');
      }

      /** 处理来自宿主的消息。 */
      function handleHostMessage(payload) {
        if (!payload || typeof payload !== 'object') {
          return;
        }

        switch (payload.type) {
          case core.INBOUND_MESSAGE_TYPES.PLAY:
            renderQualities(payload);
            void handlePlay(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.CHASE:
            handleChase(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.STOP:
            handleStop();
            break;
          case core.INBOUND_MESSAGE_TYPES.PAUSE:
            togglePausePlayback(typeof payload.paused === 'boolean' ? payload.paused : undefined);
            break;
          case core.INBOUND_MESSAGE_TYPES.HOST_STATUS:
            applyHostStatus(payload);
            break;
          case 'danmaku':
            handleDanmakuBatch(payload);
            break;
          case 'danmaku-config':
            handleDanmakuConfig(payload);
            break;
          case 'danmaku-state':
            handleDanmakuState(payload);
            break;
          case 'player-config':
            applyPlayerUiConfig(payload);
            break;
          default:
            if (payload.type === 'volume') {
              applyVolume(payload.value);
            } else if (payload.type === 'bridge-info') {
              // 桥接地址只用于日志与宿主提示：页面从不自己拼桥接地址（候选地址一律由宿主下发）。
              const baseAddress = typeof payload.baseAddress === 'string' ? payload.baseAddress : '';
              logToHost(core.LOG_LEVELS.INFO, '桥接服务地址：' + (baseAddress || '未启动'));
            } else {
              logToHost(core.LOG_LEVELS.WARN, '收到未知消息类型：' + payload.type);
            }

            break;
        }
      }

      bindControls();
      bindControlBarVisibility();
      syncParameterRow();
      initDanmaku();
      syncModeSelect();
      applyVolume(core.INITIAL_VOLUME_PERCENT);
      updatePauseButton();
      showEmptyState();
      renderStatusLine();

      if (hostChannel) {
        hostChannel.onMessage(handleHostMessage);
      } else {
        setHint('当前不在 StreamPilot 主程序内运行：可直接用 mpv 播放解析出的地址。', 'warn');
        logToHost(core.LOG_LEVELS.WARN, '未检测到 WebView2 宿主通道，控件仍可用于本地调试。');
      }

      report(outbound.READY, 'StreamPilot 播放器已加载。', null, null, {
        hevc: hevcMseSupported,
        avc: avcMseSupported,
      });
    }());
  </script>
</body>

</html>
