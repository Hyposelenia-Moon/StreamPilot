<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamPilot 播放器</title>
  <!--
    StreamPilot 自研播放页。
    第三方库（Apache-2.0，随包分发，见 THIRD-PARTY-NOTICES.md）：
      mpegts.js 1.8.2  HTTP-FLV / MSE 低延迟播放
      hls.js 1.6.16    HLS 播放
    纯逻辑实现位于 player-core.js（同一份代码也被 node --test 覆盖）。
  -->
  <script src="./mpegts.js"></script>
  <script src="./hls.js"></script>
  <style>
    /*
      配色策略（修复"白底白字"）：
      1. html 上先给出无条件的浅色兜底（不依赖 CSS 变量），避免 :root 变量未生效时出现底色异常；
      2. color-scheme: light 让滚动条、range 等"原生控件"也走浅色，不受系统深色主题影响；
      3. 每个元素都显式声明 color/background/border，不依赖从 body 继承，杜绝"底色与文字同色"的不可读组合；
      4. 强制配色模式（Windows 高对比度）下本页面依旧保持浅色，避免系统强制色造成不可读。
    */
    html {
      background: #f5f6f8;
      color: #1f2329;
      color-scheme: light;
    }

    /* 设计令牌（design token）：颜色 / 圆角 / 间距 / 字号只在 :root 里写一次，
       控件样式一律引用变量。改主题或调色只动这一段，不用满页面找硬编码色值。 */
    :root {
      --sp-color-bg: #f5f6f8;
      --sp-color-panel: #ffffff;
      --sp-color-panel-alt: #fbfcfd;
      --sp-color-border: #e2e5ea;
      --sp-color-border-strong: #c7cdd6;
      --sp-color-text: #1f2329;
      --sp-color-text-muted: #5b6472;
      --sp-color-text-faint: #6b7280;
      --sp-color-control: #ffffff;
      --sp-color-control-active: #e8f1ff;
      --sp-color-accent: #2f6feb;
      --sp-color-accent-strong: #1b4fd8;
      --sp-color-accent-soft: #eaf1fe;
      --sp-color-warn: #b45309;
      --sp-color-error: #c0392b;
      --sp-color-ok: #1f8a4c;
      --sp-radius-sm: 6px;
      --sp-radius-md: 8px;
      --sp-radius-lg: 12px;
      --sp-space-1: 4px;
      --sp-space-2: 6px;
      --sp-space-3: 8px;
      --sp-space-4: 12px;
      --sp-space-5: 16px;
      --sp-font-body: 13px;
      --sp-font-control: 14px;
      --sp-control-height: 32px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #f5f6f8;
      color: #1f2329;
      font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* 强制配色模式下保持既定深色，避免出现"系统白底 + 本页浅色文字"的不可读组合 */
    @media (forced-colors: active) {
      html,
      body,
      footer,
      #stage,
      #controls,
      #statusBar,
      #statusLine,
      #hint,
      #volDisplay {
        forced-color-adjust: none;
        background: #f5f6f8;
        color: #1f2329;
      }

      button,
      select,
      input[type="range"] {
        forced-color-adjust: none;
        background: #ffffff;
        color: #1f2329;
        border: 1px solid #c7cdd6;
      }
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    button,
    input[type="range"] {
      font: inherit;
      color: var(--sp-color-text);
      background-color: var(--sp-color-control);
      border: 1px solid var(--sp-color-border);
      border-radius: var(--sp-radius-sm);
      /* 内边距保持字面值：控制条各控件的几何约束按 4px/8px 的字面值推导，
         改成令牌会让那条几何约束失去可读的计算依据。 */
      padding: 4px 8px;
      -webkit-appearance: none;
      appearance: none;
    }

    /* range 滑块：加大对比度，避免在某些主题下"看不见"（音量条宽度见 #volume） */
    input[type="range"] {
      padding: 0;
      height: 20px;
      background: transparent;
      border: none;
      accent-color: var(--sp-color-accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--sp-color-border-strong);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--sp-color-accent);
      border: 1px solid var(--sp-color-bg);
    }

    button {
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: var(--sp-color-accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    button.active {
      border-color: var(--sp-color-accent);
      background-color: var(--sp-color-control-active);
    }

    .spacer {
      flex: 1 1 auto;
    }

    /*
      底部控制条的抗重叠约束（曾出现"右下角堆叠"）：
      1. 每一层都允许换行（flex-wrap）+ 行间距（row-gap），控件宁可换行也不压缩重叠；
      2. 靠右的「全屏」排在主控层行尾，换行后也不会压到别的控件上；
      3. 状态行是 footer 列布局里的独立一行（见 #statusBar / #statusLine），不参与控件的行布局。
      画质、缓冲模式与播放控制都放在画面下方的 footer：
      贴着画面的控件比页头更容易点到，也避免页头在窄窗口里挤成一团。
    */
    #qualityBox,
    #modeBox,
    #lineBox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    #qualityBox .qualityLabel,
    #modeBox .qualityLabel,
    #lineBox .qualityLabel {
      color: var(--sp-color-text-faint);
      font-size: 15px;
    }

    #qualitySelect,
    #modeSelect,
    #lineSelect {
      cursor: pointer;
      border-radius: var(--sp-radius-md);
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--sp-color-border-strong);
      background: var(--sp-color-control);
      color: var(--sp-color-text);
      font-family: inherit;
      font-size: var(--sp-font-control);
      max-width: 210px;
    }

    #qualitySelect:hover,
    #modeSelect:hover,
    #lineSelect:hover {
      border-color: var(--sp-color-accent-strong);
    }

    /*
      播放控制三键比其余控件小一号：它们是高频点击项，但画面下方的横向空间有限，
      缩小后（并排的）开始 / 暂停 / 停止 不会把这一行挤成两排。
    */
    #playBtn,
    #pauseBtn,
    #stopBtn {
      padding: 5px 10px;
      font-size: 13px;
      border-radius: 6px;
    }

    #stopBtn {
      /* 停止会关闭画面，用危险色与"暂停"区分开 */
      color: var(--sp-color-error);
    }

    #fsBtn {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 8px;
      /* 与其他控件同行排列（不再用 margin-left:auto 独占行尾，否则会被挤到下一行） */
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      /* 空画面用极浅的竖向渐变，比一整块灰底更耐看；有画面后由视频内容覆盖 */
      background: linear-gradient(180deg, #fbfcfd 0%, #e8ecf2 100%);
      min-height: 0;
    }

    video {
      width: 100%;
      height: 100%;
      background-color: transparent;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    /*
      面板收起后，画面左上角出现「☰ 控制面板」。
      恢复入口只能画在页面里：WebView2 是原生 HWND，任何叠在播放区上的 WPF 按钮都会被它盖住。
      平时隐藏（体面地占着画面没有意义），只有宿主下发 panelCollapsed=true 时才出现。
    */
    #panelBtn {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 4;
      display: none;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(226, 229, 234, 0.9);
      background: rgba(255, 255, 255, 0.88);
      color: var(--sp-color-text-muted);
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(31, 35, 41, 0.12);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    #panelBtn.visible {
      display: inline-flex;
    }

    #panelBtn:hover {
      background: #ffffff;
      border-color: var(--sp-color-accent);
      color: var(--sp-color-accent-strong);
    }

    #hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      max-width: 82%;
      padding: 14px 18px;
      border-radius: var(--sp-radius-lg);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e4e8ee;
      box-shadow: 0 10px 26px rgba(31, 35, 41, 0.07);
      color: var(--sp-color-text);
      text-align: center;
      white-space: pre-wrap;
      pointer-events: none;
    }

    /* 空态：图标 + 标题 + 一句操作提示，代替原来只有一行字的白条 */
    #hint.empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 16px;
      font-weight: 600;
      padding: 30px 44px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(31, 35, 41, 0.1);
    }

    #hint.empty::before {
      content: '▶';
      display: block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      padding-left: 4px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: #eaf1fe;
      color: #1b4fd8;
      font-size: 18px;
      box-sizing: border-box;
    }

    /* 空态副文案由脚本写入 data-action（文案本体在 player-core.js，与测试同源） */
    #hint.empty::after {
      content: attr(data-action);
      font-size: 13px;
      font-weight: 400;
      color: #5b6472;
    }

    #hint[data-level="warn"] {
      border-color: #b45309;
    }

    #hint[data-level="error"] {
      border-color: #c0392b;
    }

    #hint.hidden,
    #volDisplay.hidden,
    #statsPanel.hidden,
    footer.hidden {
      display: none;
    }

    #volDisplay {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 2;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e5ea;
      color: #1f2329;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--sp-color-border);
      background: var(--sp-color-panel);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    /* 播放中鼠标静止后整条控制条淡出（全屏时最需要），鼠标一动立刻恢复 */
    footer.sp-controls-hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    /*
      控制条分两层（DOM 见 body 里的 #primaryRow / #paramRow）：
      主控层放高频操作（播放 / 暂停 / 停止、音量、弹幕、画质、全屏），参数层放"调一次就不动"的
      线路 / 追帧档位 / 追帧开关。主控层因此从 9 个控件降到 6 个，1024px 宽度下不换行。
      紧凑模式（body.sp-compact，对应设置里的「紧凑控制条（旧版一行）」）把两层摊平成一行，
      并保留原来"宁可换行也不压缩重叠"的行为。
    */
    #controls {
      display: flex;
      flex-direction: column;
      gap: var(--sp-space-2);
      padding: var(--sp-space-3) 10px var(--sp-space-2);
      color: var(--sp-color-text);
    }

    .controlRow {
      display: flex;
      align-items: center;
      gap: var(--sp-space-2);
      /* 窄窗口时换行（并保留行间距）而不是把控件压扁、压到彼此身上 */
      flex-wrap: wrap;
      row-gap: var(--sp-space-2);
    }

    /* 参数层收起：只留主控层 */
    #paramRow.sp-collapsed {
      display: none;
    }

    body.sp-compact #controls {
      flex-direction: row;
      flex-wrap: wrap;
      row-gap: var(--sp-space-2);
      padding: var(--sp-space-3) 10px;
    }

    /* display: contents 让两层的子元素直接成为 #controls 的 flex 项，等价旧版一行布局 */
    body.sp-compact .controlRow {
      display: contents;
    }

    /* 紧凑模式下参数就在同一行，不再需要收起开关 */
    body.sp-compact #paramToggle {
      display: none;
    }

    /* 音量组与播放键之间的细分隔线：同组控件靠得近，跨组的留出视觉间隔 */
    .controlDivider {
      width: 1px;
      height: 20px;
      background: var(--sp-color-border);
      margin: 0 2px;
    }

    .controlLabel {
      color: var(--sp-color-text-faint);
    }

    /* ===== 状态行 + 缓冲健康度 =====
       状态行左侧 3px 竖条表示缓冲健康度：绿（缓冲 <1s，贴着直播）/ 黄（1–3s）/ 红（>3s 或画面停滞），
       灰条表示当前没有在播（空闲 / 暂停），不假装"健康"。
    */
    #statusBar {
      display: flex;
      align-items: center;
      gap: var(--sp-space-2);
      padding: 0 10px var(--sp-space-2);
      min-height: 18px;
    }

    #healthBar {
      flex: 0 0 auto;
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--sp-color-border-strong);
      transition: background-color 200ms ease;
    }

    #healthBar[data-health="good"] {
      background: var(--sp-color-ok);
    }

    #healthBar[data-health="warn"] {
      background: var(--sp-color-warn);
    }

    #healthBar[data-health="bad"] {
      background: var(--sp-color-error);
    }

    /*
      状态行与健康条同一行，过长时用省略号收敛：
      nowrap + hidden + ellipsis 保证它只在自己这一行里被裁掉，既不会顶掉上面的控件，也不会盖住任何控件。
    */
    #statusLine {
      flex: 1 1 auto;
      color: var(--sp-color-accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* 宿主状态按级别换色：警告 / 错误要与"一切正常"的蓝色区分开（与 #hint 用同一组颜色） */
    #statusLine[data-level="warn"] {
      color: var(--sp-color-warn);
    }

    #statusLine[data-level="error"] {
      color: var(--sp-color-error);
    }

    /* ===== Toast：右下角浮层，3 秒自动消失 =====
       宿主的错误 / 警告不再长期占着状态行（状态行 6/12/20s 的分级保留作兜底），
       先弹一条看得见的提示，消失后状态行仍在。
    */
    /*
      视频统计浮层：右上角深色半透明面板。
      只在用户点「统计」时出现，不参与控制条自动隐藏——它本来就是主动打开的信息，
      跟着鼠标消失反而要反复打开。
    */
    #statsPanel {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 5;
      min-width: 236px;
      max-width: 340px;
      padding: 10px 12px;
      border-radius: var(--sp-radius-md);
      background: rgba(16, 20, 27, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f5f7fa;
      font-size: 12px;
      line-height: 1.7;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .sp-stats-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .sp-stats-list {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      margin: 0;
    }

    .sp-stats-list dt {
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
    }

    .sp-stats-list dd {
      margin: 0;
      color: #ffffff;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    #toast {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      max-width: min(420px, 72%);
      padding: 8px 12px;
      border-radius: var(--sp-radius-md);
      background: rgba(31, 35, 41, 0.92);
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(31, 35, 41, 0.24);
      white-space: pre-wrap;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    #toast.sp-visible {
      opacity: 1;
      transform: none;
    }

    #toast[data-level="warn"] {
      background: rgba(180, 83, 9, 0.95);
    }

    #toast[data-level="error"] {
      background: rgba(192, 57, 43, 0.95);
    }

    /*
      音量条固定 60px：它是控制条里最宽的单件（原 140px）。
      音量读数另有 #volumeLabel 文字，缩短滑块不影响读数。
    */
    #volume {
      width: 60px;
    }

    #volumeLabel {
      color: var(--sp-color-text-faint);
      min-width: 36px;
      text-align: right;
    }

    /* ===== 弹幕层：盖在画面上但不拦截鼠标（pointer-events: none） ===== */
    .sp-danmaku-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      color: #ffffff;
      font-size: 24px;
      opacity: 0.9;
      white-space: nowrap;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.6);
    }

    .sp-danmaku-layer.sp-danmaku-hidden {
      display: none;
    }

    .sp-danmaku-item {
      position: absolute;
      left: 100%;
      will-change: transform;
      animation-name: sp-danmaku-scroll;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes sp-danmaku-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(-100% - 100vw));
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!--
      播放页集中承载观看与播放控制：开始播放、暂停/继续、停止播放、追帧、追帧档位、画质、全屏、音量。
      页面顶部不再有状态行：状态只在画面下方的 #statusLine 里说一次，避免同一句话出现两处。
      #statusLine 同时是宿主状态文字的显示位（host-status 消息）：
      宿主消息优先、按级别换色并保留若干秒，之后回落显示页面自己的播放状态。
    -->
    <div id="stage">
      <!--
        与参考播放页一致默认静音：首帧到达前 video 仍会输出已缓冲的音频，
        不静音时用户会先听到一小段"试音"再被 applyVolume 设成 30%。
        音量滑块与点击画面都能立刻打开声音，行为不受影响。
      -->
      <video id="video" playsinline muted></video>
      <div id="danmakuLayer" class="sp-danmaku-layer sp-danmaku-hidden" aria-hidden="true"></div>
      <div id="hint" class="empty" data-level="info">等待直播源</div>
      <!-- 左侧面板收起时的恢复入口：宿主左列已归零，这里是唯一可见的开关 -->
      <button type="button" id="panelBtn" title="展开控制面板（Ctrl+B）">
        <span aria-hidden="true">☰</span><span>控制面板</span>
      </button>
      <div id="volDisplay" class="hidden">音量：30%</div>
      <div id="toast" role="alert" aria-live="polite"></div>
      <!-- 统计浮层：点参数层的「统计」开关，数据每秒刷新一次 -->
      <div id="statsPanel" class="sp-stats hidden" aria-hidden="true">
        <div class="sp-stats-title">视频统计信息</div>
        <dl id="statsList" class="sp-stats-list"></dl>
      </div>
    </div>

    <footer id="controlsBar">
      <!--
        控制条分两层：
        主控层（常驻）：播放 / 暂停 / 停止、音量、弹幕、画质、全屏；
        参数层（可收起）：线路、追帧档位、追帧开关——都是"调一次就不再动"的参数。
        分层后主控层在 1024px 宽度下不换行；设置里可切回「紧凑控制条（旧版一行）」。
      -->
      <div id="controls">
        <div id="primaryRow" class="controlRow">
          <button type="button" id="playBtn" title="播放左侧已解析的直播间">播放</button>
          <button type="button" id="pauseBtn">暂停</button>
          <button type="button" id="stopBtn" title="结束播放会话并关闭画面（与「暂停」不同）">停止</button>
          <span class="controlDivider" aria-hidden="true"></span>
          <span class="controlLabel">音量</span>
          <input id="volume" type="range" min="0" max="100" step="1" value="30" />
          <span id="volumeLabel">30%</span>
          <span class="spacer"></span>
          <button type="button" id="danmakuBtn" title="显示弹幕（首次开启会连接弹幕服务器，可在设置里调整屏蔽词与样式）">弹幕</button>
          <label id="qualityBox" for="qualitySelect">
            <span class="qualityLabel">画质</span>
            <select id="qualitySelect"></select>
          </label>
          <button type="button" id="paramToggle" aria-expanded="true" aria-controls="paramRow"
                  title="收起 / 展开线路与缓冲模式">参数</button>
          <button type="button" id="fsBtn" title="全屏（双击画面同样可切换）">全屏</button>
        </div>
        <div id="paramRow" class="controlRow">
          <label id="lineBox" for="lineSelect">
            <span class="qualityLabel">线路</span>
            <select id="lineSelect"></select>
          </label>
          <label id="modeBox" for="modeSelect">
            <span class="qualityLabel">缓冲</span>
            <select id="modeSelect">
              <option value="stable">稳定缓冲</option>
              <option value="extreme">极限追帧</option>
            </select>
          </label>
          <button type="button" id="statsBtn" title="显示当前直播的详细参数（分辨率 / 帧率 / 码率 / 编码）">统计</button>
        </div>
      </div>
      <div id="statusBar">
        <span id="healthBar" data-health="idle" aria-hidden="true"></span>
        <span id="statusLine" role="status">未连接</span>
      </div>
    </footer>
  </div>

  <script src="./player-core.js"></script>
  <script src="./danmaku-core.js"></script>
  <script src="./danmaku-renderer.js"></script>
  <script>
    'use strict';

    (function main() {
      const core = window.StreamPilotPlayerCore;
      const outbound = core.OUTBOUND_MESSAGE_TYPES;

      /** 宿主状态消息到期后回落刷新的定时余量（毫秒）：略晚于到期点，避免边界上重复刷新。 */
      const STATUS_FALLBACK_MARGIN_MS = 50;

      /**
       * 重建播放器后恢复播放位置的最小秒数。
       *
       * 小于它的位置（刚起播、缓冲几乎为空）不值得 seek：`currentTime` 的赋值会触发一次
       * 额外的 seek 流程，而目标点附近的缓冲还没建立起来，反而多一次等待。
       */
      const REBUILD_POSITION_RESTORE_MIN_SECONDS = 0.5;

      /** 控制条自动隐藏的静止判定（毫秒）：播放中鼠标静止这么久就淡出。 */
      const CONTROLS_AUTO_HIDE_DELAY_MS = 3000;

      /** toast 停留时长（毫秒）：宿主错误 / 警告提示自动消失，不长期占着画面。 */
      const TOAST_DURATION_MS = 3000;

      /** 判定"画面停滞"的静默时长（毫秒）：超过它，缓冲健康度一律判红。 */
      const BUFFER_HEALTH_STALL_MS = 3000;

      /** 宿主消息通道：WebView2 的 chrome.webview。外部浏览器打开时为空。 */
      const hostChannel = (function createHostChannel() {
        if (window.chrome && window.chrome.webview) {
          return {
            post: function post(payload) {
              window.chrome.webview.postMessage(payload);
            },
            onMessage: function onMessage(handler) {
              window.chrome.webview.addEventListener('message', function onWebMessage(event) {
                handler(event.data);
              });
            },
          };
        }

        return null;
      }());

      const elements = {
        video: document.getElementById('video'),
        hint: document.getElementById('hint'),
        status: document.getElementById('statusLine'),
        volume: document.getElementById('volume'),
        volumeLabel: document.getElementById('volumeLabel'),
        volDisplay: document.getElementById('volDisplay'),
        fsBtn: document.getElementById('fsBtn'),
        lineBox: document.getElementById('lineBox'),
        lineSelect: document.getElementById('lineSelect'),
        qualityBox: document.getElementById('qualityBox'),
        qualitySelect: document.getElementById('qualitySelect'),
        modeBox: document.getElementById('modeBox'),
        modeSelect: document.getElementById('modeSelect'),
        playBtn: document.getElementById('playBtn'),
        pauseBtn: document.getElementById('pauseBtn'),
        stopBtn: document.getElementById('stopBtn'),
        danmakuBtn: document.getElementById('danmakuBtn'),
        danmakuLayer: document.getElementById('danmakuLayer'),
        stage: document.getElementById('stage'),
        controlsBar: document.getElementById('controlsBar'),
        primaryRow: document.getElementById('primaryRow'),
        paramRow: document.getElementById('paramRow'),
        paramToggle: document.getElementById('paramToggle'),
        healthBar: document.getElementById('healthBar'),
        toast: document.getElementById('toast'),
        statsBtn: document.getElementById('statsBtn'),
        statsPanel: document.getElementById('statsPanel'),
        statsList: document.getElementById('statsList'),
        panelBtn: document.getElementById('panelBtn'),
      };

      /** 页面状态。 */
      const state = {
        run: null,
        ownedPlayer: null,
        currentStreamUrl: '',
        currentReferer: '',
        roomTitle: '',
        lastVolume: core.INITIAL_VOLUME_PERCENT,
        muteToggleVolume: core.INITIAL_VOLUME_PERCENT,
        // 自动播放被策略拦截时置位：此时点画面是"接着播"，而不是切换静音。
        autoplayBlocked: false,
        autoplayStartedAt: 0,
        hintLockUntil: 0,
        /** 最近的宿主状态消息（{message, level, receivedAt}）；画面下方状态行的最高优先级来源。 */
        hostStatus: null,
        /** 页面自己的播放状态文案：宿主消息过期后回落到它。 */
        playbackText: core.STATUS_IDLE_TEXT,
        /**
         * 状态行的会话阶段（core.PLAYBACK_PHASES）：决定状态行显示操作态文案还是播放中遥测。
         * 操作态（暂停 / 重连 / 停止）必须由它表达，否则遥测每 500 ms 就会把文案刷回「播放中」。
         */
        statusPhase: core.PLAYBACK_PHASES.IDLE,
        /** 当前是第几次重连（从 1 开始）；不在重连中时为 0。 */
        reconnectAttempt: 0,
        /** "宿主状态消息到期 → 回落播放状态"的定时器句柄。 */
        statusFallbackTimer: null,
        eventSequence: 0,
        telemetryTimer: null,
        refreshRequested: false,
        capabilities: { hevc: false, avc: false },
        qualityKey: '',
        /** 当前播放模式（stable / extreme）；未开始播放时用于「缓冲」下拉的缺省值。 */
        mode: 'stable',
        // 用户暂停不销毁播放器：保留会话与地址，继续播放时从当前位置恢复。
        pausedByUser: false,
        pausedAtSeconds: 0,
        // 刚恢复播放的时间戳：这段时间内的静止属于重建缓冲，不判卡顿。
        resumedAt: 0,
      };

      /**
       * 控制条布局与自动隐藏状态（由宿主 player-config 下发，页面不自己猜）。
       *
       * compact 对应设置里的「紧凑控制条（旧版一行）」：为 true 时把主控层与参数层摊平成一行。
       * autoHide 关闭后控制条常驻，不随鼠标静止淡出（对习惯旧界面的用户）。
       */
      const uiState = {
        compact: false,
        autoHide: true,
        paramsCollapsed: false,
        /** 宿主左侧控制面板是否收起（收起时画面左上角显示恢复入口）。 */
        panelCollapsed: false,
        pointerInside: false,
        focused: false,
        /** 最近一次用户交互时间（毫秒）：静止计时以它为起点。 */
        lastInteractionAt: 0,
        hideTimer: null,
        toastTimer: null,
      };

      const hevcMseSupported = Boolean(window.MediaSource)
        && (MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L120.90"')
          || MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L120.90"'));
      const avcMseSupported = Boolean(window.MediaSource)
        && MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
        && MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"');
      state.capabilities.hevc = hevcMseSupported;
      state.capabilities.avc = avcMseSupported;

      /** 判断候选能否在本页播放。 */
      function canPlayFlv() {
        return Boolean(window.mpegts && window.mpegts.isSupported());
      }

      function canPlayHls() {
        return Boolean(window.Hls && window.Hls.isSupported());
      }

      /** 向宿主上报事件。 */
      function report(type, message, run, candidate, extras) {
        state.eventSequence += 1;
        const payload = {
          type: type,
          message: String(message || ''),
          eventSequence: state.eventSequence,
          pageElapsedMs: Math.round(performance.now()),
        };

        if (run && Number.isSafeInteger(run.sessionId)) {
          payload.sessionId = run.sessionId;
        }

        if (candidate && Number.isInteger(candidate.sourceIndex)) {
          payload.sourceIndex = candidate.sourceIndex;
        }

        if (candidate && typeof candidate.urlFingerprint === 'string') {
          payload.urlFingerprint = candidate.urlFingerprint;
        }

        if (extras) {
          Object.assign(payload, extras);
        }

        if (hostChannel) {
          hostChannel.post(payload);
        }
      }

      /**
       * 上报播放模式变化：宿主据此更新并持久化，下次播放沿用。
       * @param {string} mode 播放模式（stable / extreme）。
       */
      function reportPlaybackMode(mode) {
        const run = state.run;
        report(outbound.MODE, '切换播放模式：' + (mode === 'extreme' ? '极限追帧' : '稳定缓冲'), run, run ? run.currentCandidate : null, {
          mode: mode,
        });
      }

      /**
       * 页面诊断日志：只上报给宿主，页面不再显示日志面板。
       *
       * 页面上的日志面板既占画面又需要用户手动展开，排查问题还是得看宿主日志；
       * 因此这里统一走 `log` 消息（级别 info/warn/error 原样带给宿主），
       * 由宿主决定落盘级别与界面展示，页面侧不留任何输出通道。
       * @param {string} level 日志级别（core.LOG_LEVELS）。
       * @param {string} text 日志文本。
       */
      function logToHost(level, text) {
        report(outbound.LOG, text, state.run, state.run ? state.run.currentCandidate : null, {
          level: level,
        });
      }

      /** 设置居中提示。 */
      function setHint(message, level) {
        elements.hint.textContent = message;
        elements.hint.dataset.level = level || 'info';
        elements.hint.classList.remove('empty');
        elements.hint.classList.remove('hidden');
      }

      /**
       * 回到空态提示。文案取 player-core 的常量，
       * 避免"页面写一套、测试测另一套"。
       */
      function showEmptyState() {
        elements.hint.textContent = core.EMPTY_HINT_TITLE;
        elements.hint.dataset.action = core.EMPTY_HINT_ACTION;
        elements.hint.dataset.level = 'info';
        elements.hint.classList.remove('hidden');
        elements.hint.classList.add('empty');
      }

      /** 设置提示并锁定指定时长（毫秒）。 */
      function setHintLocked(message, level, lockMs) {
        setHint(message, level);
        state.hintLockUntil = Date.now() + (lockMs || 0);
      }

      /**
       * 刷新画面下方的状态行：宿主消息优先，过期后回落显示页面自己的播放状态。
       *
       * 显示判定全部交给纯函数 `core.resolveStatusLine`（被前端用例覆盖），
       * 这里只负责写 DOM 与安排回落定时器。
       */
      function renderStatusLine() {
        const resolved = core.resolveStatusLine(state.hostStatus, state.playbackText, Date.now());
        elements.status.textContent = resolved.text;
        elements.status.dataset.level = resolved.level;
        scheduleStatusFallback();
      }

      /** 安排一次"宿主状态消息到期 → 回落播放状态"的刷新。 */
      function scheduleStatusFallback() {
        if (state.statusFallbackTimer !== null) {
          window.clearTimeout(state.statusFallbackTimer);
          state.statusFallbackTimer = null;
        }

        const remaining = core.getHostStatusRemainingMs(state.hostStatus, Date.now());
        if (remaining <= 0) {
          return;
        }

        state.statusFallbackTimer = window.setTimeout(function onStatusFallback() {
          state.statusFallbackTimer = null;
          renderStatusLine();
        }, remaining + STATUS_FALLBACK_MARGIN_MS);
      }

      /**
       * 记录页面自己的播放状态文案（受提示锁保护）。
       *
       * 宿主消息仍在保留期内时它不会立刻显示——由 `renderStatusLine` 按优先级决定，
       * 这样宿主的失败原因不会被随后的"播放中"盖掉。
       * @param {string} message 状态文案。
       */
      function setStatus(message) {
        if (Date.now() < state.hintLockUntil) {
          return;
        }

        state.playbackText = message;
        renderStatusLine();
      }

      /**
       * 切换状态行的会话阶段并立刻刷新状态行。
       *
       * 显示什么文案**只**由纯函数 `core.resolvePlaybackStatusText(run, state)` 决定：
       * 用户暂停 > 停止 / 重连 > 未连接 > 播放中遥测。页面在这里只改阶段、不拼文案，
       * 因此不存在"页面一套、遥测回调另一套"的漂移。
       * @param {string} phase {@link core.PLAYBACK_PHASES} 之一。
       * @param {object|null} run 当前运行对象。
       */
      function applyPlaybackPhase(phase, run) {
        state.statusPhase = phase;
        setStatus(core.resolvePlaybackStatusText(run, state));

        if (phase === core.PLAYBACK_PHASES.PLAYING) {
          // 起播后开始静止计时：鼠标不动就淡出控制条。
          scheduleControlHide();
          return;
        }

        // 非播放态（暂停 / 重连 / 停止 / 空闲）控制条必须可见，色条也只能是"没有在播"。
        setBufferHealth(core.BUFFER_HEALTH.IDLE, null);
        showControls();
      }

      /**
       * 用最近一次遥测的**真实延迟**刷新状态行（显示形如"播放中 · 318 ms（极限追帧 250 ms）"）。
       *
       * 本函数每 `core.TELEMETRY_INTERVAL_MS` 被调一次，**只允许更新数值**：
       * 实测延迟由 `run.lastLatencyMs` 带进来，暂停 / 重连 / 停止这些操作态文案由
       * `core.resolvePlaybackStatusText` 按会话阶段原样保留（纯函数被前端用例覆盖）。
       * @param {object} run 运行对象（带 lastLatencyMs / autoChaseEnabled）。
       */
      function refreshPlaybackStatus(run) {
        if (!run) {
          return;
        }

        setStatus(core.resolvePlaybackStatusText(run, state));
      }

      /**
       * 显示宿主下发的状态文案。
       *
       * 左栏「当前直播」卡片删除后，宿主的状态文字（解析失败原因、操作反馈…）在窗口里
       * 已经没有显示位置，画面下方就是它唯一的显示位。
       * 这里刻意**不看提示锁**：宿主的失败/操作类消息比页面自己的状态更需要被看到，
       * 且与居中的提示说的是同一件事时读起来一致。
       * @param {object} payload `host-status` 消息（message 必填，level 可选）。
       */
      function applyHostStatus(payload) {
        const message = typeof payload.message === 'string' ? payload.message.trim() : '';
        if (message.length === 0) {
          return;
        }

        state.hostStatus = {
          message: message,
          level: core.normalizeStatusLevel(payload.level),
          receivedAt: Date.now(),
        };
        renderStatusLine();

        // 失败 / 警告额外弹一条 toast：状态行会被省略号截断，错误原因要靠浮层先被看见。
        if (state.hostStatus.level !== 'info') {
          showToast(message, state.hostStatus.level);
        }
      }

      /**
       * 刷新状态行左侧的缓冲健康度色条。
       * @param {string} health {@link core.BUFFER_HEALTH} 之一。
       * @param {number|null} bufferSeconds 本地缓冲剩余秒数（只用于悬停提示）。
       */
      function setBufferHealth(health, bufferSeconds) {
        const bar = elements.healthBar;
        if (!bar) {
          return;
        }

        if (bar.dataset.health !== health) {
          bar.dataset.health = health;
        }

        if (health === core.BUFFER_HEALTH.IDLE) {
          bar.title = '缓冲健康度：当前没有在播';
          return;
        }

        const seconds = Number(bufferSeconds);
        bar.title = Number.isFinite(seconds)
          ? '缓冲健康度：剩余 ' + seconds.toFixed(1) + ' 秒（绿 <1s / 黄 1–3s / 红 >3s 或停滞）'
          : '缓冲健康度：暂无数据';
      }

      /**
       * 弹一条右下角 toast，到点自动消失。
       *
       * 宿主的失败原因（解析失败、断流…）此前只能靠状态行长期显示，
       * 状态行一长就被省略号截断；toast 让"出了什么事"先被看见，状态行仍保留作兜底。
       * @param {string} message 提示文本。
       * @param {string} level 级别（warn / error，其余按 info 处理）。
       */
      function showToast(message, level) {
        const toast = elements.toast;
        if (!toast || !message) {
          return;
        }

        toast.textContent = message;
        toast.dataset.level = level === 'error' || level === 'warn' ? level : 'info';
        toast.classList.add('sp-visible');
        if (uiState.toastTimer !== null) {
          window.clearTimeout(uiState.toastTimer);
        }

        uiState.toastTimer = window.setTimeout(function hideToast() {
          uiState.toastTimer = null;
          toast.classList.remove('sp-visible');
        }, TOAST_DURATION_MS);
      }

      /** 同步参数层的展开 / 收起（紧凑模式下两层同行，收起开关本身隐藏）。 */
      function syncParameterRow() {
        const collapsed = uiState.paramsCollapsed && !uiState.compact;
        elements.paramRow.classList.toggle('sp-collapsed', collapsed);
        if (!elements.paramToggle) {
          return;
        }

        elements.paramToggle.setAttribute('aria-expanded', String(!collapsed));
        elements.paramToggle.classList.toggle('active', !collapsed);
        elements.paramToggle.title = collapsed ? '展开线路与缓冲模式' : '收起线路与缓冲模式';
      }

      /**
       * 当前是否允许自动隐藏控制条。
       *
       * 只在"确实在播、用户没暂停、指针不在条上、焦点不在条内"时淡出：
       * 暂停后画面本来就不动，控制条再消失会让人不知道还能点哪里。
       * @returns {boolean} 允许隐藏返回 true。
       */
      function canAutoHideControls() {
        return uiState.autoHide
          && !uiState.compact
          && !uiState.pointerInside
          && !uiState.focused
          && state.run !== null
          && !state.pausedByUser
          && state.statusPhase === core.PLAYBACK_PHASES.PLAYING;
      }

      /** 让控制条立刻可见，并记下这次交互时间。 */
      function showControls() {
        if (elements.controlsBar.classList.contains('sp-controls-hidden')) {
          elements.controlsBar.classList.remove('sp-controls-hidden');
        }

        uiState.lastInteractionAt = Date.now();
        scheduleControlHide();
      }

      /** 安排一次"静止到时后隐藏控制条"（同一时刻只保留一个计时器）。 */
      function scheduleControlHide() {
        if (!uiState.autoHide || uiState.compact) {
          // 关掉自动隐藏后必须保证控制条可见，否则会停在"隐藏"状态再也点不到。
          elements.controlsBar.classList.remove('sp-controls-hidden');
          return;
        }

        if (uiState.hideTimer !== null) {
          return;
        }

        uiState.lastInteractionAt = Date.now();
        uiState.hideTimer = window.setTimeout(onControlHideTick, CONTROLS_AUTO_HIDE_DELAY_MS);
      }

      /** 静止计时到点：仍满足条件就淡出，否则什么都不做（状态变化会重新排期）。 */
      function onControlHideTick() {
        uiState.hideTimer = null;
        const idleMs = Date.now() - uiState.lastInteractionAt;
        if (idleMs < CONTROLS_AUTO_HIDE_DELAY_MS) {
          uiState.hideTimer = window.setTimeout(onControlHideTick, CONTROLS_AUTO_HIDE_DELAY_MS - idleMs);
          return;
        }

        if (!canAutoHideControls()) {
          return;
        }

        elements.controlsBar.classList.add('sp-controls-hidden');
      }

      /**
       * 绑定控制条的显隐行为：鼠标移动 / 按键 / 滚轮都算"用户还在操作"。
       *
       * 指针停在控制条上或焦点在条内时不自动隐藏——否则鼠标悬在「停止」上时按钮会突然消失。
       */
      function bindControlBarVisibility() {
        document.addEventListener('pointermove', showControls, { passive: true });
        document.addEventListener('pointerdown', showControls, { passive: true });
        document.addEventListener('keydown', showControls);
        document.addEventListener('wheel', showControls, { passive: true });

        elements.controlsBar.addEventListener('pointerenter', function onEnter() {
          uiState.pointerInside = true;
          showControls();
        });

        elements.controlsBar.addEventListener('pointerleave', function onLeave() {
          uiState.pointerInside = false;
          scheduleControlHide();
        });

        elements.controlsBar.addEventListener('focusin', function onFocusIn() {
          uiState.focused = true;
          showControls();
        });

        elements.controlsBar.addEventListener('focusout', function onFocusOut() {
          uiState.focused = false;
          scheduleControlHide();
        });

        if (elements.paramToggle) {
          elements.paramToggle.addEventListener('click', function onParamToggle() {
            uiState.paramsCollapsed = !uiState.paramsCollapsed;
            syncParameterRow();
          });
        }

        if (elements.statsBtn) {
          elements.statsBtn.addEventListener('click', function onStatsToggle() {
            setStatsVisible(!statsState.enabled);
          });
        }

        if (elements.panelBtn) {
          elements.panelBtn.addEventListener('click', function onPanelExpand() {
            if (hostChannel) {
              hostChannel.post({ type: 'panel-expand' });
            }
          });
        }
      }

      /**
       * 面板收起时在画面左上角显示「☰ 控制面板」。
       *
       * 页面全屏下不显示：那时宿主不允许展开面板，按钮点了也不会有反应，留着只会误导。
       */
      function syncPanelButton() {
        if (!elements.panelBtn) {
          return;
        }

        elements.panelBtn.classList.toggle('visible', uiState.panelCollapsed && !document.fullscreenElement);
      }

      /**
       * 应用宿主下发的播放页外观配置（`player-config` 消息）。
       *
       * 页面不自己猜这些开关：紧凑布局与自动隐藏都是用户的设置，缺省值必须与宿主一致。
       * @param {object} payload `player-config` 消息。
       */
      function applyPlayerUiConfig(payload) {
        if (!payload || typeof payload !== 'object') {
          return;
        }

        uiState.compact = payload.compactControls === true;
        uiState.autoHide = payload.autoHideControls !== false;
        uiState.panelCollapsed = payload.panelCollapsed === true;
        document.body.classList.toggle('sp-compact', uiState.compact);
        if (uiState.compact) {
          // 紧凑模式本身就是一行，参数层不再单独收起。
          uiState.paramsCollapsed = false;
        }

        if (payload.mode === 'extreme' || payload.mode === 'stable') {
          state.mode = payload.mode;
          syncModeSelect();
        }

        syncParameterRow();
        syncPanelButton();
        showControls();
      }

      /** 销毁当前播放器并释放资源。 */
      function destroyPlayer() {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
          state.telemetryTimer = null;
        }

        const player = state.ownedPlayer;
        state.ownedPlayer = null;
        if (!player) {
          return;
        }

        try {
          player.pause();
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '暂停播放器失败：' + error.message);
        }

        try {
          if (typeof player.unload === 'function') {
            player.unload();
          }

          if (typeof player.detachMediaElement === 'function') {
            player.detachMediaElement();
          }

          if (typeof player.destroy === 'function') {
            player.destroy();
          }
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '释放播放器失败：' + error.message);
        }

        try {
          elements.video.pause();
          elements.video.removeAttribute('src');
          elements.video.load();
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '重置视频元素失败：' + error.message);
        }

        elements.video.playbackRate = 1;
      }

      /** 带超时的 Promise 包装。 */
      function awaitWithTimeout(promise, timeoutMs, timeoutMessage, onTimeout) {
        let timer = null;
        const timeout = new Promise(function rejectAfterTimeout(resolve, reject) {
          timer = window.setTimeout(function onTimeoutElapsed() {
            const error = new Error(timeoutMessage);
            error.name = 'TimeoutError';
            if (typeof onTimeout === 'function') {
              onTimeout();
            }

            reject(error);
          }, timeoutMs);
        });

        return Promise.race([promise, timeout]).finally(function clearTimer() {
          if (timer !== null) {
            window.clearTimeout(timer);
          }
        });
      }

      /** 判断 run 是否仍然有效（防止过期会话污染当前状态）。 */
      function isActive(run) {
        return Boolean(run) && state.run === run && !run.stopped;
      }

      /**
       * 探测单个候选：只取到响应头就中止，绝不读取响应体。
       *
       * 请求方式是 GET、`cache:'no-store'`、`credentials:'omit'`，超时取 `core.PROBE_TIMEOUT_MS`。
       * 探测只用于排序与提示，**不用于否决**：只有 404/410 才判为 rejected，
       * 其余状态与网络错误、CORS 不可见都算不确定（判定见 `core.isProbeRejectedStatus`）。
       * "不读 body"是关键：读 body 等于把整条直播流拉下来，探测就变成一次真实下载。
       * @param {object} run 运行对象。
       * @param {object} candidate 候选。
       * @returns {Promise<{outcome:string,elapsedMs:number,statusCode:number|null,errorName:string|null,errorMessage:string|null}>} 探测结论。
       */
      async function probeCandidate(run, candidate) {
        const controller = new AbortController();
        run.controllers.add(controller);
        const startedAt = performance.now();
        const elapsed = function elapsedMs() {
          return Math.round(performance.now() - startedAt);
        };

        try {
          const response = await awaitWithTimeout(
            fetch(candidate.url, {
              method: 'GET',
              mode: 'cors',
              cache: 'no-store',
              credentials: 'omit',
              referrerPolicy: 'no-referrer-when-downgrade',
              signal: controller.signal,
            }),
            core.PROBE_TIMEOUT_MS,
            '候选探测超时',
            function onProbeTimeout() {
              controller.abort();
            });

          if (!isActive(run)) {
            return { outcome: 'stale', elapsedMs: elapsed(), statusCode: null, errorName: null, errorMessage: null };
          }

          const status = response.status;
          try {
            controller.abort();
          } catch (abortError) {
            logToHost(core.LOG_LEVELS.WARN, '探测结束后中止连接失败：' + (abortError && abortError.message));
          }

          if (response.ok) {
            return { outcome: 'good', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
          }

          if (core.isProbeRejectedStatus(status)) {
            return { outcome: 'rejected', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
          }

          return { outcome: 'inconclusive', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
        } catch (error) {
          if (!isActive(run)) {
            return { outcome: 'stale', elapsedMs: elapsed(), statusCode: null, errorName: null, errorMessage: null };
          }

          return {
            outcome: 'inconclusive',
            elapsedMs: elapsed(),
            statusCode: null,
            errorName: error && error.name ? error.name : null,
            errorMessage: error && error.message ? error.message : null,
          };
        } finally {
          run.controllers.delete(controller);
        }
      }

      /** 探测结果是否可用（会话未过期）。 */
      function isUsableProbeResult(result) {
        return result.outcome !== 'stale';
      }

      /** 把探测结果转成队列项（只保留"分组 + 宿主原顺序"，不保留耗时：耗时只用于诊断上报）。 */
      function buildQueueEntry(candidate, position, result) {
        return {
          candidate: candidate,
          position: position,
          group: result.outcome === 'good' ? 0 : 1,
        };
      }

      /** 按"已知可用优先、其余按宿主原顺序"排序队列项。 */
      function compareQueueEntries(left, right) {
        if (left.group !== right.group) {
          return left.group - right.group;
        }

        return left.position - right.position;
      }

      /** 报告单个候选的探测结论。 */
      function reportProbeResult(run, candidate, result) {
        if (result.outcome === 'good') {
          report(outbound.PROBE_RESULT, '线路响应正常', run, candidate, {
            outcome: 'good',
            elapsedMs: result.elapsedMs,
          });
          return;
        }

        if (result.outcome === 'rejected') {
          report(outbound.PROBE_REJECTED, '线路返回 HTTP ' + result.statusCode, run, candidate, {
            outcome: 'rejected',
            statusCode: result.statusCode,
          });
          return;
        }

        report(outbound.PROBE_RESULT, '线路探测结果不确定', run, candidate, {
          outcome: 'inconclusive',
          elapsedMs: result.elapsedMs,
          errorName: result.errorName,
          errorMessage: result.errorMessage,
        });
      }

      /** 规整宿主给出的候选顺序（探测通过/不确定的候选）。 */
      function assembleQueue(run, entries) {
        entries.sort(compareQueueEntries);
        const queue = [];
        for (const entry of entries) {
          queue.push(entry.candidate);
        }

        const knownGoodCount = entries.filter(function isKnownGood(item) {
          return item.group === 0;
        }).length;
        report(outbound.CANDIDATE_QUEUE, '候选队列已就绪，共 ' + queue.length + ' 条', run, queue[0] || null, {
          sourceIndexes: queue.map(function sourceIndexOf(item) {
            return item.sourceIndex;
          }),
          knownGoodCount: knownGoodCount,
          inconclusiveCount: queue.length - knownGoodCount,
        });
        return queue;
      }

      /** 不探测时的直连模式：直接沿用宿主顺序（例如只有一条候选）。 */
      function buildDirectQueue(run, reason) {
        const queue = run.candidates.slice();
        logToHost(core.LOG_LEVELS.INFO, reason + '，按宿主给出的线路顺序直接连接（共 ' + queue.length + ' 条）');
        report(outbound.CANDIDATE_QUEUE, '线路顺序已就绪，共 ' + queue.length + ' 条', run, queue[0] || null, {
          sourceIndexes: queue.map(function index(item) {
            return item.sourceIndex;
          }),
          knownGoodCount: 0,
          inconclusiveCount: 0,
        });
        return queue;
      }

      /**
       * 生成候选队列。
       *
       * 探测恢复成参考播放页的做法（并行、拿到响应头即 abort、超时 1200 ms），但**不按耗时重排队**：
       * 延时数字量的是"页面→探测目标"这一段，走本地中继时它主要由回环与中继转发决定，与实际 CDN 质量无关，
       * 按它排序只会把宿主的平台优先级打乱（表现为"换了条更慢的线路"）。
       * 因此这里只把"已知响应正常"的候选提到前面，组内仍按宿主原顺序；4xx/5xx 的候选直接丢弃。
       * 是否探测由 core.shouldProbeCandidate 决定，原因见该函数的注释。
       * @param {object} run 运行对象。
       * @returns {Promise<Array<object>>} 待尝试的候选队列。
       */
      async function buildCandidateQueue(run) {
        if (!core.shouldProbeCandidate(run.candidates.length)) {
          return buildDirectQueue(run, '只有一个候选（探测零收益）');
        }

        report(outbound.CHECKING, '正在并行检查 ' + run.candidates.length + ' 条线路…', run);

        /*
          探测只用于"排序"，不该决定首帧何时出现：等满全部探测会把起播拖到最慢那条的超时
          （实测 B站 8 条候选时固定多等 3.0 秒）。这里最多等 PROBE_START_DEADLINE_MS，
          到点后中止仍在飞的探测，把没完成的按"结果不确定"排队——顺序语义不变（不确定的排在已知可用之后），
          但不再阻塞起播。
        */
        const results = new Array(run.candidates.length).fill(null);
        const probes = run.candidates.map(function probe(item, index) {
          return probeCandidate(run, item).then(function remember(result) {
            results[index] = result;
            return result;
          });
        });
        await Promise.race([
          Promise.all(probes),
          new Promise(function waitStartDeadline(resolve) {
            window.setTimeout(resolve, core.PROBE_START_DEADLINE_MS);
          }),
        ]);
        if (!isActive(run)) {
          return [];
        }

        // 到点后结束仍在飞的探测：它们会占着浏览器的同源连接名额，挡住真正的播放连接。
        for (const controller of run.controllers) {
          try {
            controller.abort();
          } catch (abortError) {
            logToHost(core.LOG_LEVELS.WARN, '探测到点后中止连接失败：' + (abortError && abortError.message));
          }
        }

        let pendingProbes = 0;
        for (let index = 0; index < results.length; index += 1) {
          if (results[index] === null) {
            pendingProbes += 1;
            results[index] = {
              outcome: 'inconclusive',
              elapsedMs: null,
              statusCode: null,
              errorName: 'probe-deadline',
              errorMessage: null,
            };
          }
        }

        if (pendingProbes > 0) {
          logToHost(
            core.LOG_LEVELS.INFO,
            '探测在 ' + core.PROBE_START_DEADLINE_MS + ' ms 内未全部完成（' + pendingProbes + ' 条按"不确定"处理），先按已确认结果起播');
        }

        const entries = [];
        const rejected = [];
        for (let position = 0; position < run.candidates.length; position += 1) {
          const candidate = run.candidates[position];
          const result = results[position];
          if (!isUsableProbeResult(result)) {
            return [];
          }

          reportProbeResult(run, candidate, result);
          if (result.outcome === 'rejected') {
            rejected.push(candidate);
            continue;
          }

          entries.push(buildQueueEntry(candidate, position, result));
        }

        if (rejected.length > 0) {
          logToHost(core.LOG_LEVELS.WARN, '已跳过 ' + rejected.length + ' 条返回 HTTP 错误的线路');
        }

        if (entries.length === 0) {
          /*
            全部候选都返回 404/410（地址已失效）时，继续重试没有意义：直接请宿主强制重新解析，
            而不是把"请点 mpv 播放"当成终点（宿主侧对自动重解析有次数上限）。
          */
          const message = '所有线路都拒绝了内置播放器的请求（线路地址可能已失效）。';
          report(outbound.ERROR, message, run, null, { rejectedCount: rejected.length });
          requestFreshSources(run, message);
          return [];
        }

        return assembleQueue(run, entries);
      }

      /** 启动某个候选的播放。 */
      async function startCandidate(run, candidate) {
        if (!isActive(run)) {
          return;
        }

        run.currentCandidate = candidate;
        // 下拉要反映"实际正在用的线路"：自动换线后用户也能看到当前落在哪条。
        if (elements.lineSelect && Array.isArray(run.candidates) && run.candidates.length > 1) {
          elements.lineSelect.value = String(candidate.sourceIndex);
        }

        state.currentStreamUrl = candidate.url;
        state.currentReferer = candidate.referer || '';
        state.pausedByUser = false;
        updatePauseButton();
        report(outbound.CANDIDATE_ACTIVE, '正在连接 ' + candidate.host, run, candidate);

        destroyPlayer();
        if (!isActive(run)) {
          return;
        }

        state.autoplayBlocked = false;
        /*
          不预先静音：宿主已用 --autoplay-policy=no-user-gesture-required 打开内核的自动播放，
          首帧应当直接带声音起来；若内核策略仍拦截，playWithAutoplayFallback 会静音起播再恢复音量。
        */
        if ('preservesPitch' in elements.video) {
          elements.video.preservesPitch = true;
        }

        const isHls = core.isHlsCandidate(candidate);
        if (!isHls) {
          if (!canPlayFlv()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HTTP-FLV 播放');
            return;
          }

          state.ownedPlayer = window.mpegts.createPlayer(
            { type: 'flv', isLive: true, url: candidate.url, hasAudio: true, hasVideo: true },
            core.buildMpegtsConfig(run.extreme, run.extremeTargetSeconds, core.shouldAutoChase(run)));
          attachPlayerEvents(run, candidate, state.ownedPlayer, true);
          state.ownedPlayer.attachMediaElement(elements.video);
          state.ownedPlayer.load();
        } else {
          if (!canPlayHls()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HLS 播放');
            return;
          }

          state.ownedPlayer = new window.Hls(core.buildHlsConfig(run.extreme, core.shouldAutoChase(run)));
          attachPlayerEvents(run, candidate, state.ownedPlayer, false);
          state.ownedPlayer.loadSource(candidate.url);
          state.ownedPlayer.attachMedia(elements.video);
        }

        const startedAt = performance.now();
        try {
          const autoplay = await awaitWithTimeout(
            playWithAutoplayFallback(elements.video),
            core.getStartupTimeoutMs(run),
            '等待首帧超时');
          if (!isActive(run)) {
            return;
          }

          if (autoplay.mutedStart) {
            /*
              内核自动播放策略要求静音才能起播时，先用静音拿到首帧，
              再立刻恢复用户音量：这样"无需点击就能看"，音量也与滑块一致。
            */
            logToHost(core.LOG_LEVELS.INFO, '内核要求静音起播，已恢复音量 ' + state.lastVolume + '%');
            applyVolume(state.lastVolume);
          }

          markPlaybackStarted(run, candidate, startedAt);
        } catch (error) {
          if (!isActive(run)) {
            return;
          }

          /*
            自动播放策略拦截不是线路问题：这时候切候选只会把可用线路白白烧完，
            所以停在原地等用户点一下画面（点击处理器会接着播放）。
          */
          if (core.isAutoplayBlocked(error)) {
            state.autoplayBlocked = true;
            state.autoplayStartedAt = startedAt;
            logToHost(core.LOG_LEVELS.WARN, '自动播放被策略拦截，等待用户点击画面');
            report(outbound.WARNING, core.AUTOPLAY_BLOCKED_HINT, run, candidate, { errorName: error.name });
            setHint(core.AUTOPLAY_BLOCKED_HINT, 'warn');
            return;
          }

          report(outbound.WARNING, '首帧等待失败：' + (error && error.message), run, candidate, {
            errorName: error && error.name,
            errorMessage: error && error.message,
          });

          if (!run.playbackStarted) {
            switchToNextCandidate(run, candidate, '首帧超时或失败');
          } else {
            recoverAfterInterruption(run, candidate, '播放启动异常');
          }
        }
      }

      /**
       * 启动播放：先按当前音量尝试；被内核自动播放策略拦住时改用静音起播。
       *
       * 宿主 WebView2 已带 --autoplay-policy=no-user-gesture-required，
       * 正常路径下这里一次就成功；静音兜底只在内核策略不可用时生效，
       * 由调用方在起播后立刻恢复用户音量（见 startCandidate）。
       * @param {HTMLVideoElement} video 视频元素。
       * @returns {Promise<{mutedStart:boolean}>} 是否走了静音起播。
       */
      async function playWithAutoplayFallback(video) {
        try {
          await video.play();
          return { mutedStart: false };
        } catch (error) {
          if (!core.isAutoplayBlocked(error)) {
            throw error;
          }

          video.muted = true;
          await video.play();
          return { mutedStart: true };
        }
      }

      /** 首帧就绪：统一处理状态、界面、日志与上报。 */
      function markPlaybackStarted(run, candidate, startedAt) {
        run.playbackStarted = true;
        // 出过首帧说明"换线是为了更好"，此时把换线计数归零，避免长会话被历史累计卡住上限。
        run.switchCount = 0;
        run.everPlayed = true;
        state.autoplayBlocked = false;
        state.pausedByUser = false;
        state.resumedAt = 0;
        run.lastPlaybackPosition = elements.video.currentTime;
        run.lastPlaybackProgressAt = Date.now();
        run.currentCandidateStartedAt = Date.now();
        // 新播放器刚起播：上一次会话的缓冲失控处置计数不能带过来。
        run.runawayChaseAttempts = 0;
        run.runawayHandledAt = 0;
        const firstFrameMs = Math.round(performance.now() - startedAt);
        elements.hint.classList.add('hidden');
        updatePauseButton();
        // 首帧到达：会话回到"播放中"，重连计数归零，状态行从此由遥测数值刷新。
        state.reconnectAttempt = 0;
        applyPlaybackPhase(core.PLAYBACK_PHASES.PLAYING, run);
        run.summary.firstFrameMs = firstFrameMs;
        logToHost(core.LOG_LEVELS.INFO, '首帧 ' + firstFrameMs + ' ms（' + candidate.host + '）');
        report(outbound.STATUS, '播放已开始', run, candidate, { firstFrameMs: firstFrameMs, mode: run.mode });
        startTelemetry(run);
      }

      /** 用户点击画面后接着播放被自动播放策略拦住的流。 */
      function resumeBlockedPlayback() {
        const run = state.run;
        const candidate = run ? run.currentCandidate : null;
        if (!isActive(run) || !candidate) {
          state.autoplayBlocked = false;
          return;
        }

        const startedAt = state.autoplayStartedAt || performance.now();
        state.autoplayBlocked = false;
        elements.video.play().then(function onStarted() {
          if (!isActive(run)) {
            return;
          }

          markPlaybackStarted(run, candidate, startedAt);
        }).catch(function onFailed(error) {
          logToHost(core.LOG_LEVELS.ERROR, '点击后仍无法播放：' + (error && error.message ? error.message : error));
          setHintLocked('仍无法开始播放，请回主界面重新点「播放」。', 'warn', 8000);
        });
      }

      /**
       * 判断事件是否来自"当前正在用的这个播放器"。
       *
       * 销毁后的事件仍会按队列送达：没有这道校验时，旧播放器的 ERROR / LOADING_COMPLETE
       * 会作用到刚建好的新会话上（表现为"刚连上就被判定断流，然后又重连"），
       * 参考播放页用 `player !== ownedPlayer` 做了同样的过滤。
       * @param {object} run 运行对象。
       * @param {object} player 事件所属的播放器。
       * @returns {boolean} 事件有效返回 true。
       */
      function isCurrentPlayer(run, player) {
        return isActive(run) && state.ownedPlayer === player;
      }

      /** 绑定播放器事件。 */
      function attachPlayerEvents(run, candidate, player, isFlv) {
        if (isFlv) {
          player.on(window.mpegts.Events.ERROR, function onMpegtsError(errorType, errorDetail, errorInfo) {
            if (!isCurrentPlayer(run, player)) {
              return;
            }

            const description = (errorInfo && (errorInfo.msg || errorInfo.reason || errorInfo.description)) || '';
            if (core.isHttpStatusInvalid(errorType, errorDetail, window.mpegts)) {
              switchToNextCandidate(run, candidate, '返回 HTTP 状态错误');
              return;
            }

            if (core.isMseError(errorDetail, window.mpegts) && core.isHevcUnsupportedDescription(description)) {
              handleHevcUnsupported(run, candidate, description);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, '播放器错误：' + description);
            } else {
              switchToNextCandidate(run, candidate, '播放器错误：' + description);
            }
          });

          player.on(window.mpegts.Events.LOADING_COMPLETE, function onLoadingComplete() {
            if (!isCurrentPlayer(run, player)) {
              return;
            }

            /*
              直播流没有"下载结束"：取满缓冲后 mpegts.js 也会报一次 LOADING_COMPLETE，
              此时重连等于固定间隔地重建连接，画面必然一顿一顿。
              只有画面确实不再前进或缓冲已空时才按断流处理；
              用户按了暂停时画面本来就不前进，这种"下载结束"属于预期，直接忽略。
              这里必须读页面的 pausedByUser：run 上没有这个字段（曾经读 run.pausedByUser，
              于是这道"用户暂停"的保护从未生效过）。
            */
            if (state.pausedByUser) {
              logToHost(core.LOG_LEVELS.INFO, '用户暂停期间的 LOADING_COMPLETE 不按断流处理');
              return;
            }

            const buffered = core.getLocalBufferSeconds(elements.video.buffered, elements.video.currentTime);
            const starved = core.looksStarved(elements.video, buffered);
            if (!core.shouldRecoverAfterLoadingComplete(run, Date.now(), starved)) {
              logToHost(core.LOG_LEVELS.INFO, '缓冲已取满，等待播放消耗（不重连）');
              return;
            }

            logStreamEndedDiagnostics(run, candidate, buffered);
            recoverAfterInterruption(run, candidate, '直播连接已结束');
          });
          return;
        }

        if (window.Hls && !isFlv) {
          player.on(window.Hls.Events.ERROR, function onHlsError(eventName, data) {
            if (!isCurrentPlayer(run, player) || !data) {
              return;
            }

            if (!data.fatal) {
              return;
            }

            const detail = String(data.details || data.type || 'HLS 错误');
            if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
              /*
                只有"编码缺失"才是真的不可播；bufferAppendError / bufferStalledError 等
                先让 hls.js 重建媒体源通常就能恢复。旧实现把所有 fatal MEDIA_ERROR 都当成
                HEVC 不支持并永久停播，一次 MSE 抖动就变成"请改用 mpv"。
              */
              if (!core.isHlsCodecErrorDetail(detail) && run.mediaRecoverAttempts < 1) {
                run.mediaRecoverAttempts += 1;
                logToHost(core.LOG_LEVELS.WARN, 'HLS 媒体错误，尝试重建媒体源：' + detail);
                try {
                  if (typeof player.swapAudioCodec === 'function') {
                    player.swapAudioCodec();
                  }

                  player.recoverMediaError();
                  return;
                } catch (recoverError) {
                  logToHost(core.LOG_LEVELS.WARN, 'HLS 媒体错误恢复失败：' + (recoverError && recoverError.message));
                }
              }

              handleHevcUnsupported(run, candidate, detail);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, 'HLS 错误：' + detail);
            } else {
              switchToNextCandidate(run, candidate, 'HLS 错误：' + detail);
            }
          });
        }
      }

      /** HEVC 无法解码时的终止处理：明确提示并建议使用 mpv。 */
      function handleHevcUnsupported(run, candidate, description) {
        const message = hevcMseSupported
          ? '该直播流实际为 HEVC 编码，但系统拒绝了对应的 MSE 解码器；请改用左栏「mpv 播放」。'
          : '该直播流实际为 HEVC（H.265）编码，当前系统不支持 HEVC 解码，请改用左栏「mpv 播放」。';

        /*
          候选按"画质优先、同档 AVC 在前"排序，所以 HDR/高帧率房间的 HEVC 可能排第一。
          系统没有 HEVC 解码器时不该直接判死：后面还有 H.264 线路就自动换过去，
          只有"剩下的全是 HEVC"才提示改用 mpv（否则用户会以为这个房间根本播不了）。
        */
        const hasFallback = run.queue
          .slice(1)
          .some(function notHevc(item) { return item.codec !== 'hevc'; });
        if (hasFallback) {
          logToHost(core.LOG_LEVELS.WARN, 'HEVC 解码不可用，自动切换到下一条线路：' + description);
          report(outbound.WARNING, 'HEVC 解码不可用，正在切换线路…', run, candidate, { errorMessage: description });
          switchToNextCandidate(run, candidate, 'HEVC 解码不可用');
          return;
        }

        report(outbound.ERROR, message, run, candidate, { errorMessage: description });
        stopRun(run);
        destroyPlayer();
        state.currentStreamUrl = '';
        setHintLocked(message, 'error', 20000);
      }

      /** 切换到下一个候选。 */
      function switchToNextCandidate(run, candidate, reason) {
        if (!isActive(run) || run.switching) {
          return;
        }

        run.switching = true;
        run.playbackStarted = false;
        report(outbound.WARNING, '切换线路：' + reason, run, candidate);
        logToHost(core.LOG_LEVELS.WARN, '切换线路：' + reason);
        destroyPlayer();

        run.queue.shift();
        if (run.queue.length === 0) {
          /*
            这里必须先解除"正在切换"：`requestFreshSources` 之后没有起播路径会再复位它，
            留着 true 会让 `switching` 永久锁住（此后任何恢复分支都被它挡住）。
          */
          run.switching = false;
          requestFreshSources(run, '所有候选线路均不可用');
          return;
        }

        const next = run.queue[0];
        run.switchCount = (Number.isFinite(run.switchCount) ? run.switchCount : 0) + 1;
        run.summary.switches += 1;
        if (run.switchCount > core.MAX_CANDIDATE_SWITCHES_PER_SESSION) {
          /*
            换线次数到顶仍没出首帧：继续换只会不断重载、把"卡"变成"一直卡"。
            这里停下并请宿主重新解析一次，让用户看到明确结论而不是无尽重连。
          */
          run.switching = false;
          requestFreshSources(run, '连续切换线路 ' + (run.switchCount - 1) + ' 次仍未起播');
          return;
        }

        // 换线会销毁并重建播放器：加一个递增且有上界的退避，避免退化成重载风暴。
        const backoffMs = core.getCandidateSwitchBackoffMs(run.switchCount);
        window.setTimeout(function startNextCandidateAfterBackoff() {
          if (!isActive(run)) {
            return;
          }

          run.switching = false;
          void startCandidate(run, next);
        }, backoffMs);
      }

      /** 断流后的重连（每个候选最多两次）。 */
      function recoverAfterInterruption(run, candidate, reason) {
        /*
          重入保护只看真正会被设置的标志位：`switching`（正在切候选）与 `reconnecting`（已排定一次重连）。
          过去这里还看一个从未被赋值过的 `run.recovering`（恒为 false），它给了"有重入保护"的错觉。
        */
        if (!isActive(run) || run.reconnecting || run.switching) {
          return;
        }

        const now = Date.now();
        if (run.currentCandidateStartedAt > 0 && now - run.currentCandidateStartedAt >= core.RECONNECT_COUNTER_RESET_MS) {
          run.reconnectsBySource.set(candidate.sourceIndex, 0);
        }

        const reconnectCount = run.reconnectsBySource.get(candidate.sourceIndex) || 0;
        const delay = core.getReconnectDelayMs(reconnectCount, reason);
        if (delay < 0) {
          /*
            这里不再先把 switching 置 true 再置回来：`switchToNextCandidate` 自己会置位并守门，
            中间那次"强制解锁"会让同一个候选在本轮里被重复切换（重复销毁播放器 = 画面连续重建）。
          */
          report(outbound.WARNING, '当前线路重连未恢复，切换线路', run, candidate, { reconnectCount: reconnectCount });
          logToHost(core.LOG_LEVELS.WARN, '当前线路重连 ' + reconnectCount + ' 次未恢复，切换线路');
          switchToNextCandidate(run, candidate, reason);
          return;
        }

        run.reconnecting = true;
        run.reconnectsBySource.set(candidate.sourceIndex, reconnectCount + 1);
        report(outbound.RECONNECTING, '重连中（第 ' + (reconnectCount + 1) + ' 次）：' + reason, run, candidate, {
          reconnectCount: reconnectCount + 1,
        });
        // 重连是操作态：状态行由纯函数固定成「重连中（第 N 次）…」，之后的遥测刷新不会改写它。
        state.reconnectAttempt = reconnectCount + 1;
        applyPlaybackPhase(core.PLAYBACK_PHASES.RECONNECTING, run);

        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
        }

        run.recoveryTimer = window.setTimeout(function reconnectNow() {
          run.recoveryTimer = null;
          if (!isActive(run)) {
            return;
          }

          run.reconnecting = false;
          run.switching = false;
          run.playbackStarted = false;
          run.lastPlaybackPosition = 0;
          run.lastPlaybackProgressAt = Date.now();
          run.summary.reconnects += 1;
          void startCandidate(run, candidate);
        }, delay);
      }

      /**
       * 输出一次会话摘要：候选数、换线次数、重连次数、首帧耗时与峰值缓冲。
       *
       * 目的不是给用户看，而是让"为什么这个房间卡/播不了"能从一份日志里直接读出来，
       * 不必再去翻成百上千条探测与切换记录。每个会话只输出一次（停止或最终失败时）。
       * @param {object} run 运行对象。
       * @param {string} reason 结束原因。
       */
      function emitSessionSummary(run, reason) {
        if (!run || run.summaryReported) {
          return;
        }

        run.summaryReported = true;
        const summary = run.summary;
        const firstFrame = summary.firstFrameMs === null ? '未出画' : summary.firstFrameMs + ' ms';
        logToHost(
          core.LOG_LEVELS.INFO,
          '会话摘要（' + reason + '）：候选 ' + run.candidates.length + ' 条，换线 ' + summary.switches
            + ' 次，重连 ' + summary.reconnects + ' 次，首帧 ' + firstFrame
            + '，峰值缓冲 ' + summary.maxAheadMs + ' ms');
      }

      /**
       * 上游结束连接时记录一条诊断：用来区分"CDN 限流/参数问题"与"客户端追帧/缓冲问题"。
       *
       * 关键字段：已播放时长（太短说明一开始就被拒）、媒体时间与缓冲（判断是断流还是卡住）、
       * `networkState`（1=空闲、2=加载中、3=无源，3 说明地址本身没下发）。
       * @param {object} run 运行对象。
       * @param {object} candidate 当前候选。
       * @param {number} bufferedSeconds 当前缓冲秒数（无缓冲时为 0）。
       */
      function logStreamEndedDiagnostics(run, candidate, bufferedSeconds) {
        const playedMs = run.currentCandidateStartedAt > 0 ? Date.now() - run.currentCandidateStartedAt : 0;
        logToHost(
          core.LOG_LEVELS.WARN,
          '连接结束诊断：主机 ' + (candidate && candidate.host ? candidate.host : '未知')
            + '，会话已播放 ' + Math.round(playedMs / 1000) + ' 秒'
            + '，媒体时间 ' + Math.round(elements.video.currentTime * 10) / 10 + ' 秒'
            + '，缓冲 ' + (Number.isFinite(bufferedSeconds) ? Math.round(bufferedSeconds * 10) / 10 : 0) + ' 秒'
            + '，networkState ' + elements.video.networkState
            + '，readyState ' + elements.video.readyState);
      }

      /** 请求宿主重新解析（每个会话只请求一次）。 */
      function requestFreshSources(run, reason) {
        if (!isActive(run) || run.refreshRequested) {
          return;
        }

        run.refreshRequested = true;
        emitSessionSummary(run, reason);
        destroyPlayer();
        state.currentStreamUrl = '';
        setHintLocked('播放失败：所有线路都连不上（可能未开播、地区受限或网络问题）。\n正在请主程序重新解析…\n' + reason, 'error', 10000);
        report(outbound.REFRESH_NEEDED, reason, run, run.currentCandidate);
      }

      /**
       * 缓冲失控自救：数据一直在到达、缓冲一直在增长、画面却不再前进。
       *
       * 为什么要单独做这件事（真机实测 B站 814：bufferedAheadMs 81.9→111.9 秒、画面 82→112 秒没前进、
       * reconnects 恒为 0）：画面停住时若没有人 seek，缓冲会按网络速率无上限增长，而两条既有追帧路径都进不去——
       * mpegts.js 的延迟追帧器只在元素**未暂停**时生效（`liveBufferLatencyChasingOnPaused` 默认关闭），
       * 且直播流（`isLive: true`）在 mpegts.js 里**不做下载节流**，所以数据会一直堆；
       * 页面的手动追帧又只在用户点按钮 / 换档位 / 继续播放时触发。
       * 处置顺序由 `core.decideBufferRunawayAction` 决定：先恢复播放、再追帧，自行处置用尽后交给既有重连 / 切候选。
       * @param {object} run 运行对象。
       * @param {HTMLVideoElement} video 视频元素。
       * @param {number|null} localBuffer 本地缓冲剩余秒数。
       * @param {number} silenceMs 画面停滞时长（毫秒）。
       */
      function handleBufferRunaway(run, video, localBuffer, silenceMs) {
        const aheadMs = Math.round((Number(localBuffer) || 0) * 1000);
        const aheadSeconds = Math.round(aheadMs / 1000);
        const stalledSeconds = Math.round(silenceMs / 1000);
        const now = Date.now();
        const sinceHandledMs = run.runawayHandledAt > 0 ? now - run.runawayHandledAt : Number.POSITIVE_INFINITY;
        const action = core.decideBufferRunawayAction(
          localBuffer,
          silenceMs,
          state.pausedByUser,
          video.paused,
          run.runawayChaseAttempts,
          sinceHandledMs);

        if (action === core.RUNAWAY_ACTIONS.RECONNECT) {
          logToHost(core.LOG_LEVELS.WARN, '缓冲失控：' + aheadSeconds + ' 秒缓冲未被消耗且追帧无效，按断流处理');
          report(outbound.WARNING, '缓冲失控且追帧无效，改为重连', run, run.currentCandidate, {
            bufferedAheadMs: aheadMs,
            secondsSinceProgress: stalledSeconds,
            runawayChaseAttempts: run.runawayChaseAttempts,
          });
          run.runawayChaseAttempts = 0;
          run.runawayHandledAt = 0;
          recoverAfterInterruption(run, run.currentCandidate, '缓冲失控（' + aheadSeconds + ' 秒缓冲未被消耗）');
          return;
        }

        run.runawayChaseAttempts += 1;
        run.runawayHandledAt = now;
        if (action === core.RUNAWAY_ACTIONS.RESUME) {
          /*
            元素被"非用户原因"暂停（用户没点暂停）：先把播放意图恢复回来，
            否则任何追帧都不会被消费（mpegts.js 的追帧器也会因 paused 而完全跳过）。
          */
          logToHost(core.LOG_LEVELS.WARN, '画面被暂停但用户没有点过暂停，已恢复播放');
          video.play().catch(function onResumeFailed(error) {
            logToHost(core.LOG_LEVELS.WARN, '恢复播放失败：' + (error && error.message ? error.message : error));
          });
        }

        const chased = chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        logToHost(core.LOG_LEVELS.WARN, '缓冲失控：' + aheadSeconds + ' 秒缓冲未被消耗（画面停滞 '
          + stalledSeconds + ' 秒），已追帧到直播边缘（第 ' + run.runawayChaseAttempts + ' 次，追帧'
          + (chased ? '成功' : '失败') + '）');
        report(outbound.WARNING, '缓冲失控追帧', run, run.currentCandidate, {
          bufferedAheadMs: aheadMs,
          secondsSinceProgress: stalledSeconds,
          runawayChaseAttempts: run.runawayChaseAttempts,
          chased: chased,
        });
      }

      /** 启动遥测与卡顿检测。 */
      function startTelemetry(run) {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
        }

        state.telemetryTimer = window.setInterval(function onTick() {
          if (!isActive(run)) {
            return;
          }

          const video = elements.video;
          if (core.hasProgressed(video.currentTime, run.lastPlaybackPosition)) {
            run.lastPlaybackPosition = video.currentTime;
            run.lastPlaybackProgressAt = Date.now();
            // 画面重新前进：这一次的缓冲失控已经结束，处置计数归零。
            run.runawayChaseAttempts = 0;
            run.runawayHandledAt = 0;
          }

          const silenceMs = Date.now() - run.lastPlaybackProgressAt;
          const localBuffer = core.getLocalBufferSeconds(video.buffered, video.currentTime);
          const starved = core.looksStarved(video, localBuffer);

          /*
            状态行左侧色条：缓冲越小越贴直播（绿），越大说明落后（黄/红）；
            画面超过 BUFFER_HEALTH_STALL_MS 没前进时一律判红——那正是用户看到的卡住。
          */
          setBufferHealth(core.resolveBufferHealth(localBuffer, {
            paused: state.pausedByUser,
            playing: Boolean(run.playbackStarted),
            stalled: starved || silenceMs >= BUFFER_HEALTH_STALL_MS,
          }), localBuffer);

          /*
            把实测到的本地缓冲剩余量记为"实际延迟"，供状态行显示真实数值：
            取不到缓冲（localBuffer === null）时写 null，状态行就不显示延迟段，
            绝不用档位值（150/200/250）冒充实测结果。
          */
          run.lastLatencyMs = localBuffer === null ? null : Math.round(localBuffer * 1000);
        if (run.lastLatencyMs !== null && run.lastLatencyMs > run.summary.maxAheadMs) {
          run.summary.maxAheadMs = run.lastLatencyMs;
        }
          refreshPlaybackStatus(run);

          /*
            不在这里"自动回落到稳定档"：那会把 150/200/250 三档悄悄改成别的东西，
            而档位入口只有画面下方一处，用户看到的档位必须就是真正生效的档位。
            抖动时该做的是按本模式的阈值尽快重连（见 core.isPlaybackStalled），
            而不是替用户改设置——参考播放页同样只做重连、不改档位。
          */
          if (run.playbackStarted && !run.switching && !run.reconnecting) {
            // 缓冲远大于目标延迟却不再前进：先自救（恢复播放 / 追帧），无效才走重连。
            if (core.isBufferRunaway(localBuffer, silenceMs, state.pausedByUser)) {
              handleBufferRunaway(run, video, localBuffer, silenceMs);
              return;
            }

            if (core.isPlaybackStalled(silenceMs, starved, state.resumedAt, Date.now(), run.extreme, state.pausedByUser)) {
              recoverAfterInterruption(run, run.currentCandidate, '画面进度超过 ' + Math.round(silenceMs / 1000) + ' 秒未前进');
              return;
            }
          }

          const now = Date.now();
          if (now - run.lastTelemetryReportedAt >= core.TELEMETRY_REPORT_INTERVAL_MS) {
            run.lastTelemetryReportedAt = now;
            let quality = null;
            if (typeof video.getVideoPlaybackQuality === 'function') {
              quality = video.getVideoPlaybackQuality();
            }

            report(outbound.TELEMETRY, '遥测', run, run.currentCandidate, {
              currentTime: video.currentTime,
              bufferedAheadMs: run.lastLatencyMs,
              readyState: video.readyState,
              networkState: video.networkState,
              paused: video.paused,
              /*
                paused 是"元素"的状态，pausedByUser 才是"用户意图"。
                实测坏状态里两者不一致（元素停了、用户没点暂停），故障排查必须能区分，
                因此把它俩与缓冲失控处置次数一起上报。
              */
              pausedByUser: state.pausedByUser,
              elementPaused: video.paused,
              ended: video.ended,
              playbackRate: video.playbackRate,
              secondsSinceProgress: Math.round(silenceMs / 1000),
              droppedVideoFrames: quality ? quality.droppedVideoFrames : null,
              totalVideoFrames: quality ? quality.totalVideoFrames : null,
              mode: run.mode,
              extremeTargetMs: run.extremeTargetMs,
              runawayChaseAttempts: run.runawayChaseAttempts,
              reconnects: run.reconnectsBySource.get(run.currentCandidate ? run.currentCandidate.sourceIndex : -1) || 0,
            });
          }
        }, core.TELEMETRY_INTERVAL_MS);
      }

      /**
       * 立刻跳到直播最新位置（缓冲末端前 keepSeconds 秒）。
       * @param {number} keepSeconds 保留的缓冲秒数。
       * @returns {boolean} 缓冲可用并已跳到目标位置（或已在目标位置）返回 true。
       */
      function chaseToLiveEdge(keepSeconds) {
        const video = elements.video;
        const ranges = video.buffered;
        if (!ranges || ranges.length === 0) {
          return false;
        }

        const last = ranges.length - 1;
        const target = core.computeChaseTargetSeconds(ranges.start(last), ranges.end(last), keepSeconds);
        if (!Number.isFinite(target) || Math.abs(video.currentTime - target) <= 0.01) {
          return true;
        }

        try {
          video.currentTime = target;
        } catch (error) {
          // 缓冲异常大时 seek 目标可能落在 seekable 之外：这里只记录失败，由调用方决定是否升级为重连。
          logToHost(core.LOG_LEVELS.WARN, '追帧失败：' + (error && error.message ? error.message : error));
          return false;
        }

        return true;
      }

      /** 停止一个播放会话。 */
      function stopRun(run) {
        if (!run) {
          return;
        }

        run.stopped = true;
        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
          run.recoveryTimer = null;
        }

        // 会话结束时中止所有在途探测请求，避免它们在新会话里读到过期结果。
        for (const controller of run.controllers) {
          try {
            controller.abort();
          } catch (abortError) {
            logToHost(core.LOG_LEVELS.WARN, '中止探测请求失败：' + (abortError && abortError.message));
          }
        }

        run.controllers.clear();
        destroyPlayer();
      }

      /** 处理宿主下发的 play 消息。 */
      async function handlePlay(payload) {
        if (state.run) {
          // 切换画质/重新解析时先给一句话，避免旧画面销毁后出现纯黑屏。
          setHint('正在切换到新线路…', 'info');
          stopRun(state.run);
          state.run = null;
        }

        state.refreshRequested = false;
        state.pausedByUser = false;
        state.resumedAt = 0;
        // 新会话从"播放中"阶段开始（首帧到达后由遥测刷新延迟数值），重连计数归零。
        state.statusPhase = core.PLAYBACK_PHASES.PLAYING;
        state.reconnectAttempt = 0;
        const normalized = core.buildPlaybackPlan(
          payload,
          canPlayFlv(),
          canPlayHls(),
          hevcMseSupported);

        const plan = normalized.plan;
        if (!plan || plan.candidates.length === 0) {
          const message = normalized.unsupportedCount > 0
            ? '候选线路均无法在本页播放（编码或格式不受支持），请点击「mpv 播放」。'
            : '没有可用的候选线路。';
          setHintLocked(message, 'error', 20000);
          report(outbound.ERROR, message, null, null, { unsupportedCount: normalized.unsupportedCount });

          // 零候选多半是"平台签名已过期"：请宿主强制重新解析一次（有上限），而不是停在这里。
          if (normalized.unsupportedCount === 0 && !state.refreshRequested) {
            state.refreshRequested = true;
            report(outbound.REFRESH_NEEDED, '没有可用的候选线路（可能已过期）', null, null);
          }

          return;
        }

        renderLines(plan);

        const run = {
          sessionId: plan.sessionId,
          mode: plan.mode,
          extreme: plan.extreme,
          extremeTargetMs: plan.extremeTargetMs,
          extremeTargetSeconds: plan.extremeTargetSeconds,
          candidates: plan.candidates,
          queue: [],
          attempted: new Set(),
          /** 探测请求的中止控制器：会话结束时统一 abort，避免留下半开的探测连接。 */
          controllers: new Set(),
          stopped: false,
          switching: false,
          reconnecting: false,
          playbackStarted: false,
          /** 本次会话已换线次数：只在没出首帧时累计，出首帧后归零。 */
          switchCount: 0,
          /** 会话摘要计数：结束时输出一次，便于按房间复盘"卡在哪一步"。 */
          summary: { switches: 0, reconnects: 0, maxAheadMs: 0, firstFrameMs: null },
          /** 摘要是否已输出（每个会话只输出一次）。 */
          summaryReported: false,
          everPlayed: false,
          refreshRequested: false,
          currentCandidate: null,
          currentCandidateStartedAt: 0,
          reconnectCount: 0,
          reconnectsBySource: new Map(),
          recoveryTimer: null,
          lastPlaybackPosition: 0,
          lastPlaybackProgressAt: Date.now(),
          lastTelemetryReportedAt: 0,
          /** 本次缓冲失控里已经自行处置（恢复播放 / 追帧）的次数。 */
          runawayChaseAttempts: 0,
          /** 本会话已尝试过的 hls.js 媒体错误恢复次数（只允许一次，避免无限重建）。 */
          mediaRecoverAttempts: 0,
          /** 上一次缓冲失控自行处置的时间戳（0 表示还没处置过）。 */
          runawayHandledAt: 0,
          /** 是否保留库内自动追帧；false 表示用户点了「停止追帧」（不暂停播放）。 */
          autoChaseEnabled: true,
          /** 最近一次遥测测到的真实延迟（毫秒）；没有测量值时为 null，状态行据此决定是否显示延迟段。 */
          lastLatencyMs: null,
        };

        state.roomTitle = typeof payload.title === 'string' ? payload.title : '';

        state.run = run;
        state.mode = run.mode;
        // 会话创建后让「缓冲」下拉回到本次会话的模式（稳定缓冲 / 极限追帧）。
        syncModeSelect();
        setStatus('正在检测候选线路…');
        logToHost(core.LOG_LEVELS.INFO, '开始播放会话 #' + run.sessionId + '（' + core.modeLabel(run) + '）');

        const queue = await buildCandidateQueue(run);
        if (!isActive(run)) {
          return;
        }

        run.queue = queue;
        if (queue.length === 0) {
          // 探测阶段已经请求过宿主重新解析时不再叠一条提示（否则状态行会被两条错误来回覆盖）。
          if (run.refreshRequested) {
            return;
          }

          const message = normalized.unsupportedCount > 0
            ? '所有候选线路都不被本页支持，请点击「mpv 播放」。'
            : '所有候选线路都拒绝了内置播放器的请求，请稍后重试或改用「mpv 播放」。';
          setHintLocked(message, 'error', 10000);
          report(outbound.ERROR, message, run, null, { mode: run.mode });
          return;
        }

        await startCandidate(run, queue[0]);
      }

      /**
       * 恢复重建后的播放位置与音量，并接着播放（用户处于暂停态时保持暂停）。
       *
       * 销毁播放器会把 `video` 的 `playbackRate` / `volume` 复位，重建必须把这些"用户侧状态"补回来，
       * 否则"换档位"会顺带把音量或倍速改成默认值。
       * @param {object} snapshot {@link core.snapshotRuntimeState} 的结果。
       */
      function restoreMediaAfterRebuild(snapshot) {
        elements.video.playbackRate = 1;
        applyVolume(snapshot.volumePercent);
        if (snapshot.positionSeconds > REBUILD_POSITION_RESTORE_MIN_SECONDS) {
          try {
            elements.video.currentTime = snapshot.positionSeconds;
          } catch (error) {
