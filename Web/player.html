<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamPilot 播放器</title>
  <!--
    StreamPilot 自研播放页。
    第三方库（Apache-2.0，随包分发，见 THIRD-PARTY-NOTICES.md）：
      mpegts.js 1.8.2  HTTP-FLV / MSE 低延迟播放
      hls.js 1.6.16    HLS 播放
    纯逻辑实现位于 player-core.js（同一份代码也被 node --test 覆盖）。
  -->
  <script src="./mpegts.js"></script>
  <script src="./hls.js"></script>
  <style>
    /*
      配色策略（修复"白底白字"）：
      1. html 上先给出无条件的浅色兜底（不依赖 CSS 变量），避免 :root 变量未生效时出现底色异常；
      2. color-scheme: light 让滚动条、range 等"原生控件"也走浅色，不受系统深色主题影响；
      3. 每个元素都显式声明 color/background/border，不依赖从 body 继承，杜绝"底色与文字同色"的不可读组合；
      4. 强制配色模式（Windows 高对比度）下本页面依旧保持浅色，避免系统强制色造成不可读。
    */
    html {
      background: #f5f6f8;
      color: #1f2329;
      color-scheme: light;
    }

    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e5ea;
      --border-strong: #c7cdd6;
      --text: #1f2329;
      --text-strong: #ffffff;
      --muted: #6b7280;
      --control: #ffffff;
      --control-active: #e8f1ff;
      --accent: #2f6feb;
      --warn: #b45309;
      --error: #c0392b;
      --ok: #1f8a4c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #f5f6f8;
      color: #1f2329;
      font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* 强制配色模式下保持既定深色，避免出现"系统白底 + 本页浅色文字"的不可读组合 */
    @media (forced-colors: active) {
      html,
      body,
      header,
      footer,
      #stage,
      #controls,
      #logPanel,
      #statusLine,
      #hint,
      #volDisplay {
        forced-color-adjust: none;
        background: #f5f6f8;
        color: #1f2329;
      }

      button,
      select,
      input[type="range"] {
        forced-color-adjust: none;
        background: #ffffff;
        color: #1f2329;
        border: 1px solid #c7cdd6;
      }
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #ffffff;
      border-bottom: 1px solid #e2e5ea;
      flex: 0 0 auto;
    }

    #modeHint {
      flex: 1 1 auto;
      min-width: 0;
      color: #5b6472;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button,
    input[type="range"] {
      font: inherit;
      color: #1f2329;
      background-color: #ffffff;
      border: 1px solid #e2e5ea;
      border-radius: 6px;
      padding: 4px 8px;
      -webkit-appearance: none;
      appearance: none;
    }

    /* range 滑块：加大对比度，避免在某些主题下"看不见" */
    input[type="range"] {
      padding: 0;
      height: 20px;
      width: 140px;
      background: transparent;
      border: none;
      accent-color: #2f6feb;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #c7cdd6;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border-radius: 50%;
      background: #2f6feb;
      border: 1px solid #f5f6f8;
    }

    button {
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: #2f6feb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    button.active {
      border-color: #2f6feb;
      background-color: #e8f1ff;
    }

    .spacer {
      flex: 1 1 auto;
    }

    /*
      画质档位与全屏放在画面下方（footer）：
      贴着画面的按钮比页头更容易点到，也避免页头在窄窗口里挤成一团。
    */
    #qualityBox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    #qualityBox.hidden {
      display: none;
    }

    #qualityBox .qualityLabel {
      color: #5b6472;
      font-size: 15px;
    }

    #qualitySelect {
      cursor: pointer;
      border-radius: 8px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #c7cdd6;
      background: #ffffff;
      color: #1f2329;
      font-family: inherit;
      font-size: 15px;
      max-width: 220px;
    }

    #qualitySelect:hover {
      border-color: #1b4fd8;
    }

    #fsBtn {
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 8px;
    }

    #toggleLog {
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      /* 换行到第二行时也靠右，和上一行的音量行分开 */
      margin-left: auto;
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      /* 空画面用极浅的竖向渐变，比一整块灰底更耐看；有画面后由视频内容覆盖 */
      background: linear-gradient(180deg, #fbfcfd 0%, #e8ecf2 100%);
      min-height: 0;
    }

    video {
      width: 100%;
      height: 100%;
      background-color: transparent;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    #hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e4e8ee;
      box-shadow: 0 10px 26px rgba(31, 35, 41, 0.07);
      color: #1f2329;
      text-align: center;
      white-space: pre-wrap;
      pointer-events: none;
    }

    /* 空态：图标 + 标题 + 一句操作提示，代替原来只有一行字的白条 */
    #hint.empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 16px;
      font-weight: 600;
      padding: 30px 44px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(31, 35, 41, 0.1);
    }

    #hint.empty::before {
      content: '▶';
      display: block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      padding-left: 4px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: #eaf1fe;
      color: #1b4fd8;
      font-size: 18px;
      box-sizing: border-box;
    }

    /* 空态副文案由脚本写入 data-action（文案本体在 player-core.js，与测试同源） */
    #hint.empty::after {
      content: attr(data-action);
      font-size: 13px;
      font-weight: 400;
      color: #5b6472;
    }

    #hint[data-level="warn"] {
      border-color: #b45309;
    }

    #hint[data-level="error"] {
      border-color: #c0392b;
    }

    #hint.hidden,
    #volDisplay.hidden,
    #logPanel.hidden,
    footer.hidden {
      display: none;
    }

    #volDisplay {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 2;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e5ea;
      color: #1f2329;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #e2e5ea;
      background: #ffffff;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      row-gap: 8px;
      padding: 8px 10px;
      /* 窄窗口时换行而不是把控件压扁 */
      flex-wrap: wrap;
      color: #1f2329;
    }

    .controlLabel {
      color: #6b7280;
    }

    #statusLine {
      padding: 0 10px 6px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #logPanel {
      max-height: 132px;
      overflow-y: auto;
      border-top: 1px solid #e2e5ea;
      padding: 6px 10px;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      color: #6b7280;
      scrollbar-color: #c7cdd6 #ffffff;
    }

    #logPanel div {
      white-space: pre-wrap;
      word-break: break-all;
    }

    #logPanel div[data-level="warn"] {
      color: #b45309;
    }

    #logPanel div[data-level="error"] {
      color: #c0392b;
    }

    #logPanel div[data-level="ok"] {
      color: #1f8a4c;
    }

    #volumeLabel {
      color: #6b7280;
      min-width: 46px;
      text-align: right;
    }
  </style>
</head>

<body>
  <div id="root">
    <!--
      播放页只保留"观看相关"的控件（模式提示、画质、全屏、音量、可选的日志面板）。
      追帧档位与播放控制（解析 / 开始播放 / 追帧 / mpv 播放）统一放在主界面左侧面板，
      避免同一个设置或动作在多处各有一份。
      页头只留模式提示：它常驻显示"当前档位 + 播放状态"，值得占据整行。
    -->
    <header>
      <span id="modeHint" class="hintText">等待直播源</span>
    </header>

    <div id="stage">
      <video id="video" playsinline></video>
      <div id="hint" class="empty" data-level="info">等待直播源</div>
      <div id="volDisplay" class="hidden">音量：30%</div>
    </div>

    <footer>
      <div id="controls">
        <span class="controlLabel">音量</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="30" />
        <span id="volumeLabel">30%</span>
        <span class="spacer"></span>
        <label id="qualityBox" class="hidden" for="qualitySelect">
          <span class="qualityLabel">画质</span>
          <select id="qualitySelect"></select>
        </label>
        <button type="button" id="fsBtn" title="全屏（双击画面同样可切换）">全屏</button>
        <button type="button" id="toggleLog">显示日志</button>
      </div>
      <div id="statusLine">未连接</div>
      <div id="logPanel" class="hidden"></div>
    </footer>
  </div>

  <script src="./player-core.js"></script>
  <script>
    'use strict';

    (function main() {
      const core = window.StreamPilotPlayerCore;
      const outbound = core.OUTBOUND_MESSAGE_TYPES;

      /** 宿主消息通道：WebView2 的 chrome.webview。外部浏览器打开时为空。 */
      const hostChannel = (function createHostChannel() {
        if (window.chrome && window.chrome.webview) {
          return {
            post: function post(payload) {
              window.chrome.webview.postMessage(payload);
            },
            onMessage: function onMessage(handler) {
              window.chrome.webview.addEventListener('message', function onWebMessage(event) {
                handler(event.data);
              });
            },
          };
        }

        return null;
      }());

      const elements = {
        video: document.getElementById('video'),
        hint: document.getElementById('hint'),
        status: document.getElementById('statusLine'),
        log: document.getElementById('logPanel'),
        volume: document.getElementById('volume'),
        volumeLabel: document.getElementById('volumeLabel'),
        volDisplay: document.getElementById('volDisplay'),
        modeHint: document.getElementById('modeHint'),
        fsBtn: document.getElementById('fsBtn'),
        qualityBox: document.getElementById('qualityBox'),
        qualitySelect: document.getElementById('qualitySelect'),
        toggleLog: document.getElementById('toggleLog'),
        stage: document.getElementById('stage'),
      };

      /** 页面状态。 */
      const state = {
        run: null,
        ownedPlayer: null,
        currentStreamUrl: '',
        currentReferer: '',
        bridgeBaseAddress: '',
        roomTitle: '',
        lastVolume: core.INITIAL_VOLUME_PERCENT,
        muteToggleVolume: core.INITIAL_VOLUME_PERCENT,
        // 自动播放被策略拦截时置位：此时点画面是"接着播"，而不是切换静音。
        autoplayBlocked: false,
        autoplayStartedAt: 0,
        hintLockUntil: 0,
        eventSequence: 0,
        probeControllers: [],
        telemetryTimer: null,
        refreshRequested: false,
        capabilities: { hevc: false, avc: false },
        qualityKey: '',
      };

      const hevcMseSupported = Boolean(window.MediaSource)
        && (MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L120.90"')
          || MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L120.90"'));
      const avcMseSupported = Boolean(window.MediaSource)
        && MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
        && MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"');
      state.capabilities.hevc = hevcMseSupported;
      state.capabilities.avc = avcMseSupported;

      /** 判断候选能否在本页播放。 */
      function canPlayFlv() {
        return Boolean(window.mpegts && window.mpegts.isSupported());
      }

      function canPlayHls() {
        return Boolean(window.Hls && window.Hls.isSupported());
      }

      /** 向宿主上报事件。 */
      function report(type, message, run, candidate, extras) {
        state.eventSequence += 1;
        const payload = {
          type: type,
          message: String(message || ''),
          eventSequence: state.eventSequence,
          pageElapsedMs: Math.round(performance.now()),
        };

        if (run && Number.isSafeInteger(run.sessionId)) {
          payload.sessionId = run.sessionId;
        }

        if (candidate && Number.isInteger(candidate.sourceIndex)) {
          payload.sourceIndex = candidate.sourceIndex;
        }

        if (candidate && typeof candidate.urlFingerprint === 'string') {
          payload.urlFingerprint = candidate.urlFingerprint;
        }

        if (extras) {
          Object.assign(payload, extras);
        }

        if (hostChannel) {
          hostChannel.post(payload);
        }
      }

      /** 写日志面板。 */
      function appendLog(level, text) {
        const row = document.createElement('div');
        row.dataset.level = level;
        row.textContent = '[' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '] ' + text;
        elements.log.appendChild(row);
        while (elements.log.childElementCount > 200) {
          elements.log.removeChild(elements.log.firstChild);
        }

        elements.log.scrollTop = elements.log.scrollHeight;
      }

      /** 设置居中提示。 */
      function setHint(message, level) {
        elements.hint.textContent = message;
        elements.hint.dataset.level = level || 'info';
        elements.hint.classList.remove('empty');
        elements.hint.classList.remove('hidden');
      }

      /**
       * 回到空态提示。文案取 player-core 的常量，
       * 避免"页面写一套、测试测另一套"。
       */
      function showEmptyState() {
        elements.hint.textContent = core.EMPTY_HINT_TITLE;
        elements.hint.dataset.action = core.EMPTY_HINT_ACTION;
        elements.hint.dataset.level = 'info';
        elements.hint.classList.remove('hidden');
        elements.hint.classList.add('empty');
      }

      /** 设置提示并锁定指定时长（毫秒）。 */
      function setHintLocked(message, level, lockMs) {
        setHint(message, level);
        state.hintLockUntil = Date.now() + (lockMs || 0);
      }

      /** 设置状态行（受提示锁保护）。 */
      function setStatus(message) {
        if (Date.now() < state.hintLockUntil) {
          return;
        }

        elements.status.textContent = message;
      }

      /** 更新顶部模式提示（档位 + 播放状态；候选主机名不上界面）。 */
      function updateModeHint() {
        elements.modeHint.textContent = core.formatModeHint(state.run);
      }

      /** 销毁当前播放器并释放资源。 */
      function destroyPlayer() {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
          state.telemetryTimer = null;
        }

        abortProbes();

        const player = state.ownedPlayer;
        state.ownedPlayer = null;
        if (!player) {
          return;
        }

        try {
          player.pause();
        } catch (error) {
          appendLog('warn', '暂停播放器失败：' + error.message);
        }

        try {
          if (typeof player.unload === 'function') {
            player.unload();
          }

          if (typeof player.detachMediaElement === 'function') {
            player.detachMediaElement();
          }

          if (typeof player.destroy === 'function') {
            player.destroy();
          }
        } catch (error) {
          appendLog('warn', '释放播放器失败：' + error.message);
        }

        try {
          elements.video.pause();
          elements.video.removeAttribute('src');
          elements.video.load();
        } catch (error) {
          appendLog('warn', '重置视频元素失败：' + error.message);
        }

        elements.video.playbackRate = 1;
      }

      /** 取消所有进行中的候选探测。 */
      function abortProbes() {
        for (const controller of state.probeControllers) {
          try {
            controller.abort();
          } catch (error) {
            appendLog('warn', '取消探测失败：' + error.message);
          }
        }

        state.probeControllers = [];
      }

      /** 带超时的 Promise 包装。 */
      function awaitWithTimeout(promise, timeoutMs, timeoutMessage, onTimeout) {
        let timer = null;
        const timeout = new Promise(function rejectAfterTimeout(resolve, reject) {
          timer = window.setTimeout(function onTimeoutElapsed() {
            const error = new Error(timeoutMessage);
            error.name = 'TimeoutError';
            if (typeof onTimeout === 'function') {
              onTimeout();
            }

            reject(error);
          }, timeoutMs);
        });

        return Promise.race([promise, timeout]).finally(function clearTimer() {
          if (timer !== null) {
            window.clearTimeout(timer);
          }
        });
      }

      /** 判断 run 是否仍然有效（防止过期会话污染当前状态）。 */
      function isActive(run) {
        return Boolean(run) && state.run === run && !run.stopped;
      }

      /** 并行探测所有候选，按"已知可用优先、延迟升序"重排队列。 */
      async function buildCandidateQueue(run) {
        report(outbound.CHECKING, '正在探测 ' + run.candidates.length + ' 个候选线路…', run);
        const good = [];
        const inconclusive = [];

        await Promise.all(run.candidates.map(async function probe(candidate) {
          const controller = new AbortController();
          state.probeControllers.push(controller);
          const startedAt = performance.now();
          try {
            const response = await awaitWithTimeout(
              fetch(candidate.url, {
                method: 'GET',
                mode: 'cors',
                cache: 'no-store',
                credentials: 'omit',
                referrerPolicy: 'no-referrer-when-downgrade',
                signal: controller.signal,
              }),
              core.PROBE_TIMEOUT_MS,
              '候选探测超时',
              function abortOnTimeout() {
                controller.abort();
              });
            const elapsedMs = Math.round(performance.now() - startedAt);
            if (!isActive(run)) {
              return;
            }

            if (response.status >= 200 && response.status < 300) {
              good.push({ candidate: candidate, elapsedMs: elapsedMs });
              report(outbound.PROBE_RESULT, candidate.host + ' 可用', run, candidate, {
                outcome: 'good',
                elapsedMs: elapsedMs,
                statusCode: response.status,
              });
            } else if (response.status >= 400) {
              report(outbound.PROBE_REJECTED, candidate.host + ' 拒绝（HTTP ' + response.status + '）', run, candidate, {
                outcome: 'rejected',
                elapsedMs: elapsedMs,
                statusCode: response.status,
              });
            } else {
              inconclusive.push(candidate);
              report(outbound.PROBE_RESULT, candidate.host + ' 结果不确定（HTTP ' + response.status + '）', run, candidate, {
                outcome: 'inconclusive',
                elapsedMs: elapsedMs,
                statusCode: response.status,
              });
            }
          } catch (error) {
            if (!isActive(run)) {
              return;
            }

            if (error && error.name === 'TimeoutError') {
              inconclusive.push(candidate);
              report(outbound.PROBE_RESULT, candidate.host + ' 探测超时', run, candidate, { outcome: 'inconclusive' });
            } else {
              inconclusive.push(candidate);
              report(outbound.PROBE_RESULT, candidate.host + ' 探测失败：' + (error && error.message), run, candidate, {
                outcome: 'inconclusive',
                errorName: error && error.name,
                errorMessage: error && error.message,
              });
            }
          }
        }));

        good.sort(function byLatency(left, right) {
          return left.elapsedMs - right.elapsedMs;
        });

        const queue = good.map(function pick(entry) {
          return entry.candidate;
        }).concat(inconclusive);

        report(outbound.CANDIDATE_QUEUE, '可用线路 ' + good.length + ' 个，待尝试 ' + queue.length + ' 个', run, null, {
          sourceIndexes: queue.map(function index(item) {
            return item.sourceIndex;
          }),
          knownGoodCount: good.length,
          inconclusiveCount: inconclusive.length,
        });

        return queue;
      }

      /** 启动某个候选的播放。 */
      async function startCandidate(run, candidate) {
        if (!isActive(run)) {
          return;
        }

        run.currentCandidate = candidate;
        state.currentStreamUrl = candidate.url;
        state.currentReferer = candidate.referer || '';
        updateModeHint();
        report(outbound.CANDIDATE_ACTIVE, '正在连接 ' + candidate.host, run, candidate);

        destroyPlayer();
        if (!isActive(run)) {
          return;
        }

        state.autoplayBlocked = false;
        // 不再预先静音：首帧起来后用户应当直接听到声音（音量由 applyVolume 决定）。
        if ('preservesPitch' in elements.video) {
          elements.video.preservesPitch = true;
        }

        const isHls = core.isHlsCandidate(candidate);
        if (!isHls) {
          if (!canPlayFlv()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HTTP-FLV 播放');
            return;
          }

          state.ownedPlayer = window.mpegts.createPlayer(
            { type: 'flv', isLive: true, url: candidate.url, hasAudio: true, hasVideo: true },
            core.buildMpegtsConfig(run.extreme, run.extremeTargetSeconds));
          attachPlayerEvents(run, candidate, state.ownedPlayer, true);
          state.ownedPlayer.attachMediaElement(elements.video);
          state.ownedPlayer.load();
        } else {
          if (!canPlayHls()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HLS 播放');
            return;
          }

          state.ownedPlayer = new window.Hls(core.buildHlsConfig(run.extreme));
          attachPlayerEvents(run, candidate, state.ownedPlayer, false);
          state.ownedPlayer.loadSource(candidate.url);
          state.ownedPlayer.attachMedia(elements.video);
        }

        const startedAt = performance.now();
        try {
          await awaitWithTimeout(
            elements.video.play(),
            core.getStartupTimeoutMs(run),
            '等待首帧超时');
          if (!isActive(run)) {
            return;
          }

          markPlaybackStarted(run, candidate, startedAt);
        } catch (error) {
          if (!isActive(run)) {
            return;
          }

          /*
            自动播放策略拦截不是线路问题：这时候切候选只会把可用线路白白烧完，
            所以停在原地等用户点一下画面（点击处理器会接着播放）。
          */
          if (core.isAutoplayBlocked(error)) {
            state.autoplayBlocked = true;
            state.autoplayStartedAt = startedAt;
            appendLog('warn', '自动播放被策略拦截，等待用户点击画面');
            report(outbound.WARNING, core.AUTOPLAY_BLOCKED_HINT, run, candidate, { errorName: error.name });
            setHint(core.AUTOPLAY_BLOCKED_HINT, 'warn');
            return;
          }

          report(outbound.WARNING, '首帧等待失败：' + (error && error.message), run, candidate, {
            errorName: error && error.name,
            errorMessage: error && error.message,
          });

          if (!run.playbackStarted) {
            switchToNextCandidate(run, candidate, '首帧超时或失败');
          } else {
            recoverAfterInterruption(run, candidate, '播放启动异常');
          }
        }
      }

      /** 首帧就绪：统一处理状态、界面、日志与上报。 */
      function markPlaybackStarted(run, candidate, startedAt) {
        run.playbackStarted = true;
        run.everPlayed = true;
        state.autoplayBlocked = false;
        run.lastPlaybackPosition = elements.video.currentTime;
        run.lastPlaybackProgressAt = Date.now();
        run.currentCandidateStartedAt = Date.now();
        const firstFrameMs = Math.round(performance.now() - startedAt);
        elements.hint.classList.add('hidden');
        updateModeHint();
        setStatus(core.formatPlaybackStatusText(run));
        appendLog('ok', '首帧 ' + firstFrameMs + ' ms（' + candidate.host + '）');
        report(outbound.STATUS, '播放已开始', run, candidate, { firstFrameMs: firstFrameMs, mode: run.mode });
        startTelemetry(run);
      }

      /** 用户点击画面后接着播放被自动播放策略拦住的流。 */
      function resumeBlockedPlayback() {
        const run = state.run;
        const candidate = run ? run.currentCandidate : null;
        if (!isActive(run) || !candidate) {
          state.autoplayBlocked = false;
          return;
        }

        const startedAt = state.autoplayStartedAt || performance.now();
        state.autoplayBlocked = false;
        elements.video.play().then(function onStarted() {
          if (!isActive(run)) {
            return;
          }

          markPlaybackStarted(run, candidate, startedAt);
        }).catch(function onFailed(error) {
          appendLog('error', '点击后仍无法播放：' + (error && error.message ? error.message : error));
          setHintLocked('仍无法开始播放，请回主界面重新点「开始播放」。', 'warn', 8000);
        });
      }

      /** 绑定播放器事件。 */
      function attachPlayerEvents(run, candidate, player, isFlv) {
        if (isFlv) {
          player.on(window.mpegts.Events.ERROR, function onMpegtsError(errorType, errorDetail, errorInfo) {
            if (!isActive(run)) {
              return;
            }

            const description = (errorInfo && (errorInfo.msg || errorInfo.reason || errorInfo.description)) || '';
            if (core.isHttpStatusInvalid(errorType, errorDetail, window.mpegts)) {
              switchToNextCandidate(run, candidate, '返回 HTTP 状态错误');
              return;
            }

            if (core.isMseError(errorDetail, window.mpegts) && core.isHevcUnsupportedDescription(description)) {
              handleHevcUnsupported(run, candidate, description);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, '播放器错误：' + description);
            } else {
              switchToNextCandidate(run, candidate, '播放器错误：' + description);
            }
          });

          player.on(window.mpegts.Events.LOADING_COMPLETE, function onLoadingComplete() {
            if (!isActive(run)) {
              return;
            }

            recoverAfterInterruption(run, candidate, '直播连接已结束');
          });
          return;
        }

        if (window.Hls && !isFlv) {
          player.on(window.Hls.Events.ERROR, function onHlsError(eventName, data) {
            if (!isActive(run) || !data) {
              return;
            }

            if (!data.fatal) {
              return;
            }

            const detail = String(data.details || data.type || 'HLS 错误');
            if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
              handleHevcUnsupported(run, candidate, detail);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, 'HLS 错误：' + detail);
            } else {
              switchToNextCandidate(run, candidate, 'HLS 错误：' + detail);
            }
          });
        }
      }

      /** HEVC 无法解码时的终止处理：明确提示并建议使用 mpv。 */
      function handleHevcUnsupported(run, candidate, description) {
        const message = hevcMseSupported
          ? '该直播流实际为 HEVC 编码，但系统拒绝了对应的 MSE 解码器；请点击「mpv 播放」。'
          : '该直播流实际为 HEVC（H.265）编码，当前系统不支持 HEVC 解码，请点击「mpv 播放」。';
        report(outbound.ERROR, message, run, candidate, { errorMessage: description });
        stopRun(run);
        destroyPlayer();
        state.currentStreamUrl = '';
        updateModeHint();
        setHintLocked(message, 'error', 20000);
      }

      /** 切换到下一个候选。 */
      function switchToNextCandidate(run, candidate, reason) {
        if (!isActive(run) || run.switching) {
          return;
        }

        run.switching = true;
        run.playbackStarted = false;
        report(outbound.WARNING, '切换线路：' + reason, run, candidate);
        appendLog('warn', '切换线路：' + reason);
        destroyPlayer();

        run.queue.shift();
        if (run.queue.length === 0) {
          requestFreshSources(run, '所有候选线路均不可用');
          return;
        }

        const next = run.queue[0];
        run.switching = false;
        void startCandidate(run, next);
      }

      /** 断流后的重连（每个候选最多两次）。 */
      function recoverAfterInterruption(run, candidate, reason) {
        if (!isActive(run) || run.recovering || run.switching) {
          return;
        }

        const now = Date.now();
        if (run.currentCandidateStartedAt > 0 && now - run.currentCandidateStartedAt >= core.RECONNECT_COUNTER_RESET_MS) {
          run.reconnectsBySource.set(candidate.sourceIndex, 0);
        }

        const reconnectCount = run.reconnectsBySource.get(candidate.sourceIndex) || 0;
        const delay = core.getReconnectDelayMs(reconnectCount);
        if (delay < 0) {
          run.switching = true;
          report(outbound.WARNING, '当前线路重连未恢复，切换线路', run, candidate, { reconnectCount: reconnectCount });
          appendLog('warn', '当前线路重连 ' + reconnectCount + ' 次未恢复，切换线路');
          run.switching = false;
          switchToNextCandidate(run, candidate, reason);
          return;
        }

        run.reconnecting = true;
        run.reconnectsBySource.set(candidate.sourceIndex, reconnectCount + 1);
        report(outbound.RECONNECTING, '重连中（第 ' + (reconnectCount + 1) + ' 次）：' + reason, run, candidate, {
          reconnectCount: reconnectCount + 1,
        });
        setStatus('重连中（第 ' + (reconnectCount + 1) + ' 次）…');

        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
        }

        run.recoveryTimer = window.setTimeout(function reconnectNow() {
          run.recoveryTimer = null;
          if (!isActive(run)) {
            return;
          }

          run.reconnecting = false;
          run.switching = false;
          run.playbackStarted = false;
          run.lastPlaybackPosition = 0;
          run.lastPlaybackProgressAt = Date.now();
          void startCandidate(run, candidate);
        }, delay);
      }

      /** 请求宿主重新解析（每个会话只请求一次）。 */
      function requestFreshSources(run, reason) {
        if (!isActive(run) || run.refreshRequested) {
          return;
        }

        run.refreshRequested = true;
        destroyPlayer();
        state.currentStreamUrl = '';
        updateModeHint();
        setHintLocked('播放失败：所有线路都连不上（可能未开播、地区受限或网络问题）。\n正在请主程序重新解析…\n' + reason, 'error', 10000);
        report(outbound.REFRESH_NEEDED, reason, run, run.currentCandidate);
      }

      /** 启动遥测与卡顿检测。 */
      function startTelemetry(run) {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
        }

        state.telemetryTimer = window.setInterval(function onTick() {
          if (!isActive(run)) {
            return;
          }

          const video = elements.video;
          if (core.hasProgressed(video.currentTime, run.lastPlaybackPosition)) {
            run.lastPlaybackPosition = video.currentTime;
            run.lastPlaybackProgressAt = Date.now();
          }

          const silenceMs = Date.now() - run.lastPlaybackProgressAt;
          const localBuffer = core.getLocalBufferSeconds(video.buffered, video.currentTime);
          const starved = core.looksStarved(video, localBuffer);
          const threshold = core.getStallThresholdMs(run.extreme, starved);

          if (run.playbackStarted && !run.switching && !run.reconnecting && silenceMs >= threshold) {
            recoverAfterInterruption(run, run.currentCandidate, '画面进度超过 ' + Math.round(silenceMs / 1000) + ' 秒未前进');
            return;
          }

          const now = Date.now();
          if (now - run.lastTelemetryReportedAt >= core.TELEMETRY_REPORT_INTERVAL_MS) {
            run.lastTelemetryReportedAt = now;
            let quality = null;
            if (typeof video.getVideoPlaybackQuality === 'function') {
              quality = video.getVideoPlaybackQuality();
            }

            report(outbound.TELEMETRY, '遥测', run, run.currentCandidate, {
              currentTime: video.currentTime,
              bufferedAheadMs: localBuffer === null ? null : Math.round(localBuffer * 1000),
              readyState: video.readyState,
              networkState: video.networkState,
              paused: video.paused,
              ended: video.ended,
              playbackRate: video.playbackRate,
              secondsSinceProgress: Math.round(silenceMs / 1000),
              droppedVideoFrames: quality ? quality.droppedVideoFrames : null,
              totalVideoFrames: quality ? quality.totalVideoFrames : null,
              mode: run.mode,
            });
          }
        }, core.TELEMETRY_INTERVAL_MS);
      }

      /** 立刻跳到直播最新位置。 */
      function chaseToLiveEdge(keepSeconds) {
        const video = elements.video;
        const ranges = video.buffered;
        if (!ranges || ranges.length === 0) {
          return false;
        }

        const last = ranges.length - 1;
        const target = core.computeChaseTargetSeconds(ranges.start(last), ranges.end(last), keepSeconds);
        if (Number.isFinite(target) && Math.abs(video.currentTime - target) > 0.01) {
          video.currentTime = target;
        }

        return true;
      }

      /** 停止一个播放会话。 */
      function stopRun(run) {
        if (!run) {
          return;
        }

        run.stopped = true;
        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
          run.recoveryTimer = null;
        }

        destroyPlayer();
      }

      /** 处理宿主下发的 play 消息。 */
      async function handlePlay(payload) {
        if (state.run) {
          // 切换画质/重新解析时先给一句话，避免旧画面销毁后出现纯黑屏。
          setHint('正在切换到新线路…', 'info');
          stopRun(state.run);
          state.run = null;
        }

        state.refreshRequested = false;
        const normalized = core.buildPlaybackPlan(
          payload,
          canPlayFlv(),
          canPlayHls(),
          hevcMseSupported);

        const plan = normalized.plan;
        if (!plan || plan.candidates.length === 0) {
          const message = normalized.unsupportedCount > 0
            ? '候选线路均无法在本页播放（编码或格式不受支持），请点击「mpv 播放」。'
            : '没有可用的候选线路。';
          setHintLocked(message, 'error', 20000);
          report(outbound.ERROR, message, null, null, { unsupportedCount: normalized.unsupportedCount });
          return;
        }

        const run = {
          sessionId: plan.sessionId,
          mode: plan.mode,
          extreme: plan.extreme,
          extremeTargetMs: plan.extremeTargetMs,
          extremeTargetSeconds: plan.extremeTargetSeconds,
          candidates: plan.candidates,
          queue: [],
          attempted: new Set(),
          stopped: false,
          switching: false,
          recovering: false,
          reconnecting: false,
          playbackStarted: false,
          everPlayed: false,
          refreshRequested: false,
          currentCandidate: null,
          currentCandidateStartedAt: 0,
          reconnectCount: 0,
          reconnectsBySource: new Map(),
          recoveryTimer: null,
          lastPlaybackPosition: 0,
          lastPlaybackProgressAt: Date.now(),
          lastTelemetryReportedAt: 0,
        };

        state.roomTitle = typeof payload.title === 'string' ? payload.title : '';

        state.run = run;
        setStatus('正在探测候选线路…');
        appendLog('info', '开始播放会话 #' + run.sessionId + '（' + core.modeLabel(run) + '）');

        const queue = await buildCandidateQueue(run);
        if (!isActive(run)) {
          return;
        }

        run.queue = queue;
        if (queue.length === 0) {
          const message = normalized.unsupportedCount > 0
            ? '所有候选线路都不被本页支持，请点击「mpv 播放」。'
            : '所有候选线路都拒绝了内置播放器的请求，请点击「mpv 播放」或稍后重试。';
          setHintLocked(message, 'error', 10000);
          report(outbound.ERROR, message, run, null, { mode: run.mode });
          return;
        }

        await startCandidate(run, queue[0]);
      }

      /** 处理宿主下发的 chase 消息。 */
      function handleChase(payload) {
        const keep = payload && payload.keepSeconds;
        if (chaseToLiveEdge(keep)) {
          appendLog('info', '已追帧到直播最新位置');
        } else {
          appendLog('warn', '追帧失败：缓冲区为空');
        }
      }

      /** 处理宿主下发的 stop 消息。 */
      function handleStop() {
        if (state.run) {
          report(outbound.STATUS, '播放已停止', state.run, state.run.currentCandidate);
          stopRun(state.run);
          state.run = null;
        }

        destroyPlayer();
        state.currentStreamUrl = '';
        state.autoplayBlocked = false;
        state.autoplayStartedAt = 0;
        updateModeHint();
        showEmptyState();
        setStatus('未连接');
      }

      /** 更新音量：界面与视频元素用同一份夹取后的百分比。 */
      function applyVolume(value, remember) {
        const percent = core.clampVolumePercent(value);
        elements.video.volume = core.volumePercentToGain(percent);
        elements.video.muted = core.shouldMuteAtVolume(percent);
        elements.volume.value = String(percent);
        elements.volumeLabel.textContent = percent + '%';
        elements.volDisplay.textContent = '音量：' + percent + '%';
        elements.volDisplay.classList.remove('hidden');
        window.setTimeout(function hideVolume() {
          elements.volDisplay.classList.add('hidden');
        }, 1500);
        if (remember && percent > 0) {
          state.lastVolume = percent;
        }

        if (percent > 0) {
          state.muteToggleVolume = percent;
        }
      }

      /** 绑定控件事件。 */
      function bindControls() {
        elements.volume.addEventListener('input', function onVolumeInput() {
          applyVolume(elements.volume.value, true);
        });

        elements.video.addEventListener('wheel', function onWheel(event) {
          event.preventDefault();
          applyVolume(elements.video.volume * 100 + (event.deltaY < 0 ? 10 : -10), true);
        }, { passive: false });

        elements.video.addEventListener('click', function onVideoClick() {
          // 被自动播放策略拦住时，点画面是"开始播放"；否则沿用点画面切换静音。
          if (state.autoplayBlocked) {
            resumeBlockedPlayback();
            return;
          }

          const next = elements.video.muted ? state.lastVolume : 0;
          applyVolume(next, false);
        });

        /*
          全屏：只用 #stage 作为全屏元素（video 填满 stage），并显式处理 Promise 失败，
          避免"点了没反应"却没有任何反馈。
        */
        function requestStageFullscreen() {
          const target = elements.stage;
          if (!target || typeof target.requestFullscreen !== 'function') {
            setHintLocked('当前内核不支持全屏 API，可用主界面的窗口最大化代替。', 'warn', 6000);
            return;
          }

          const request = target.requestFullscreen();
          if (request && typeof request.then === 'function') {
            request.then(function onEntered() {
              appendLog('info', '已进入全屏');
            }).catch(function onFailed(error) {
              appendLog('error', '进入全屏失败：' + (error && error.message ? error.message : error));
              setHintLocked('进入全屏失败，可尝试双击画面或按 F11。', 'warn', 6000);
            });
          }
        }

        function exitStageFullscreen() {
          const request = document.exitFullscreen();
          if (request && typeof request.then === 'function') {
            request.catch(function onFailed(error) {
              appendLog('error', '退出全屏失败：' + (error && error.message ? error.message : error));
            });
          }
        }

        function toggleFullscreen() {
          if (document.fullscreenElement) {
            exitStageFullscreen();
          } else {
            requestStageFullscreen();
          }
        }

        elements.fsBtn.addEventListener('click', toggleFullscreen);
        elements.video.addEventListener('dblclick', toggleFullscreen);

        document.addEventListener('fullscreenchange', function onFullscreenChange() {
          const fullscreen = Boolean(document.fullscreenElement);
          updateModeHint();
          /*
            提示的可见性只由"是否已经在播"决定：过去这里在退出全屏时无条件取消隐藏，
            于是被藏起来的空态文案（等待直播源）又盖回画面，看起来像直播源丢了。
          */
          elements.hint.classList.toggle('hidden', core.shouldHideHint(state.run));
          elements.volDisplay.classList.add('hidden');
          document.body.style.cursor = fullscreen ? 'none' : 'default';
          elements.fsBtn.textContent = fullscreen ? '退出全屏' : '全屏';

          /*
            关键：把全屏状态告诉宿主。WebView2 只有在宿主把对应元素标记为全屏元素
            （CoreWebView2.ContainsFullScreenElement）后才会真正铺满窗口，
            否则"点了全屏但画面尺寸不变"，看起来就是全屏失败。
          */
          report(fullscreen ? outbound.FULLSCREEN_ENTER : outbound.FULLSCREEN_EXIT, fullscreen ? '进入全屏' : '退出全屏');
        });

        document.addEventListener('keydown', function onKeyDown(event) {
          if (event.key === 'F11' || (event.key === 'Enter' && event.altKey)) {
            event.preventDefault();
            toggleFullscreen();
          }
        });

        elements.toggleLog.addEventListener('click', function onToggleLog() {
          const hidden = elements.log.classList.toggle('hidden');
          elements.toggleLog.textContent = hidden ? '显示日志' : '隐藏日志';
        });

        elements.qualitySelect.addEventListener('change', function onQualityChange() {
          const key = elements.qualitySelect.value;
          if (!key || key === state.qualityKey) {
            return;
          }

          state.qualityKey = key;
          report(outbound.QUALITY, '切换画质：' + (elements.qualitySelect.selectedOptions[0]?.textContent || key), state.run, state.run?.currentCandidate, { key: key });
        });
      }

      /**
       * 渲染画质下拉：平台只给一档时隐藏整个控件。
       * @param {object} payload 宿主下发的 play 消息。
       */
      function renderQualities(payload) {
        const normalized = core.normalizeQualities(payload?.qualities, payload?.selectedQualityKey);
        state.qualityKey = normalized.selectedKey;
        elements.qualitySelect.replaceChildren();
        for (const item of normalized.items) {
          const option = document.createElement('option');
          option.value = item.key;
          option.textContent = item.label;
          option.selected = item.selected;
          elements.qualitySelect.appendChild(option);
        }

        const multiple = normalized.items.length > 1;
        elements.qualityBox.classList.toggle('hidden', !multiple);
        elements.qualitySelect.disabled = !multiple;
      }

      /** 追帧档位热切换：不重连，只改当前运行对象的追帧目标并立即追帧。 */
      function handleTargetChange(payload) {
        const changed = core.applyExtremeTarget(state.run, payload.extremeTargetMs);
        updateModeHint();
        if (!changed || !state.run) {
          return;
        }

        // 目标延迟变小了：立刻向缓冲末端追一次（保留 0.08 秒），让新档位马上生效。
        if (chaseToLiveEdge(0.08)) {
          report(outbound.STATUS, '追帧档位已切换为 ' + state.run.extremeTargetMs + ' ms', state.run, state.run.currentCandidate);
        }
      }

      /** 处理来自宿主的消息。 */
      function handleHostMessage(payload) {
        if (!payload || typeof payload !== 'object') {
          return;
        }

        switch (payload.type) {
          case core.INBOUND_MESSAGE_TYPES.PLAY:
            renderQualities(payload);
            void handlePlay(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.CHASE:
            handleChase(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.STOP:
            handleStop();
            break;
          case core.INBOUND_MESSAGE_TYPES.TARGET:
            handleTargetChange(payload);
            break;
          default:
            if (payload.type === 'volume') {
              applyVolume(payload.value, true);
            } else if (payload.type === 'bridge-info') {
              state.bridgeBaseAddress = typeof payload.baseAddress === 'string' ? payload.baseAddress : '';
              appendLog('info', '桥接服务地址：' + (state.bridgeBaseAddress || '未启动'));
            } else {
              appendLog('warn', '收到未知消息类型：' + payload.type);
            }

            break;
        }
      }

      bindControls();
      applyVolume(core.INITIAL_VOLUME_PERCENT, true);
      showEmptyState();
      updateModeHint();

      if (hostChannel) {
        hostChannel.onMessage(handleHostMessage);
      } else {
        setHint('当前不在 StreamPilot 主程序内运行：可直接用 mpv 播放解析出的地址。', 'warn');
        appendLog('warn', '未检测到 WebView2 宿主通道，控件仍可用于本地调试。');
      }

      report(outbound.READY, 'StreamPilot 播放器已加载。', null, null, {
        hevc: hevcMseSupported,
        avc: avcMseSupported,
      });
    }());
  </script>
</body>

</html>
