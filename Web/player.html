<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamPilot 播放器</title>
  <!--
    StreamPilot 自研播放页。
    第三方库（Apache-2.0，随包分发，见 THIRD-PARTY-NOTICES.md）：
      mpegts.js 1.8.2  HTTP-FLV / MSE 低延迟播放
      hls.js 1.6.16    HLS 播放
    纯逻辑实现位于 player-core.js（同一份代码也被 node --test 覆盖）。
  -->
  <script src="./mpegts.js"></script>
  <script src="./hls.js"></script>
  <style>
    /*
      配色策略（修复"白底白字"）：
      1. html 上先给出无条件的浅色兜底（不依赖 CSS 变量），避免 :root 变量未生效时出现底色异常；
      2. color-scheme: light 让滚动条、range 等"原生控件"也走浅色，不受系统深色主题影响；
      3. 每个元素都显式声明 color/background/border，不依赖从 body 继承，杜绝"底色与文字同色"的不可读组合；
      4. 强制配色模式（Windows 高对比度）下本页面依旧保持浅色，避免系统强制色造成不可读。
    */
    html {
      background: #f5f6f8;
      color: #1f2329;
      color-scheme: light;
    }

    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e5ea;
      --border-strong: #c7cdd6;
      --text: #1f2329;
      --text-strong: #ffffff;
      --muted: #6b7280;
      --control: #ffffff;
      --control-active: #e8f1ff;
      --accent: #2f6feb;
      --warn: #b45309;
      --error: #c0392b;
      --ok: #1f8a4c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #f5f6f8;
      color: #1f2329;
      font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* 强制配色模式下保持既定深色，避免出现"系统白底 + 本页浅色文字"的不可读组合 */
    @media (forced-colors: active) {
      html,
      body,
      footer,
      #stage,
      #controls,
      #statusLine,
      #hint,
      #volDisplay {
        forced-color-adjust: none;
        background: #f5f6f8;
        color: #1f2329;
      }

      button,
      select,
      input[type="range"] {
        forced-color-adjust: none;
        background: #ffffff;
        color: #1f2329;
        border: 1px solid #c7cdd6;
      }
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    button,
    input[type="range"] {
      font: inherit;
      color: #1f2329;
      background-color: #ffffff;
      border: 1px solid #e2e5ea;
      border-radius: 6px;
      padding: 4px 8px;
      -webkit-appearance: none;
      appearance: none;
    }

    /* range 滑块：加大对比度，避免在某些主题下"看不见" */
    input[type="range"] {
      padding: 0;
      height: 20px;
      width: 140px;
      background: transparent;
      border: none;
      accent-color: #2f6feb;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #c7cdd6;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border-radius: 50%;
      background: #2f6feb;
      border: 1px solid #f5f6f8;
    }

    button {
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: #2f6feb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    button.active {
      border-color: #2f6feb;
      background-color: #e8f1ff;
    }

    .spacer {
      flex: 1 1 auto;
    }

    /*
      画质、追帧档位与播放控制都放在画面下方的 footer：
      贴着画面的按钮比页头更容易点到，也避免页头在窄窗口里挤成一团。
    */
    #qualityBox,
    #targetBox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    #qualityBox .qualityLabel,
    #targetBox .qualityLabel {
      color: #5b6472;
      font-size: 15px;
    }

    #qualitySelect,
    #targetSelect {
      cursor: pointer;
      border-radius: 8px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #c7cdd6;
      background: #ffffff;
      color: #1f2329;
      font-family: inherit;
      font-size: 15px;
      max-width: 220px;
    }

    #qualitySelect:hover,
    #targetSelect:hover {
      border-color: #1b4fd8;
    }

    /*
      播放控制三键比其余控件小一号：它们是高频点击项，但画面下方的横向空间有限，
      缩小后（并排的）开始 / 暂停 / 停止 不会把这一行挤成两排。
    */
    #playBtn,
    #pauseBtn,
    #stopBtn {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 6px;
    }

    #stopBtn {
      /* 停止会关闭画面，用危险色与"暂停"区分开 */
      color: #c0392b;
    }

    #fsBtn {
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 8px;
      /* 换行到第二行时也靠右，和上一行的控件分开 */
      margin-left: auto;
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      /* 空画面用极浅的竖向渐变，比一整块灰底更耐看；有画面后由视频内容覆盖 */
      background: linear-gradient(180deg, #fbfcfd 0%, #e8ecf2 100%);
      min-height: 0;
    }

    video {
      width: 100%;
      height: 100%;
      background-color: transparent;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    #hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e4e8ee;
      box-shadow: 0 10px 26px rgba(31, 35, 41, 0.07);
      color: #1f2329;
      text-align: center;
      white-space: pre-wrap;
      pointer-events: none;
    }

    /* 空态：图标 + 标题 + 一句操作提示，代替原来只有一行字的白条 */
    #hint.empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 16px;
      font-weight: 600;
      padding: 30px 44px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(31, 35, 41, 0.1);
    }

    #hint.empty::before {
      content: '▶';
      display: block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      padding-left: 4px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: #eaf1fe;
      color: #1b4fd8;
      font-size: 18px;
      box-sizing: border-box;
    }

    /* 空态副文案由脚本写入 data-action（文案本体在 player-core.js，与测试同源） */
    #hint.empty::after {
      content: attr(data-action);
      font-size: 13px;
      font-weight: 400;
      color: #5b6472;
    }

    #hint[data-level="warn"] {
      border-color: #b45309;
    }

    #hint[data-level="error"] {
      border-color: #c0392b;
    }

    #hint.hidden,
    #volDisplay.hidden,
    footer.hidden {
      display: none;
    }

    #volDisplay {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 2;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e5ea;
      color: #1f2329;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #e2e5ea;
      background: #ffffff;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      row-gap: 8px;
      padding: 8px 10px;
      /* 窄窗口时换行而不是把控件压扁 */
      flex-wrap: wrap;
      color: #1f2329;
    }

    .controlLabel {
      color: #6b7280;
    }

    /* 状态行用主题强调色（WPF 侧 AccentBrush = #2f6feb），不再是灰字：状态要一眼能看见 */
    #statusLine {
      padding: 0 10px 6px;
      color: #2f6feb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 宿主状态按级别换色：警告 / 错误要与"一切正常"的蓝色区分开（与 #hint 用同一组颜色） */
    #statusLine[data-level="warn"] {
      color: #b45309;
    }

    #statusLine[data-level="error"] {
      color: #c0392b;
    }

    #volumeLabel {
      color: #6b7280;
      min-width: 46px;
      text-align: right;
    }
  </style>
</head>

<body>
  <div id="root">
    <!--
      播放页集中承载观看与播放控制：开始播放、暂停/继续、停止播放、追帧、追帧档位、画质、全屏、音量。
      页面顶部不再有状态行：状态只在画面下方的 #statusLine 里说一次，避免同一句话出现两处。
      #statusLine 同时是宿主状态文字的显示位（host-status 消息）：
      宿主消息优先、按级别换色并保留若干秒，之后回落显示页面自己的播放状态。
    -->
    <div id="stage">
      <!--
        与参考播放页一致默认静音：首帧到达前 video 仍会输出已缓冲的音频，
        不静音时用户会先听到一小段"试音"再被 applyVolume 设成 30%。
        音量滑块与点击画面都能立刻打开声音，行为不受影响。
      -->
      <video id="video" playsinline muted></video>
      <div id="hint" class="empty" data-level="info">等待直播源</div>
      <div id="volDisplay" class="hidden">音量：30%</div>
    </div>

    <footer>
      <div id="controls">
        <span class="controlLabel">音量</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="30" />
        <span id="volumeLabel">30%</span>
        <span class="spacer"></span>
        <button type="button" id="chaseBtn" title="开启自动追帧并立刻追一次帧（跳到直播最新位置）">追帧</button>
        <label id="targetBox" for="targetSelect">
          <span class="qualityLabel">追帧档位</span>
          <select id="targetSelect"></select>
        </label>
        <button type="button" id="playBtn" title="播放左侧已解析的直播间">开始播放</button>
        <button type="button" id="pauseBtn">暂停播放</button>
        <button type="button" id="stopBtn" title="结束播放会话并关闭画面（与「暂停」不同）">停止播放</button>
        <label id="qualityBox" for="qualitySelect">
          <span class="qualityLabel">画质</span>
          <select id="qualitySelect"></select>
        </label>
        <button type="button" id="fsBtn" title="全屏（双击画面同样可切换）">全屏</button>
      </div>
      <div id="statusLine">未连接</div>
    </footer>
  </div>

  <script src="./player-core.js"></script>
  <script>
    'use strict';

    (function main() {
      const core = window.StreamPilotPlayerCore;
      const outbound = core.OUTBOUND_MESSAGE_TYPES;

      /** HTTP 错误状态码区间：4xx/5xx 视为"线路明确拒绝"，直接丢弃不再尝试。 */
      const HTTP_ERROR_STATUS_MIN = 400;
      const HTTP_ERROR_STATUS_MAX = 600;

      /** 宿主状态消息到期后回落刷新的定时余量（毫秒）：略晚于到期点，避免边界上重复刷新。 */
      const STATUS_FALLBACK_MARGIN_MS = 50;

      /** 宿主消息通道：WebView2 的 chrome.webview。外部浏览器打开时为空。 */
      const hostChannel = (function createHostChannel() {
        if (window.chrome && window.chrome.webview) {
          return {
            post: function post(payload) {
              window.chrome.webview.postMessage(payload);
            },
            onMessage: function onMessage(handler) {
              window.chrome.webview.addEventListener('message', function onWebMessage(event) {
                handler(event.data);
              });
            },
          };
        }

        return null;
      }());

      const elements = {
        video: document.getElementById('video'),
        hint: document.getElementById('hint'),
        status: document.getElementById('statusLine'),
        volume: document.getElementById('volume'),
        volumeLabel: document.getElementById('volumeLabel'),
        volDisplay: document.getElementById('volDisplay'),
        fsBtn: document.getElementById('fsBtn'),
        qualityBox: document.getElementById('qualityBox'),
        qualitySelect: document.getElementById('qualitySelect'),
        targetBox: document.getElementById('targetBox'),
        targetSelect: document.getElementById('targetSelect'),
        playBtn: document.getElementById('playBtn'),
        pauseBtn: document.getElementById('pauseBtn'),
        stopBtn: document.getElementById('stopBtn'),
        chaseBtn: document.getElementById('chaseBtn'),
        stage: document.getElementById('stage'),
      };

      /** 页面状态。 */
      const state = {
        run: null,
        ownedPlayer: null,
        currentStreamUrl: '',
        currentReferer: '',
        bridgeBaseAddress: '',
        roomTitle: '',
        lastVolume: core.INITIAL_VOLUME_PERCENT,
        muteToggleVolume: core.INITIAL_VOLUME_PERCENT,
        // 自动播放被策略拦截时置位：此时点画面是"接着播"，而不是切换静音。
        autoplayBlocked: false,
        autoplayStartedAt: 0,
        hintLockUntil: 0,
        /** 最近的宿主状态消息（{message, level, receivedAt}）；画面下方状态行的最高优先级来源。 */
        hostStatus: null,
        /** 页面自己的播放状态文案：宿主消息过期后回落到它。 */
        playbackText: core.STATUS_IDLE_TEXT,
        /** "宿主状态消息到期 → 回落播放状态"的定时器句柄。 */
        statusFallbackTimer: null,
        eventSequence: 0,
        telemetryTimer: null,
        refreshRequested: false,
        capabilities: { hevc: false, avc: false },
        qualityKey: '',
        targetMs: core.DEFAULT_EXTREME_TARGET_MS,
        // 用户暂停不销毁播放器：保留会话与地址，继续播放时从当前位置恢复。
        pausedByUser: false,
        pausedAtSeconds: 0,
        // 刚恢复播放的时间戳：这段时间内的静止属于重建缓冲，不判卡顿。
        resumedAt: 0,
      };

      const hevcMseSupported = Boolean(window.MediaSource)
        && (MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L120.90"')
          || MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L120.90"'));
      const avcMseSupported = Boolean(window.MediaSource)
        && MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
        && MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"');
      state.capabilities.hevc = hevcMseSupported;
      state.capabilities.avc = avcMseSupported;

      /** 判断候选能否在本页播放。 */
      function canPlayFlv() {
        return Boolean(window.mpegts && window.mpegts.isSupported());
      }

      function canPlayHls() {
        return Boolean(window.Hls && window.Hls.isSupported());
      }

      /** 向宿主上报事件。 */
      function report(type, message, run, candidate, extras) {
        state.eventSequence += 1;
        const payload = {
          type: type,
          message: String(message || ''),
          eventSequence: state.eventSequence,
          pageElapsedMs: Math.round(performance.now()),
        };

        if (run && Number.isSafeInteger(run.sessionId)) {
          payload.sessionId = run.sessionId;
        }

        if (candidate && Number.isInteger(candidate.sourceIndex)) {
          payload.sourceIndex = candidate.sourceIndex;
        }

        if (candidate && typeof candidate.urlFingerprint === 'string') {
          payload.urlFingerprint = candidate.urlFingerprint;
        }

        if (extras) {
          Object.assign(payload, extras);
        }

        if (hostChannel) {
          hostChannel.post(payload);
        }
      }

      /**
       * 页面诊断日志：只上报给宿主，页面不再显示日志面板。
       *
       * 页面上的日志面板既占画面又需要用户手动展开，排查问题还是得看宿主日志；
       * 因此这里统一走 `log` 消息（级别 info/warn/error 原样带给宿主），
       * 由宿主决定落盘级别与界面展示，页面侧不留任何输出通道。
       * @param {string} level 日志级别（core.LOG_LEVELS）。
       * @param {string} text 日志文本。
       */
      function logToHost(level, text) {
        report(outbound.LOG, text, state.run, state.run ? state.run.currentCandidate : null, {
          level: level,
        });
      }

      /** 设置居中提示。 */
      function setHint(message, level) {
        elements.hint.textContent = message;
        elements.hint.dataset.level = level || 'info';
        elements.hint.classList.remove('empty');
        elements.hint.classList.remove('hidden');
      }

      /**
       * 回到空态提示。文案取 player-core 的常量，
       * 避免"页面写一套、测试测另一套"。
       */
      function showEmptyState() {
        elements.hint.textContent = core.EMPTY_HINT_TITLE;
        elements.hint.dataset.action = core.EMPTY_HINT_ACTION;
        elements.hint.dataset.level = 'info';
        elements.hint.classList.remove('hidden');
        elements.hint.classList.add('empty');
      }

      /** 设置提示并锁定指定时长（毫秒）。 */
      function setHintLocked(message, level, lockMs) {
        setHint(message, level);
        state.hintLockUntil = Date.now() + (lockMs || 0);
      }

      /**
       * 刷新画面下方的状态行：宿主消息优先，过期后回落显示页面自己的播放状态。
       *
       * 显示判定全部交给纯函数 `core.resolveStatusLine`（被前端用例覆盖），
       * 这里只负责写 DOM 与安排回落定时器。
       */
      function renderStatusLine() {
        const resolved = core.resolveStatusLine(state.hostStatus, state.playbackText, Date.now());
        elements.status.textContent = resolved.text;
        elements.status.dataset.level = resolved.level;
        scheduleStatusFallback();
      }

      /** 安排一次"宿主状态消息到期 → 回落播放状态"的刷新。 */
      function scheduleStatusFallback() {
        if (state.statusFallbackTimer !== null) {
          window.clearTimeout(state.statusFallbackTimer);
          state.statusFallbackTimer = null;
        }

        const remaining = core.getHostStatusRemainingMs(state.hostStatus, Date.now());
        if (remaining <= 0) {
          return;
        }

        state.statusFallbackTimer = window.setTimeout(function onStatusFallback() {
          state.statusFallbackTimer = null;
          renderStatusLine();
        }, remaining + STATUS_FALLBACK_MARGIN_MS);
      }

      /**
       * 记录页面自己的播放状态文案（受提示锁保护）。
       *
       * 宿主消息仍在保留期内时它不会立刻显示——由 `renderStatusLine` 按优先级决定，
       * 这样宿主的失败原因不会被随后的"播放中"盖掉。
       * @param {string} message 状态文案。
       */
      function setStatus(message) {
        if (Date.now() < state.hintLockUntil) {
          return;
        }

        state.playbackText = message;
        renderStatusLine();
      }

      /**
       * 用最近一次遥测的**真实延迟**刷新状态行（显示形如"播放中 · … · 250 ms"）。
       *
       * 延迟与状态文案的拼接逻辑在纯函数 `core.formatPlaybackStatusText` / `core.formatStatusWithLatency` 里，
       * 页面只负责把实测值写进运行对象。取不到有效测量值时该分段整体不显示，不写占位数字。
       * @param {object} run 运行对象（带 lastLatencyMs / autoChaseEnabled）。
       */
      function refreshPlaybackStatus(run) {
        if (!run) {
          return;
        }

        setStatus(core.formatPlaybackStatusText(run));
      }

      /**
       * 显示宿主下发的状态文案。
       *
       * 左栏「当前直播」卡片删除后，宿主的状态文字（解析失败原因、操作反馈…）在窗口里
       * 已经没有显示位置，画面下方就是它唯一的显示位。
       * 这里刻意**不看提示锁**：宿主的失败/操作类消息比页面自己的状态更需要被看到，
       * 且与居中的提示说的是同一件事时读起来一致。
       * @param {object} payload `host-status` 消息（message 必填，level 可选）。
       */
      function applyHostStatus(payload) {
        const message = typeof payload.message === 'string' ? payload.message.trim() : '';
        if (message.length === 0) {
          return;
        }

        state.hostStatus = {
          message: message,
          level: core.normalizeStatusLevel(payload.level),
          receivedAt: Date.now(),
        };
        renderStatusLine();
      }

      /** 销毁当前播放器并释放资源。 */
      function destroyPlayer() {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
          state.telemetryTimer = null;
        }

        const player = state.ownedPlayer;
        state.ownedPlayer = null;
        if (!player) {
          return;
        }

        try {
          player.pause();
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '暂停播放器失败：' + error.message);
        }

        try {
          if (typeof player.unload === 'function') {
            player.unload();
          }

          if (typeof player.detachMediaElement === 'function') {
            player.detachMediaElement();
          }

          if (typeof player.destroy === 'function') {
            player.destroy();
          }
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '释放播放器失败：' + error.message);
        }

        try {
          elements.video.pause();
          elements.video.removeAttribute('src');
          elements.video.load();
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '重置视频元素失败：' + error.message);
        }

        elements.video.playbackRate = 1;
      }

      /** 带超时的 Promise 包装。 */
      function awaitWithTimeout(promise, timeoutMs, timeoutMessage, onTimeout) {
        let timer = null;
        const timeout = new Promise(function rejectAfterTimeout(resolve, reject) {
          timer = window.setTimeout(function onTimeoutElapsed() {
            const error = new Error(timeoutMessage);
            error.name = 'TimeoutError';
            if (typeof onTimeout === 'function') {
              onTimeout();
            }

            reject(error);
          }, timeoutMs);
        });

        return Promise.race([promise, timeout]).finally(function clearTimer() {
          if (timer !== null) {
            window.clearTimeout(timer);
          }
        });
      }

      /** 判断 run 是否仍然有效（防止过期会话污染当前状态）。 */
      function isActive(run) {
        return Boolean(run) && state.run === run && !run.stopped;
      }

      /**
       * 探测单个候选：只取到响应头就中止，绝不读取响应体。
       *
       * 与参考播放页（`probeCandidate`）逐条一致：GET、`cache:'no-store'`、`credentials:'omit'`、
       * 超时 1200 ms 且超时即 abort、拿到状态码立刻 abort。
       * "不读 body"是关键：读 body 等于把整条直播流拉下来，探测就变成一次真实下载。
       * @param {object} run 运行对象。
       * @param {object} candidate 候选。
       * @returns {Promise<{outcome:string,elapsedMs:number,statusCode:number|null,errorName:string|null,errorMessage:string|null}>} 探测结论。
       */
      async function probeCandidate(run, candidate) {
        const controller = new AbortController();
        run.controllers.add(controller);
        const startedAt = performance.now();
        const elapsed = function elapsedMs() {
          return Math.round(performance.now() - startedAt);
        };

        try {
          const response = await awaitWithTimeout(
            fetch(candidate.url, {
              method: 'GET',
              mode: 'cors',
              cache: 'no-store',
              credentials: 'omit',
              referrerPolicy: 'no-referrer-when-downgrade',
              signal: controller.signal,
            }),
            core.PROBE_TIMEOUT_MS,
            '候选探测超时',
            function onProbeTimeout() {
              controller.abort();
            });

          if (!isActive(run)) {
            return { outcome: 'stale', elapsedMs: elapsed(), statusCode: null, errorName: null, errorMessage: null };
          }

          const status = response.status;
          try {
            controller.abort();
          } catch (abortError) {
            logToHost(core.LOG_LEVELS.WARN, '探测结束后中止连接失败：' + (abortError && abortError.message));
          }

          if (response.ok) {
            return { outcome: 'good', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
          }

          if (status >= HTTP_ERROR_STATUS_MIN && status < HTTP_ERROR_STATUS_MAX) {
            return { outcome: 'rejected', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
          }

          return { outcome: 'inconclusive', elapsedMs: elapsed(), statusCode: status, errorName: null, errorMessage: null };
        } catch (error) {
          if (!isActive(run)) {
            return { outcome: 'stale', elapsedMs: elapsed(), statusCode: null, errorName: null, errorMessage: null };
          }

          return {
            outcome: 'inconclusive',
            elapsedMs: elapsed(),
            statusCode: null,
            errorName: error && error.name ? error.name : null,
            errorMessage: error && error.message ? error.message : null,
          };
        } finally {
          run.controllers.delete(controller);
        }
      }

      /** 探测结果是否可用（会话未过期）。 */
      function isUsableProbeResult(result) {
        return result.outcome !== 'stale';
      }

      /** 把探测结果转成队列项（只保留"分组 + 宿主原顺序"，不保留耗时：耗时只用于诊断上报）。 */
      function buildQueueEntry(candidate, position, result) {
        return {
          candidate: candidate,
          position: position,
          group: result.outcome === 'good' ? 0 : 1,
        };
      }

      /** 按"已知可用优先、其余按宿主原顺序"排序队列项。 */
      function compareQueueEntries(left, right) {
        if (left.group !== right.group) {
          return left.group - right.group;
        }

        return left.position - right.position;
      }

      /** 报告单个候选的探测结论。 */
      function reportProbeResult(run, candidate, result) {
        if (result.outcome === 'good') {
          report(outbound.PROBE_RESULT, '线路响应正常', run, candidate, {
            outcome: 'good',
            elapsedMs: result.elapsedMs,
          });
          return;
        }

        if (result.outcome === 'rejected') {
          report(outbound.PROBE_REJECTED, '线路返回 HTTP ' + result.statusCode, run, candidate, {
            outcome: 'rejected',
            statusCode: result.statusCode,
          });
          return;
        }

        report(outbound.PROBE_RESULT, '线路探测结果不确定', run, candidate, {
          outcome: 'inconclusive',
          elapsedMs: result.elapsedMs,
          errorName: result.errorName,
          errorMessage: result.errorMessage,
        });
      }

      /** 规整宿主给出的候选顺序（探测通过/不确定的候选）。 */
      function assembleQueue(run, entries) {
        entries.sort(compareQueueEntries);
        const queue = [];
        for (const entry of entries) {
          queue.push(entry.candidate);
        }

        const knownGoodCount = entries.filter(function isKnownGood(item) {
          return item.group === 0;
        }).length;
        report(outbound.CANDIDATE_QUEUE, '候选队列已就绪，共 ' + queue.length + ' 条', run, queue[0] || null, {
          sourceIndexes: queue.map(function sourceIndexOf(item) {
            return item.sourceIndex;
          }),
          knownGoodCount: knownGoodCount,
          inconclusiveCount: queue.length - knownGoodCount,
        });
        return queue;
      }

      /** 不探测时的直连模式：直接沿用宿主顺序（例如只有一条候选）。 */
      function buildDirectQueue(run, reason) {
        const queue = run.candidates.slice();
        logToHost(core.LOG_LEVELS.INFO, reason + '，按宿主给出的线路顺序直接连接（共 ' + queue.length + ' 条）');
        report(outbound.CANDIDATE_QUEUE, '线路顺序已就绪，共 ' + queue.length + ' 条', run, queue[0] || null, {
          sourceIndexes: queue.map(function index(item) {
            return item.sourceIndex;
          }),
          knownGoodCount: 0,
          inconclusiveCount: 0,
        });
        return queue;
      }

      /**
       * 生成候选队列。
       *
       * 探测恢复成参考播放页的做法（并行、拿到响应头即 abort、超时 1200 ms），但**不按耗时重排队**：
       * 延时数字量的是"页面→探测目标"这一段，走本地中继时它主要由回环与中继转发决定，与实际 CDN 质量无关，
       * 按它排序只会把宿主的平台优先级打乱（表现为"换了条更慢的线路"）。
       * 因此这里只把"已知响应正常"的候选提到前面，组内仍按宿主原顺序；4xx/5xx 的候选直接丢弃。
       * 是否探测由 core.shouldProbeCandidate 决定，原因见该函数的注释。
       * @param {object} run 运行对象。
       * @returns {Promise<Array<object>>} 待尝试的候选队列。
       */
      async function buildCandidateQueue(run) {
        if (!core.shouldProbeCandidate(run.candidates.length)) {
          return buildDirectQueue(run, '只有一个候选（探测零收益）');
        }

        report(outbound.CHECKING, '正在并行检查 ' + run.candidates.length + ' 条线路…', run);
        const results = await Promise.all(run.candidates.map(function probe(item) {
          return probeCandidate(run, item);
        }));
        if (!isActive(run)) {
          return [];
        }

        const entries = [];
        const rejected = [];
        for (let position = 0; position < run.candidates.length; position += 1) {
          const candidate = run.candidates[position];
          const result = results[position];
          if (!isUsableProbeResult(result)) {
            return [];
          }

          reportProbeResult(run, candidate, result);
          if (result.outcome === 'rejected') {
            rejected.push(candidate);
            continue;
          }

          entries.push(buildQueueEntry(candidate, position, result));
        }

        if (rejected.length > 0) {
          logToHost(core.LOG_LEVELS.WARN, '已跳过 ' + rejected.length + ' 条返回 HTTP 错误的线路');
        }

        if (entries.length === 0) {
          const message = '所有线路都拒绝了内置播放器的请求（可能未开播、地区受限或已被平台限流）。';
          setHintLocked(message, 'error', 10000);
          report(outbound.ERROR, message, run, null, { rejectedCount: rejected.length });
          return [];
        }

        return assembleQueue(run, entries);
      }

      /** 启动某个候选的播放。 */
      async function startCandidate(run, candidate) {
        if (!isActive(run)) {
          return;
        }

        run.currentCandidate = candidate;
        state.currentStreamUrl = candidate.url;
        state.currentReferer = candidate.referer || '';
        state.pausedByUser = false;
        updatePauseButton();
        report(outbound.CANDIDATE_ACTIVE, '正在连接 ' + candidate.host, run, candidate);

        destroyPlayer();
        if (!isActive(run)) {
          return;
        }

        state.autoplayBlocked = false;
        /*
          不预先静音：宿主已用 --autoplay-policy=no-user-gesture-required 打开内核的自动播放，
          首帧应当直接带声音起来；若内核策略仍拦截，playWithAutoplayFallback 会静音起播再恢复音量。
        */
        if ('preservesPitch' in elements.video) {
          elements.video.preservesPitch = true;
        }

        const isHls = core.isHlsCandidate(candidate);
        if (!isHls) {
          if (!canPlayFlv()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HTTP-FLV 播放');
            return;
          }

          state.ownedPlayer = window.mpegts.createPlayer(
            { type: 'flv', isLive: true, url: candidate.url, hasAudio: true, hasVideo: true },
            core.buildMpegtsConfig(run.extreme, run.extremeTargetSeconds, core.shouldAutoChase(run)));
          attachPlayerEvents(run, candidate, state.ownedPlayer, true);
          state.ownedPlayer.attachMediaElement(elements.video);
          state.ownedPlayer.load();
        } else {
          if (!canPlayHls()) {
            switchToNextCandidate(run, candidate, '当前环境不支持 HLS 播放');
            return;
          }

          state.ownedPlayer = new window.Hls(core.buildHlsConfig(run.extreme, core.shouldAutoChase(run)));
          attachPlayerEvents(run, candidate, state.ownedPlayer, false);
          state.ownedPlayer.loadSource(candidate.url);
          state.ownedPlayer.attachMedia(elements.video);
        }

        const startedAt = performance.now();
        try {
          const autoplay = await awaitWithTimeout(
            playWithAutoplayFallback(elements.video),
            core.getStartupTimeoutMs(run),
            '等待首帧超时');
          if (!isActive(run)) {
            return;
          }

          if (autoplay.mutedStart) {
            /*
              内核自动播放策略要求静音才能起播时，先用静音拿到首帧，
              再立刻恢复用户音量：这样"无需点击就能看"，音量也与滑块一致。
            */
            logToHost(core.LOG_LEVELS.INFO, '内核要求静音起播，已恢复音量 ' + state.lastVolume + '%');
            applyVolume(state.lastVolume);
          }

          markPlaybackStarted(run, candidate, startedAt);
        } catch (error) {
          if (!isActive(run)) {
            return;
          }

          /*
            自动播放策略拦截不是线路问题：这时候切候选只会把可用线路白白烧完，
            所以停在原地等用户点一下画面（点击处理器会接着播放）。
          */
          if (core.isAutoplayBlocked(error)) {
            state.autoplayBlocked = true;
            state.autoplayStartedAt = startedAt;
            logToHost(core.LOG_LEVELS.WARN, '自动播放被策略拦截，等待用户点击画面');
            report(outbound.WARNING, core.AUTOPLAY_BLOCKED_HINT, run, candidate, { errorName: error.name });
            setHint(core.AUTOPLAY_BLOCKED_HINT, 'warn');
            return;
          }

          report(outbound.WARNING, '首帧等待失败：' + (error && error.message), run, candidate, {
            errorName: error && error.name,
            errorMessage: error && error.message,
          });

          if (!run.playbackStarted) {
            switchToNextCandidate(run, candidate, '首帧超时或失败');
          } else {
            recoverAfterInterruption(run, candidate, '播放启动异常');
          }
        }
      }

      /**
       * 启动播放：先按当前音量尝试；被内核自动播放策略拦住时改用静音起播。
       *
       * 宿主 WebView2 已带 --autoplay-policy=no-user-gesture-required，
       * 正常路径下这里一次就成功；静音兜底只在内核策略不可用时生效，
       * 由调用方在起播后立刻恢复用户音量（见 startCandidate）。
       * @param {HTMLVideoElement} video 视频元素。
       * @returns {Promise<{mutedStart:boolean}>} 是否走了静音起播。
       */
      async function playWithAutoplayFallback(video) {
        try {
          await video.play();
          return { mutedStart: false };
        } catch (error) {
          if (!core.isAutoplayBlocked(error)) {
            throw error;
          }

          video.muted = true;
          await video.play();
          return { mutedStart: true };
        }
      }

      /** 首帧就绪：统一处理状态、界面、日志与上报。 */
      function markPlaybackStarted(run, candidate, startedAt) {
        run.playbackStarted = true;
        run.everPlayed = true;
        state.autoplayBlocked = false;
        state.pausedByUser = false;
        state.resumedAt = 0;
        run.lastPlaybackPosition = elements.video.currentTime;
        run.lastPlaybackProgressAt = Date.now();
        run.currentCandidateStartedAt = Date.now();
        // 新播放器刚起播：上一次会话的缓冲失控处置计数不能带过来。
        run.runawayChaseAttempts = 0;
        run.runawayHandledAt = 0;
        const firstFrameMs = Math.round(performance.now() - startedAt);
        elements.hint.classList.add('hidden');
        updatePauseButton();
        setStatus(core.formatPlaybackStatusText(run));
        logToHost(core.LOG_LEVELS.INFO, '首帧 ' + firstFrameMs + ' ms（' + candidate.host + '）');
        report(outbound.STATUS, '播放已开始', run, candidate, { firstFrameMs: firstFrameMs, mode: run.mode });
        startTelemetry(run);
      }

      /** 用户点击画面后接着播放被自动播放策略拦住的流。 */
      function resumeBlockedPlayback() {
        const run = state.run;
        const candidate = run ? run.currentCandidate : null;
        if (!isActive(run) || !candidate) {
          state.autoplayBlocked = false;
          return;
        }

        const startedAt = state.autoplayStartedAt || performance.now();
        state.autoplayBlocked = false;
        elements.video.play().then(function onStarted() {
          if (!isActive(run)) {
            return;
          }

          markPlaybackStarted(run, candidate, startedAt);
        }).catch(function onFailed(error) {
          logToHost(core.LOG_LEVELS.ERROR, '点击后仍无法播放：' + (error && error.message ? error.message : error));
          setHintLocked('仍无法开始播放，请回主界面重新点「开始播放」。', 'warn', 8000);
        });
      }

      /**
       * 判断事件是否来自"当前正在用的这个播放器"。
       *
       * 销毁后的事件仍会按队列送达：没有这道校验时，旧播放器的 ERROR / LOADING_COMPLETE
       * 会作用到刚建好的新会话上（表现为"刚连上就被判定断流，然后又重连"），
       * 参考播放页用 `player !== ownedPlayer` 做了同样的过滤。
       * @param {object} run 运行对象。
       * @param {object} player 事件所属的播放器。
       * @returns {boolean} 事件有效返回 true。
       */
      function isCurrentPlayer(run, player) {
        return isActive(run) && state.ownedPlayer === player;
      }

      /** 绑定播放器事件。 */
      function attachPlayerEvents(run, candidate, player, isFlv) {
        if (isFlv) {
          player.on(window.mpegts.Events.ERROR, function onMpegtsError(errorType, errorDetail, errorInfo) {
            if (!isCurrentPlayer(run, player)) {
              return;
            }

            const description = (errorInfo && (errorInfo.msg || errorInfo.reason || errorInfo.description)) || '';
            if (core.isHttpStatusInvalid(errorType, errorDetail, window.mpegts)) {
              switchToNextCandidate(run, candidate, '返回 HTTP 状态错误');
              return;
            }

            if (core.isMseError(errorDetail, window.mpegts) && core.isHevcUnsupportedDescription(description)) {
              handleHevcUnsupported(run, candidate, description);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, '播放器错误：' + description);
            } else {
              switchToNextCandidate(run, candidate, '播放器错误：' + description);
            }
          });

          player.on(window.mpegts.Events.LOADING_COMPLETE, function onLoadingComplete() {
            if (!isCurrentPlayer(run, player)) {
              return;
            }

            /*
              直播流没有"下载结束"：取满缓冲后 mpegts.js 也会报一次 LOADING_COMPLETE，
              此时重连等于固定间隔地重建连接，画面必然一顿一顿。
              只有画面确实不再前进或缓冲已空时才按断流处理；
              用户按了暂停时画面本来就不前进，这种"下载结束"属于预期，直接忽略。
              这里必须读页面的 pausedByUser：run 上没有这个字段（曾经读 run.pausedByUser，
              于是这道"用户暂停"的保护从未生效过）。
            */
            if (state.pausedByUser) {
              logToHost(core.LOG_LEVELS.INFO, '用户暂停期间的 LOADING_COMPLETE 不按断流处理');
              return;
            }

            const buffered = core.getLocalBufferSeconds(elements.video.buffered, elements.video.currentTime);
            const starved = core.looksStarved(elements.video, buffered);
            if (!core.shouldRecoverAfterLoadingComplete(run, Date.now(), starved)) {
              logToHost(core.LOG_LEVELS.INFO, '缓冲已取满，等待播放消耗（不重连）');
              return;
            }

            recoverAfterInterruption(run, candidate, '直播连接已结束');
          });
          return;
        }

        if (window.Hls && !isFlv) {
          player.on(window.Hls.Events.ERROR, function onHlsError(eventName, data) {
            if (!isCurrentPlayer(run, player) || !data) {
              return;
            }

            if (!data.fatal) {
              return;
            }

            const detail = String(data.details || data.type || 'HLS 错误');
            if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
              handleHevcUnsupported(run, candidate, detail);
              return;
            }

            if (run.playbackStarted) {
              recoverAfterInterruption(run, candidate, 'HLS 错误：' + detail);
            } else {
              switchToNextCandidate(run, candidate, 'HLS 错误：' + detail);
            }
          });
        }
      }

      /** HEVC 无法解码时的终止处理：明确提示并建议使用 mpv。 */
      function handleHevcUnsupported(run, candidate, description) {
        const message = hevcMseSupported
          ? '该直播流实际为 HEVC 编码，但系统拒绝了对应的 MSE 解码器；请改用左栏「mpv 播放」。'
          : '该直播流实际为 HEVC（H.265）编码，当前系统不支持 HEVC 解码，请改用左栏「mpv 播放」。';
        report(outbound.ERROR, message, run, candidate, { errorMessage: description });
        stopRun(run);
        destroyPlayer();
        state.currentStreamUrl = '';
        setHintLocked(message, 'error', 20000);
      }

      /** 切换到下一个候选。 */
      function switchToNextCandidate(run, candidate, reason) {
        if (!isActive(run) || run.switching) {
          return;
        }

        run.switching = true;
        run.playbackStarted = false;
        report(outbound.WARNING, '切换线路：' + reason, run, candidate);
        logToHost(core.LOG_LEVELS.WARN, '切换线路：' + reason);
        destroyPlayer();

        run.queue.shift();
        if (run.queue.length === 0) {
          /*
            这里必须先解除"正在切换"：`requestFreshSources` 之后没有起播路径会再复位它，
            留着 true 会让 `switching` 永久锁住（此后任何恢复分支都被它挡住）。
          */
          run.switching = false;
          requestFreshSources(run, '所有候选线路均不可用');
          return;
        }

        const next = run.queue[0];
        run.switching = false;
        void startCandidate(run, next);
      }

      /** 断流后的重连（每个候选最多两次）。 */
      function recoverAfterInterruption(run, candidate, reason) {
        /*
          重入保护只看真正会被设置的标志位：`switching`（正在切候选）与 `reconnecting`（已排定一次重连）。
          过去这里还看一个从未被赋值过的 `run.recovering`（恒为 false），它给了"有重入保护"的错觉。
        */
        if (!isActive(run) || run.reconnecting || run.switching) {
          return;
        }

        const now = Date.now();
        if (run.currentCandidateStartedAt > 0 && now - run.currentCandidateStartedAt >= core.RECONNECT_COUNTER_RESET_MS) {
          run.reconnectsBySource.set(candidate.sourceIndex, 0);
        }

        const reconnectCount = run.reconnectsBySource.get(candidate.sourceIndex) || 0;
        const delay = core.getReconnectDelayMs(reconnectCount);
        if (delay < 0) {
          /*
            这里不再先把 switching 置 true 再置回来：`switchToNextCandidate` 自己会置位并守门，
            中间那次"强制解锁"会让同一个候选在本轮里被重复切换（重复销毁播放器 = 画面连续重建）。
          */
          report(outbound.WARNING, '当前线路重连未恢复，切换线路', run, candidate, { reconnectCount: reconnectCount });
          logToHost(core.LOG_LEVELS.WARN, '当前线路重连 ' + reconnectCount + ' 次未恢复，切换线路');
          switchToNextCandidate(run, candidate, reason);
          return;
        }

        run.reconnecting = true;
        run.reconnectsBySource.set(candidate.sourceIndex, reconnectCount + 1);
        report(outbound.RECONNECTING, '重连中（第 ' + (reconnectCount + 1) + ' 次）：' + reason, run, candidate, {
          reconnectCount: reconnectCount + 1,
        });
        setStatus('重连中（第 ' + (reconnectCount + 1) + ' 次）…');

        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
        }

        run.recoveryTimer = window.setTimeout(function reconnectNow() {
          run.recoveryTimer = null;
          if (!isActive(run)) {
            return;
          }

          run.reconnecting = false;
          run.switching = false;
          run.playbackStarted = false;
          run.lastPlaybackPosition = 0;
          run.lastPlaybackProgressAt = Date.now();
          void startCandidate(run, candidate);
        }, delay);
      }

      /** 请求宿主重新解析（每个会话只请求一次）。 */
      function requestFreshSources(run, reason) {
        if (!isActive(run) || run.refreshRequested) {
          return;
        }

        run.refreshRequested = true;
        destroyPlayer();
        state.currentStreamUrl = '';
        setHintLocked('播放失败：所有线路都连不上（可能未开播、地区受限或网络问题）。\n正在请主程序重新解析…\n' + reason, 'error', 10000);
        report(outbound.REFRESH_NEEDED, reason, run, run.currentCandidate);
      }

      /**
       * 缓冲失控自救：数据一直在到达、缓冲一直在增长、画面却不再前进。
       *
       * 为什么要单独做这件事（真机实测 B站 814：bufferedAheadMs 81.9→111.9 秒、画面 82→112 秒没前进、
       * reconnects 恒为 0）：画面停住时若没有人 seek，缓冲会按网络速率无上限增长，而两条既有追帧路径都进不去——
       * mpegts.js 的延迟追帧器只在元素**未暂停**时生效（`liveBufferLatencyChasingOnPaused` 默认关闭），
       * 且直播流（`isLive: true`）在 mpegts.js 里**不做下载节流**，所以数据会一直堆；
       * 页面的手动追帧又只在用户点按钮 / 换档位 / 继续播放时触发。
       * 处置顺序由 `core.decideBufferRunawayAction` 决定：先恢复播放、再追帧，自行处置用尽后交给既有重连 / 切候选。
       * @param {object} run 运行对象。
       * @param {HTMLVideoElement} video 视频元素。
       * @param {number|null} localBuffer 本地缓冲剩余秒数。
       * @param {number} silenceMs 画面停滞时长（毫秒）。
       */
      function handleBufferRunaway(run, video, localBuffer, silenceMs) {
        const aheadMs = Math.round((Number(localBuffer) || 0) * 1000);
        const aheadSeconds = Math.round(aheadMs / 1000);
        const stalledSeconds = Math.round(silenceMs / 1000);
        const now = Date.now();
        const sinceHandledMs = run.runawayHandledAt > 0 ? now - run.runawayHandledAt : Number.POSITIVE_INFINITY;
        const action = core.decideBufferRunawayAction(
          localBuffer,
          silenceMs,
          state.pausedByUser,
          video.paused,
          run.runawayChaseAttempts,
          sinceHandledMs);

        if (action === core.RUNAWAY_ACTIONS.RECONNECT) {
          logToHost(core.LOG_LEVELS.WARN, '缓冲失控：' + aheadSeconds + ' 秒缓冲未被消耗且追帧无效，按断流处理');
          report(outbound.WARNING, '缓冲失控且追帧无效，改为重连', run, run.currentCandidate, {
            bufferedAheadMs: aheadMs,
            secondsSinceProgress: stalledSeconds,
            runawayChaseAttempts: run.runawayChaseAttempts,
          });
          run.runawayChaseAttempts = 0;
          run.runawayHandledAt = 0;
          recoverAfterInterruption(run, run.currentCandidate, '缓冲失控（' + aheadSeconds + ' 秒缓冲未被消耗）');
          return;
        }

        run.runawayChaseAttempts += 1;
        run.runawayHandledAt = now;
        if (action === core.RUNAWAY_ACTIONS.RESUME) {
          /*
            元素被"非用户原因"暂停（用户没点暂停）：先把播放意图恢复回来，
            否则任何追帧都不会被消费（mpegts.js 的追帧器也会因 paused 而完全跳过）。
          */
          logToHost(core.LOG_LEVELS.WARN, '画面被暂停但用户没有点过暂停，已恢复播放');
          video.play().catch(function onResumeFailed(error) {
            logToHost(core.LOG_LEVELS.WARN, '恢复播放失败：' + (error && error.message ? error.message : error));
          });
        }

        const chased = chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        logToHost(core.LOG_LEVELS.WARN, '缓冲失控：' + aheadSeconds + ' 秒缓冲未被消耗（画面停滞 '
          + stalledSeconds + ' 秒），已追帧到直播边缘（第 ' + run.runawayChaseAttempts + ' 次，追帧'
          + (chased ? '成功' : '失败') + '）');
        report(outbound.WARNING, '缓冲失控追帧', run, run.currentCandidate, {
          bufferedAheadMs: aheadMs,
          secondsSinceProgress: stalledSeconds,
          runawayChaseAttempts: run.runawayChaseAttempts,
          chased: chased,
        });
      }

      /** 启动遥测与卡顿检测。 */
      function startTelemetry(run) {
        if (state.telemetryTimer !== null) {
          window.clearInterval(state.telemetryTimer);
        }

        state.telemetryTimer = window.setInterval(function onTick() {
          if (!isActive(run)) {
            return;
          }

          const video = elements.video;
          if (core.hasProgressed(video.currentTime, run.lastPlaybackPosition)) {
            run.lastPlaybackPosition = video.currentTime;
            run.lastPlaybackProgressAt = Date.now();
            // 画面重新前进：这一次的缓冲失控已经结束，处置计数归零。
            run.runawayChaseAttempts = 0;
            run.runawayHandledAt = 0;
          }

          const silenceMs = Date.now() - run.lastPlaybackProgressAt;
          const localBuffer = core.getLocalBufferSeconds(video.buffered, video.currentTime);
          const starved = core.looksStarved(video, localBuffer);

          /*
            把实测到的本地缓冲剩余量记为"实际延迟"，供状态行显示真实数值：
            取不到缓冲（localBuffer === null）时写 null，状态行就不显示延迟段，
            绝不用档位值（150/200/250）冒充实测结果。
          */
          run.lastLatencyMs = localBuffer === null ? null : Math.round(localBuffer * 1000);
          refreshPlaybackStatus(run);

          /*
            不在这里"自动回落到稳定档"：那会把 150/200/250 三档悄悄改成别的东西，
            而档位入口只有画面下方一处，用户看到的档位必须就是真正生效的档位。
            抖动时该做的是按本模式的阈值尽快重连（见 core.isPlaybackStalled），
            而不是替用户改设置——参考播放页同样只做重连、不改档位。
          */
          if (run.playbackStarted && !run.switching && !run.reconnecting) {
            // 缓冲远大于目标延迟却不再前进：先自救（恢复播放 / 追帧），无效才走重连。
            if (core.isBufferRunaway(localBuffer, silenceMs, state.pausedByUser)) {
              handleBufferRunaway(run, video, localBuffer, silenceMs);
              return;
            }

            if (core.isPlaybackStalled(silenceMs, starved, state.resumedAt, Date.now(), run.extreme, state.pausedByUser)) {
              recoverAfterInterruption(run, run.currentCandidate, '画面进度超过 ' + Math.round(silenceMs / 1000) + ' 秒未前进');
              return;
            }
          }

          const now = Date.now();
          if (now - run.lastTelemetryReportedAt >= core.TELEMETRY_REPORT_INTERVAL_MS) {
            run.lastTelemetryReportedAt = now;
            let quality = null;
            if (typeof video.getVideoPlaybackQuality === 'function') {
              quality = video.getVideoPlaybackQuality();
            }

            report(outbound.TELEMETRY, '遥测', run, run.currentCandidate, {
              currentTime: video.currentTime,
              bufferedAheadMs: run.lastLatencyMs,
              readyState: video.readyState,
              networkState: video.networkState,
              paused: video.paused,
              /*
                paused 是"元素"的状态，pausedByUser 才是"用户意图"。
                实测坏状态里两者不一致（元素停了、用户没点暂停），故障排查必须能区分，
                因此把它俩与缓冲失控处置次数一起上报。
              */
              pausedByUser: state.pausedByUser,
              elementPaused: video.paused,
              ended: video.ended,
              playbackRate: video.playbackRate,
              secondsSinceProgress: Math.round(silenceMs / 1000),
              droppedVideoFrames: quality ? quality.droppedVideoFrames : null,
              totalVideoFrames: quality ? quality.totalVideoFrames : null,
              mode: run.mode,
              extremeTargetMs: run.extremeTargetMs,
              runawayChaseAttempts: run.runawayChaseAttempts,
              reconnects: run.reconnectsBySource.get(run.currentCandidate ? run.currentCandidate.sourceIndex : -1) || 0,
            });
          }
        }, core.TELEMETRY_INTERVAL_MS);
      }

      /**
       * 立刻跳到直播最新位置（缓冲末端前 keepSeconds 秒）。
       * @param {number} keepSeconds 保留的缓冲秒数。
       * @returns {boolean} 缓冲可用并已跳到目标位置（或已在目标位置）返回 true。
       */
      function chaseToLiveEdge(keepSeconds) {
        const video = elements.video;
        const ranges = video.buffered;
        if (!ranges || ranges.length === 0) {
          return false;
        }

        const last = ranges.length - 1;
        const target = core.computeChaseTargetSeconds(ranges.start(last), ranges.end(last), keepSeconds);
        if (!Number.isFinite(target) || Math.abs(video.currentTime - target) <= 0.01) {
          return true;
        }

        try {
          video.currentTime = target;
        } catch (error) {
          // 缓冲异常大时 seek 目标可能落在 seekable 之外：这里只记录失败，由调用方决定是否升级为重连。
          logToHost(core.LOG_LEVELS.WARN, '追帧失败：' + (error && error.message ? error.message : error));
          return false;
        }

        return true;
      }

      /** 停止一个播放会话。 */
      function stopRun(run) {
        if (!run) {
          return;
        }

        run.stopped = true;
        if (run.recoveryTimer !== null) {
          window.clearTimeout(run.recoveryTimer);
          run.recoveryTimer = null;
        }

        // 会话结束时中止所有在途探测请求，避免它们在新会话里读到过期结果。
        for (const controller of run.controllers) {
          try {
            controller.abort();
          } catch (abortError) {
            logToHost(core.LOG_LEVELS.WARN, '中止探测请求失败：' + (abortError && abortError.message));
          }
        }

        run.controllers.clear();
        destroyPlayer();
      }

      /** 处理宿主下发的 play 消息。 */
      async function handlePlay(payload) {
        renderTargets(payload);
        if (state.run) {
          // 切换画质/重新解析时先给一句话，避免旧画面销毁后出现纯黑屏。
          setHint('正在切换到新线路…', 'info');
          stopRun(state.run);
          state.run = null;
        }

        state.refreshRequested = false;
        state.pausedByUser = false;
        state.resumedAt = 0;
        const normalized = core.buildPlaybackPlan(
          payload,
          canPlayFlv(),
          canPlayHls(),
          hevcMseSupported);

        const plan = normalized.plan;
        if (!plan || plan.candidates.length === 0) {
          const message = normalized.unsupportedCount > 0
            ? '候选线路均无法在本页播放（编码或格式不受支持），请点击「mpv 播放」。'
            : '没有可用的候选线路。';
          setHintLocked(message, 'error', 20000);
          report(outbound.ERROR, message, null, null, { unsupportedCount: normalized.unsupportedCount });
          return;
        }

        const run = {
          sessionId: plan.sessionId,
          mode: plan.mode,
          extreme: plan.extreme,
          extremeTargetMs: plan.extremeTargetMs,
          extremeTargetSeconds: plan.extremeTargetSeconds,
          candidates: plan.candidates,
          queue: [],
          attempted: new Set(),
          /** 探测请求的中止控制器：会话结束时统一 abort，避免留下半开的探测连接。 */
          controllers: new Set(),
          stopped: false,
          switching: false,
          reconnecting: false,
          playbackStarted: false,
          everPlayed: false,
          refreshRequested: false,
          currentCandidate: null,
          currentCandidateStartedAt: 0,
          reconnectCount: 0,
          reconnectsBySource: new Map(),
          recoveryTimer: null,
          lastPlaybackPosition: 0,
          lastPlaybackProgressAt: Date.now(),
          lastTelemetryReportedAt: 0,
          /** 本次缓冲失控里已经自行处置（恢复播放 / 追帧）的次数。 */
          runawayChaseAttempts: 0,
          /** 上一次缓冲失控自行处置的时间戳（0 表示还没处置过）。 */
          runawayHandledAt: 0,
          /** 是否保留库内自动追帧；false 表示用户点了「停止追帧」（不暂停播放）。 */
          autoChaseEnabled: true,
          /** 最近一次遥测测到的真实延迟（毫秒）；没有测量值时为 null，状态行据此决定是否显示延迟段。 */
          lastLatencyMs: null,
        };

        state.roomTitle = typeof payload.title === 'string' ? payload.title : '';

        state.run = run;
        // 新会话默认开启自动追帧：按钮必须回到「追帧」，不能留着上一轮的「停止追帧」。
        syncChaseButton();
        setStatus('正在检测候选线路…');
        logToHost(core.LOG_LEVELS.INFO, '开始播放会话 #' + run.sessionId + '（' + core.modeLabel(run) + '）');

        const queue = await buildCandidateQueue(run);
        if (!isActive(run)) {
          return;
        }

        run.queue = queue;
        if (queue.length === 0) {
          const message = normalized.unsupportedCount > 0
            ? '所有候选线路都不被本页支持，请点击「mpv 播放」。'
            : '所有候选线路都拒绝了内置播放器的请求，请点击「mpv 播放」或稍后重试。';
          setHintLocked(message, 'error', 10000);
          report(outbound.ERROR, message, run, null, { mode: run.mode });
          return;
        }

        await startCandidate(run, queue[0]);
      }

      /**
       * 把当前档位与追帧开关写进正在播放的播放器（mpegts.js / hls.js 都支持热改配置）。
       *
       * 按当前候选的格式选配置：过去这里无条件写 mpegts 配置，
       * 于是 HLS 会话上"改档位"会静默失败（hls.js 不认这些键），用户看到的是"档位改了但没生效"。
       * 追帧开关走同一个入口，保证"停止追帧"与"改档位"用的是同一份配置推导。
       * @param {object} run 运行对象（含 extreme / extremeTargetSeconds / autoChaseEnabled / currentCandidate）。
       */
      function applyPlayerTargetConfig(run) {
        const player = state.ownedPlayer;
        if (!player || typeof player.configure !== 'function') {
          return;
        }

        const autoChase = core.shouldAutoChase(run);
        const candidate = run.currentCandidate;
        const config = candidate && core.isHlsCandidate(candidate)
          ? core.buildHlsConfig(run.extreme, autoChase)
          : core.buildMpegtsConfig(run.extreme, run.extremeTargetSeconds, autoChase);
        try {
          player.configure(config);
        } catch (error) {
          logToHost(core.LOG_LEVELS.WARN, '应用追帧配置失败：' + (error && error.message ? error.message : error));
        }
      }

      /** 把当前追帧开关同步到合并按钮的文案与提示。 */
      function syncChaseButton() {
        const autoChase = core.shouldAutoChase(state.run);
        elements.chaseBtn.textContent = core.chaseButtonLabel(autoChase);
        elements.chaseBtn.title = autoChase
          ? '停止自动追帧（不暂停播放，画面改为正常倍速实时播放）'
          : '开启自动追帧并立刻追一次帧（跳到直播最新位置）';
      }

      /**
       * 合并后的「追帧 / 停止追帧」按钮。
       *
       * 语义（与「暂停播放」的区别：这里**不**调用 `video.pause()`、不销毁播放器、不释放地址）：
       *  - 点「追帧」= 开启自动追帧**并立刻追一次帧**（保留原一次性追帧的效果）；
       *  - 点「停止追帧」= 关闭自动追帧，画面以正常倍速实时推进，不再按目标延迟拉回。
       * 缓冲失控自救属于兜底保护，不随本开关关闭。
       */
      function toggleChase() {
        const run = state.run;
        if (!run) {
          logToHost(core.LOG_LEVELS.WARN, '当前没有正在播放的会话，无法切换追帧');
          return;
        }

        const enabling = !core.shouldAutoChase(run);
        run.autoChaseEnabled = enabling;
        applyPlayerTargetConfig(run);
        if (enabling) {
          // 点「追帧」等价于"开启自动追帧 + 立刻追一次"，这里保留原来一次性追帧的效果。
          chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        }

        syncChaseButton();
        setStatus(core.formatPlaybackStatusText(run));
        const message = enabling
          ? '已开启自动追帧（目标延迟 ' + run.extremeTargetMs + ' ms）'
          : '已停止自动追帧（画面以正常倍速播放，不再自动拉回目标延迟）';
        logToHost(core.LOG_LEVELS.INFO, message);
        report(outbound.STATUS, message, run, run.currentCandidate, {
          autoChaseEnabled: enabling,
        });
      }

      /** 刷新"暂停播放 / 继续播放"按钮文案与画面状态提示。 */
      function updatePauseButton() {
        const paused = state.pausedByUser;
        elements.pauseBtn.textContent = paused ? '继续播放' : '暂停播放';
        elements.pauseBtn.title = paused ? '从当前位置继续播放' : '暂停但不结束会话（地址与缓冲保留）';
      }

      /**
       * 暂停 / 继续播放：暂停不销毁播放器，保留会话与当前地址。
       * @param {boolean} [paused] 目标状态；缺省时在两种状态之间切换。
       */
      function togglePausePlayback(paused) {
        const run = state.run;
        if (!state.pausedByUser && !isActive(run)) {
          logToHost(core.LOG_LEVELS.WARN, '当前没有正在播放的会话');
          return;
        }

        const wantPause = typeof paused === 'boolean' ? paused : !state.pausedByUser;
        if (wantPause) {
          state.pausedByUser = true;
          state.pausedAtSeconds = elements.video.currentTime;
          try {
            elements.video.pause();
          } catch (error) {
            logToHost(core.LOG_LEVELS.WARN, '暂停失败：' + (error && error.message ? error.message : error));
          }

          updatePauseButton();
          setStatus('已暂停（保留当前地址）');
          logToHost(core.LOG_LEVELS.INFO, '已暂停播放，会话与地址保留');
          report(outbound.STATUS, '已暂停播放', run, run ? run.currentCandidate : null);
          return;
        }

        resumePlayback(run);
      }

      /** 继续播放：离直播边缘太远时先跳到缓冲末端，避免落后越来越多。 */
      function resumePlayback(run) {
        state.pausedByUser = false;
        state.resumedAt = Date.now();
        if (run) {
          run.lastPlaybackProgressAt = state.resumedAt;
          run.lastPlaybackPosition = elements.video.currentTime;
          run.runawayChaseAttempts = 0;
          run.runawayHandledAt = 0;
        }

        const buffered = core.getLocalBufferSeconds(elements.video.buffered, elements.video.currentTime);
        if (buffered !== null && buffered > core.PLAY_RESTORE_TOLERANCE_SECONDS) {
          chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS);
        }

        updatePauseButton();
        elements.video.play().then(function onResumed() {
          setStatus('已继续播放');
          logToHost(core.LOG_LEVELS.INFO, '已从当前位置继续播放');
          report(outbound.STATUS, '已继续播放', run, run ? run.currentCandidate : null);
        }).catch(function onFailed(error) {
          logToHost(core.LOG_LEVELS.ERROR, '继续播放失败：' + (error && error.message ? error.message : error));
          setHintLocked('继续播放失败，请重新点「开始播放」。', 'warn', 8000);
        });
      }

      /** 把当前档位同步到页面的档位下拉。 */
      function syncTargetSelect() {
        const value = String(state.run && Number.isFinite(state.run.extremeTargetMs)
          ? state.run.extremeTargetMs
          : state.targetMs);
        if (elements.targetSelect.value !== value) {
          elements.targetSelect.value = value;
        }
      }

      /**
       * 渲染追帧档位下拉：档位清单来自 player-core，页面不写死数字。
       * @param {object} payload 宿主下发的 play 消息（缺省时用页面记住的档位）。
       */
      function renderTargets(payload) {
        const selected = core.normalizeExtremeTargetSeconds(payload && payload.extremeTargetMs) * 1000;
        elements.targetSelect.replaceChildren();
        for (const milliseconds of core.EXTREME_TARGETS_MS) {
          const option = document.createElement('option');
          option.value = String(milliseconds);
          option.textContent = milliseconds + ' ms';
          option.selected = milliseconds === selected;
          elements.targetSelect.appendChild(option);
        }

        state.targetMs = selected;
        syncTargetSelect();
      }

      /**
       * 请求宿主开始播放当前已解析的直播间。
       * @param {boolean} silent 为 true 时不改状态行（页面初始化阶段的静默同步）。
       */
      function requestPlayFromHost(silent) {
        report(outbound.REQUEST_PLAY, '页面请求开始播放');
        if (!silent) {
          setStatus('正在请求主程序开始播放…');
          logToHost(core.LOG_LEVELS.INFO, '已请求主程序开始播放当前已解析的房间');
        }
      }

      /**
       * 用户点了「停止播放」：结束会话、销毁播放器、把画面关掉，并请宿主回收中继。
       *
       * 与「暂停播放」的区别：暂停只 `video.pause()`（保留播放器、地址与缓冲，可原地继续），
       * 停止则释放整套会话——画面回到空态，宿主释放中继，下次观看要点「开始播放」重新解析下发。
       * 必须上报宿主：中继地址由宿主注册，不通知它就会一直挂着没人回收。
       */
      function requestStopFromHost() {
        const run = state.run;
        if (!run && !state.pausedByUser) {
          logToHost(core.LOG_LEVELS.WARN, '当前没有正在播放的会话，停止请求已忽略');
          return;
        }

        report(outbound.REQUEST_STOP, '用户点了「停止播放」', run, run ? run.currentCandidate : null);
        handleStop();
        setStatus('已停止播放（画面已关闭）');
        logToHost(core.LOG_LEVELS.INFO, '已停止播放并销毁播放器，画面已关闭');
      }

      /** 处理宿主下发的 chase 消息。 */
      function handleChase(payload) {
        const keep = payload && payload.keepSeconds;
        if (chaseToLiveEdge(keep)) {
          logToHost(core.LOG_LEVELS.INFO, '已追帧到直播最新位置');
        } else {
          logToHost(core.LOG_LEVELS.WARN, '追帧失败：缓冲区为空');
        }
      }

      /** 处理宿主下发的 stop 消息（兼容旧宿主：结束会话并回到空态）。 */
      function handleStop() {
        if (state.run) {
          report(outbound.STATUS, '播放已停止', state.run, state.run.currentCandidate);
          stopRun(state.run);
          state.run = null;
        }

        destroyPlayer();
        state.currentStreamUrl = '';
        state.autoplayBlocked = false;
        state.autoplayStartedAt = 0;
        state.pausedByUser = false;
        state.resumedAt = 0;
        updatePauseButton();
        // 会话已结束：追帧按钮回到「追帧」，避免停播后仍显示「停止追帧」。
        syncChaseButton();
        showEmptyState();
        setStatus(core.STATUS_IDLE_TEXT);
      }

      /** 更新音量：界面与视频元素用同一份夹取后的百分比；有声音时同时记住它供"点画面切换静音"使用。 */
      function applyVolume(value) {
        const percent = core.clampVolumePercent(value);
        elements.video.volume = core.volumePercentToGain(percent);
        elements.video.muted = core.shouldMuteAtVolume(percent);
        elements.volume.value = String(percent);
        elements.volumeLabel.textContent = percent + '%';
        elements.volDisplay.textContent = '音量：' + percent + '%';
        elements.volDisplay.classList.remove('hidden');
        window.setTimeout(function hideVolume() {
          elements.volDisplay.classList.add('hidden');
        }, 1500);
        /*
          只要确实有声音就记下这个音量：video 元素默认带 muted 属性（与参考播放页一致，
          避免首帧前的试音），起播兜底路径会立刻用本函数恢复音量。
          若只在 remember=true 时记录，兜底恢复后"点画面切换静音"会退回到 0%。
        */
        if (percent > 0) {
          state.lastVolume = percent;
          state.muteToggleVolume = percent;
        }
      }

      /** 绑定控件事件。 */
      function bindControls() {
        elements.volume.addEventListener('input', function onVolumeInput() {
          applyVolume(elements.volume.value);
        });

        elements.video.addEventListener('wheel', function onWheel(event) {
          event.preventDefault();
          applyVolume(elements.video.volume * 100 + (event.deltaY < 0 ? 10 : -10));
        }, { passive: false });

        elements.video.addEventListener('click', function onVideoClick() {
          // 被自动播放策略拦住时，点画面是"开始播放"；否则沿用点画面切换静音。
          if (state.autoplayBlocked) {
            resumeBlockedPlayback();
            return;
          }

          const next = elements.video.muted ? state.lastVolume : 0;
          applyVolume(next);
        });

        /*
          全屏：只用 #stage 作为全屏元素（video 填满 stage），并显式处理 Promise 失败，
          避免"点了没反应"却没有任何反馈。
        */
        function requestStageFullscreen() {
          const target = elements.stage;
          if (!target || typeof target.requestFullscreen !== 'function') {
            setHintLocked('当前内核不支持全屏 API，可用主界面的窗口最大化代替。', 'warn', 6000);
            return;
          }

          const request = target.requestFullscreen();
          if (request && typeof request.then === 'function') {
            request.then(function onEntered() {
              logToHost(core.LOG_LEVELS.INFO, '已进入全屏');
            }).catch(function onFailed(error) {
              logToHost(core.LOG_LEVELS.ERROR, '进入全屏失败：' + (error && error.message ? error.message : error));
              setHintLocked('进入全屏失败，可尝试双击画面或按 F11。', 'warn', 6000);
            });
          }
        }

        function exitStageFullscreen() {
          const request = document.exitFullscreen();
          if (request && typeof request.then === 'function') {
            request.catch(function onFailed(error) {
              logToHost(core.LOG_LEVELS.ERROR, '退出全屏失败：' + (error && error.message ? error.message : error));
            });
          }
        }

        function toggleFullscreen() {
          if (document.fullscreenElement) {
            exitStageFullscreen();
          } else {
            requestStageFullscreen();
          }
        }

        elements.fsBtn.addEventListener('click', toggleFullscreen);
        elements.video.addEventListener('dblclick', toggleFullscreen);

        document.addEventListener('fullscreenchange', function onFullscreenChange() {
          const fullscreen = Boolean(document.fullscreenElement);
          /*
            提示的可见性只由"是否已经在播"决定：过去这里在退出全屏时无条件取消隐藏，
            于是被藏起来的空态文案（等待直播源）又盖回画面，看起来像直播源丢了。
          */
          elements.hint.classList.toggle('hidden', core.shouldHideHint(state.run));
          elements.volDisplay.classList.add('hidden');
          document.body.style.cursor = fullscreen ? 'none' : 'default';
          elements.fsBtn.textContent = fullscreen ? '退出全屏' : '全屏';

          /*
            关键：把全屏状态告诉宿主。WebView2 只有在宿主把对应元素标记为全屏元素
            （CoreWebView2.ContainsFullScreenElement）后才会真正铺满窗口，
            否则"点了全屏但画面尺寸不变"，看起来就是全屏失败。
          */
          report(fullscreen ? outbound.FULLSCREEN_ENTER : outbound.FULLSCREEN_EXIT, fullscreen ? '进入全屏' : '退出全屏');
        });

        document.addEventListener('keydown', function onKeyDown(event) {
          if (event.key === 'F11' || (event.key === 'Enter' && event.altKey)) {
            event.preventDefault();
            toggleFullscreen();
          }
        });

        elements.qualitySelect.addEventListener('change', function onQualityChange() {
          const key = elements.qualitySelect.value;
          if (!key || key === state.qualityKey) {
            return;
          }

          state.qualityKey = key;
          report(outbound.QUALITY, '切换画质：' + (elements.qualitySelect.selectedOptions[0]?.textContent || key), state.run, state.run?.currentCandidate, { key: key });
        });

        elements.chaseBtn.addEventListener('click', function onChaseClick() {
          toggleChase();
        });

        elements.targetSelect.addEventListener('change', function onTargetChange() {
          const milliseconds = Number(elements.targetSelect.value);
          if (!core.EXTREME_TARGETS_MS.includes(milliseconds)) {
            return;
          }

          const run = state.run;
          if (!run || !applyExtremeTargetValue(run, milliseconds)) {
            state.targetMs = core.normalizeExtremeTargetSeconds(milliseconds) * 1000;
            return;
          }

          applyPlayerTargetConfig(run);
          if (chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS)) {
            report(outbound.STATUS, '追帧档位已切换为 ' + run.extremeTargetMs + ' ms', run, run.currentCandidate);
          }

          state.targetMs = run.extremeTargetMs;
          report(outbound.TARGET, '追帧档位：' + run.extremeTargetMs + ' ms', run, run.currentCandidate, {
            extremeTargetMs: run.extremeTargetMs,
          });
        });

        elements.pauseBtn.addEventListener('click', function onPauseClick() {
          togglePausePlayback();
        });

        elements.playBtn.addEventListener('click', function onPlayClick() {
          requestPlayFromHost(false);
        });

        elements.stopBtn.addEventListener('click', function onStopClick() {
          requestStopFromHost();
        });
      }

      /**
       * 本地热切换追帧档位并记下当前值。
       * @param {object} run 运行对象。
       * @param {number} milliseconds 目标延迟（毫秒），仅接受三档。
       * @returns {boolean} 档位发生变化返回 true。
       */
      function applyExtremeTargetValue(run, milliseconds) {
        if (!core.applyExtremeTarget(run, milliseconds)) {
          return false;
        }

        state.targetMs = run.extremeTargetMs;
        return true;
      }

      /**
       * 渲染画质下拉：始终显示，只有一档时显示当前档位并禁用切换。
       * @param {object} payload 宿主下发的 play 消息。
       */
      function renderQualities(payload) {
        const normalized = core.normalizeQualities(payload?.qualities, payload?.selectedQualityKey);
        state.qualityKey = normalized.selectedKey;
        elements.qualitySelect.replaceChildren();
        for (const item of normalized.items) {
          const option = document.createElement('option');
          option.value = item.key;
          option.textContent = item.label;
          option.selected = item.selected;
          elements.qualitySelect.appendChild(option);
        }

        // 只有一档也显示：用户需要看到"当前就是最高档"，而不是控件凭空消失。
        const canSwitch = normalized.items.length > 1;
        elements.qualitySelect.disabled = !canSwitch;
        elements.qualitySelect.title = canSwitch ? '切换画质档位' : '当前房间只有这一个档位';
      }

      /** 追帧档位热切换（宿主下发 target 消息时调用，不重连）。 */
      function handleTargetChange(payload) {
        const run = state.run;
        if (!run || !applyExtremeTargetValue(run, Number(payload.extremeTargetMs))) {
          state.targetMs = core.normalizeExtremeTargetSeconds(payload.extremeTargetMs) * 1000;
          syncTargetSelect();
          return;
        }

        applyPlayerTargetConfig(run);
        syncTargetSelect();
        if (chaseToLiveEdge(core.CHASE_KEEP_DEFAULT_SECONDS)) {
          report(outbound.STATUS, '追帧档位已切换为 ' + run.extremeTargetMs + ' ms', run, run.currentCandidate);
        }
      }

      /** 处理来自宿主的消息。 */
      function handleHostMessage(payload) {
        if (!payload || typeof payload !== 'object') {
          return;
        }

        switch (payload.type) {
          case core.INBOUND_MESSAGE_TYPES.PLAY:
            renderQualities(payload);
            void handlePlay(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.CHASE:
            handleChase(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.STOP:
            handleStop();
            break;
          case core.INBOUND_MESSAGE_TYPES.TARGET:
            handleTargetChange(payload);
            break;
          case core.INBOUND_MESSAGE_TYPES.PAUSE:
            togglePausePlayback(typeof payload.paused === 'boolean' ? payload.paused : undefined);
            break;
          case core.INBOUND_MESSAGE_TYPES.HOST_STATUS:
            applyHostStatus(payload);
            break;
          default:
            if (payload.type === 'volume') {
              applyVolume(payload.value);
            } else if (payload.type === 'bridge-info') {
              state.bridgeBaseAddress = typeof payload.baseAddress === 'string' ? payload.baseAddress : '';
              logToHost(core.LOG_LEVELS.INFO, '桥接服务地址：' + (state.bridgeBaseAddress || '未启动'));
            } else {
              logToHost(core.LOG_LEVELS.WARN, '收到未知消息类型：' + payload.type);
            }

            break;
        }
      }

      bindControls();
      renderTargets({ extremeTargetMs: core.DEFAULT_EXTREME_TARGET_MS });
      applyVolume(core.INITIAL_VOLUME_PERCENT);
      updatePauseButton();
      syncChaseButton();
      showEmptyState();
      renderStatusLine();

      if (hostChannel) {
        hostChannel.onMessage(handleHostMessage);
      } else {
        setHint('当前不在 StreamPilot 主程序内运行：可直接用 mpv 播放解析出的地址。', 'warn');
        logToHost(core.LOG_LEVELS.WARN, '未检测到 WebView2 宿主通道，控件仍可用于本地调试。');
      }

      report(outbound.READY, 'StreamPilot 播放器已加载。', null, null, {
        hevc: hevcMseSupported,
        avc: avcMseSupported,
      });
    }());
  </script>
</body>

</html>
